# Changes here will be overwritten by Copier; edit with `copier update --data`.
_commit: v0.0.87
_src_path: https://github.com/victor-software-house/templates.git
ci_runner: github-hosted
clippy_disallowed_methods: []
clippy_disallowed_types: []
default_branch: main
deny_bans: []
deny_ignore:
-   id: RUSTSEC-2023-0071
    reason: 'rsa code is linked but never run: verctl signs no JWT. octocrab requires
        a JWT backend, and the other one builds aws-lc with C and cmake. Remove when
        rsa ships a fix or octocrab no longer requires it.'
deny_licenses:
-   license: BSD-3-Clause
    reason: subtle, curve25519-dalek, ed25519-dalek (octocrab's JWT signing), encoding_rs,
        and simple_asn1
-   license: ISC
    reason: ring, untrusted, and rustls-webpki (octocrab's TLS)
-   license: Zlib
    reason: foldhash, through gix's object cache
-   license: CDLA-Permissive-2.0
    reason: webpki-root-certs, the CA roots gix's HTTPS transport verifies against
deny_skip: []
feature_sets: []
generated_paths: []
github_owner: victor-software-house
layout: crate
library: true
max_width: 100
merge_queue: true
mise_version: 2026.10.25
nightly_fmt: true
pieces:
- hooks
- lint_markdown
- lint_toml
- lint_typos
- lint_prose
- openspec
- ci
- drift_check
- rust_tasks
- rustfmt
- clippy
- cargo_lints
- deny
pieces_extra:
- lint_workflows
- machete
- doc_tests
- rustdoc
platforms:
- linux-x64
- linux-arm64
- macos-arm64
project: rust-crate
prose_fail_level: error
published: true
repository_visibility: public
rust_nightly: nightly-2026-11-01
rust_version: 1.99.1
test_profiles: []
tokio: true
verify_timeout: 8
workflow_policy:
- drafts
- concurrency
- labels
- permissions
- pins
- mise_env
workflow_policy_namespaces: []
