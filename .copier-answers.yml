# Changes here will be overwritten by Copier; edit with `copier update --data`.
_commit: v0.0.100
_src_path: https://github.com/victor-software-house/templates.git
build_os: linux
ci_runner: github-hosted
clippy_disallowed_methods: []
clippy_disallowed_types: []
default_branch: main
deny_bans: []
deny_ignore: []
deny_licenses:
-   license: BSD-3-Clause
    reason: subtle, curve25519-dalek, ed25519-dalek (octocrab's JWT signing), encoding_rs,
        and simple_asn1
-   license: ISC
    reason: ring, untrusted, and rustls-webpki (octocrab's TLS)
-   license: Zlib
    reason: foldhash, through gix's object cache
-   license: CDLA-Permissive-2.0
    reason: webpki-root-certs, the CA roots gix's HTTPS transport verifies against
deny_skip:
-   crate: base64@0.22
    reason: octocrab 0.54.9, the latest release, requires base64 0.22, and reqwest
        0.13.5 requires 0.23
-   crate: getrandom@0.2
    reason: ring 0.17.14 and octocrab 0.54.9, their latest releases, require getrandom
        0.2
-   crate: hashbrown@0.14
    reason: dashmap 6.2.1, the latest release, which gix-tempfile takes, requires
        hashbrown 0.14
-   crate: hashbrown@0.16
    reason: clru 0.6.3 and gix-status 0.37.0, the latest releases, require hashbrown
        0.16
-   crate: syn@2
    reason: garde_derive 0.23.0, the latest release, and other derive crates require
        syn 2
-   crate: windows-sys@0.52
    reason: ring 0.17.14, the latest release, requires windows-sys 0.52
feature_sets: []
generated_paths: []
github_owner: victor-software-house
layout: crate
library: true
linux_image: ubuntu-26.04
max_width: 100
merge_queue: true
merge_queue_cancel_lower: true
mise_version: 2026.11.6
nightly_fmt: true
pieces:
- hooks
- lint_markdown
- lint_toml
- lint_typos
- lint_prose
- openspec
- ci
- drift_check
- rust_tasks
- rustfmt
- clippy
- cargo_lints
- deny
pieces_extra:
- lint_workflows
- machete
- doc_tests
- rustdoc
platforms:
- linux-x64
- linux-arm64
- macos-arm64
project: rust-crate
prose_fail_level: error
published: true
repository_visibility: public
rust_nightly: nightly-2026-11-01
rust_version: 1.99.1
test_profiles: []
tokio: true
verify_timeout: 8
workflow_policy:
- drafts
- concurrency
- labels
- permissions
- pins
- mise_env
workflow_policy_namespaces: []
