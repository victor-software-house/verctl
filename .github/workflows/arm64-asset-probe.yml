name: arm64 asset probe

# Temporary: builds the linux-arm64 release tarball once on GitHub's arm64
# runner, with no upload, to prove the build before the release that
# declares it. This workflow lives only on a throwaway pull request that is
# closed without merging.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build the linux-arm64 tarball
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      MISE_ENV: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          cache: true
      - run: mise install --locked
      - run: mise run ver assets --build linux-arm64
