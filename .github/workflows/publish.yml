name: Publish

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  MISE_ENV: dev,release

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.head.ref == 'version-packages')
    runs-on: ubuntu-latest
    outputs:
      has_assets: ${{ steps.plan.outputs.has_assets }}
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.2
          cache: true
          # This run is a closed pull request: its merge ref no longer
          # exists, so the Actions cache refuses every write. Read only.
          cache_save: false
      - run: mise install --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Plan native assets
        id: plan
        run: mise -E dev run ver -- assets --github-output "$GITHUB_OUTPUT"
      - name: Point origin/HEAD at the repository default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -n "${DEFAULT_BRANCH}" ]; then
            git symbolic-ref refs/remotes/origin/HEAD \
              "refs/remotes/origin/${DEFAULT_BRANCH}"
          fi
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mise -E dev run ver -- publish

  assets:
    name: ${{ matrix.id }}
    needs: crate
    if: needs.crate.outputs.has_assets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.crate.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.2
          cache: true
          # This run is a closed pull request: its merge ref no longer
          # exists, so the Actions cache refuses every write. Read only.
          cache_save: false
      - run: mise install --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Build and upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          mise -E dev run ver -- assets
          --build "${{ matrix.id }}"
          --upload
          --tag "${{ needs.crate.outputs.tag }}"

  pin:
    needs: [crate, assets]
    if: >-
      always() &&
      needs.crate.result == 'success' &&
      (needs.crate.outputs.has_assets != 'true' || needs.assets.result == 'success')
    runs-on: ubuntu-latest
    env:
      MISE_ENV: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.2
          cache: true
          # This run is a closed pull request: its merge ref no longer
          # exists, so the Actions cache refuses every write. Read only.
          cache_save: false
          install: false
      - name: Pin with the tarball just published
        id: pin
        env:
          TAG: ${{ needs.crate.outputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "unexpected tag: '$TAG'" >&2
              exit 1
              ;;
          esac
          version="${TAG#v}"
          if [ -z "$version" ]; then
            echo "empty version from tag '$TAG'" >&2
            exit 1
          fi
          mise x "github:victor-software-house/verctl@${version}" -- \
            verctl pin --format json >"$RUNNER_TEMP/pin.json"
      - run: mise -E release lock
      - name: Commit released pins
        run: |
          set -euo pipefail
          mapfile -t files < <(jq -r '.files[]' "$RUNNER_TEMP/pin.json")
          git add -- "${files[@]}" mise.release.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): pin released verctl"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
