name: mbx measure

# Measures the organization's mbx remote cache against the GitHub cache
# backend before any other repository adopts it (release-mirror's add-mbx-cache
# change, design decision 8). Each build runs three ways on the same commit and
# runner label: arm A caches the Cargo target tree in GitHub's cache, arm B
# caches mbx objects there, and arm C reads and writes the remote cache through
# the mbx-cache action.
#
# It runs only when a measurement asks for it: on workflow_dispatch, on a push
# to main that changes this file or .github/mbx-measure-generation, and on a
# pull request labelled mbx-measure. The mirror grants read-write remote
# credentials only to a push on the default branch, so a cold write is a push.
#
# A run's generation is the dispatch input, the pull request's base commit, or
# the pushed or dispatched commit. A push, the dispatch runs on its commit and
# the pull requests based on it share one generation; a dispatch with a new
# generation starts every arm empty. The change that records the numbers
# removes this file and the marker.

on:
  workflow_dispatch:
    inputs:
      generation:
        description: Cache generation; leave empty for the commit, or pass a new value to start every arm empty
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - .github/workflows/mbx-measure.yml
      - .github/mbx-measure-generation
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# A newer push to the same pull request cancels its older run. A run on main
# never cancels the running one, but GitHub keeps one pending run per group and
# drops an older pending one, so start each measurement only after the last
# one ends. Adding any other label starts a run that skips every job, so that
# run takes a group of its own and cannot cancel a measurement.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'mbx-measure') && format('ignored-{0}-', github.run_id) || '' }}${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.build.name }} on ${{ matrix.build.runner }}, arm ${{ matrix.arm }}
    # On a pull request, only the mbx-measure label counts, and adding any
    # other label starts nothing.
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'mbx-measure') && (github.event.action != 'labeled' || github.event.label.name == 'mbx-measure'))) }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - { name: verify, runner: ubuntu-26.04, task: verify }
          - { name: release build, runner: ubuntu-26.04-arm, task: build }
          - { name: release build, runner: xcode-27, task: build }
        arm: [A, B, C]
    runs-on: ${{ matrix.build.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # the release mirror's tools, and arm C's remote credentials
    env:
      MISE_ENV: ci
      GENERATION: ${{ inputs.generation || github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: victor-software-house/actions/mise@bead5c01b61e14ecf1e923a5bcff97e8c421f151 # main, 2026-11-11
        with:
          mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
          mirror-key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
          version: 2026.11.6
          cache: true
      - run: mise install --locked
      - name: Mark the cache step's start
        run: date +%s > "$RUNNER_TEMP/mbx-measure-start"
      - name: Cache with GitHub, target payload
        if: matrix.arm == 'A'
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          version: "1.30.0"
          cache-generation: measure-a-${{ env.GENERATION }}
          github-cache-mode: target
          save-on-workflow-dispatch: true
      - name: Cache with GitHub, objects payload
        if: matrix.arm == 'B'
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          version: "1.30.0"
          cache-generation: measure-b-${{ env.GENERATION }}
          github-cache-mode: objects
          isolate-objects-cache: true
          save-on-workflow-dispatch: true
      - name: Cache with the remote
        if: matrix.arm == 'C'
        uses: victor-software-house/actions/mbx-cache@bead5c01b61e14ecf1e923a5bcff97e8c421f151 # main, 2026-11-11
        with:
          endpoint: ${{ secrets.RELEASE_MIRROR_URL }}
          key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
          ttl-minutes: 60
          generation: measure-c-${{ env.GENERATION }}
          version: "1.30.0"
      - name: Build
        env:
          MBX_STATS_REPORT: ${{ runner.temp }}/mbx-report.json
        run: mise run ${{ matrix.build.task }}
      - name: Report the wall time and mbx counters
        if: always()
        env:
          ARM: ${{ matrix.arm }}
          BUILD: ${{ matrix.build.name }}
          RUNNER_LABEL: ${{ matrix.build.runner }}
        run: |
          start=$(cat "$RUNNER_TEMP/mbx-measure-start")
          echo "arm $ARM, $BUILD on $RUNNER_LABEL, generation $GENERATION: $(( $(date +%s) - start )) s from the cache step to the build's end"
          cat "$RUNNER_TEMP/mbx-report.json" 2>/dev/null || echo "no mbx report"
      - name: Upload the mbx report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mbx-report-${{ matrix.arm }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build.task }}
          path: ${{ runner.temp }}/mbx-report.json
          if-no-files-found: warn
          retention-days: 30
