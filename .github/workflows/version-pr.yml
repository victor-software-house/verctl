name: Version PR

on:
  push:
    branches: [main]

permissions: {}

env:
  MISE_ENV: ci

concurrency:
  group: version-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare the Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; every write uses the minted Version Packages App token
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.9
          cache: true
      - run: mise install --locked
      - name: Mint Version PR token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      # verctl enables auto-merge itself, after checking the base requires a
      # status check and the token is not the job's own. A verctl too old to
      # read VERCTL_AUTO_MERGE ignores it, and the Version PR waits for a
      # person to merge it.
      - name: Prepare release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERCTL_AUTO_MERGE: ${{ vars.VERCTL_RELEASE_HOLD != 'true' }}
          VERCTL_JOB_TOKEN: ${{ github.token }}
        run: mise run ver prepare --pr
      # The repository variable VERCTL_RELEASE_HOLD=true holds the next release:
      # the Version PR still opens and updates, but never merges itself, so a
      # person merges it when the hold ends. Delete the variable to resume.
      # Auto-merge enabled before the hold survives later pushes, so the hold
      # also turns it off on the open Version PR.
      - name: Hold the release
        if: vars.VERCTL_RELEASE_HOLD == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "${REPO}" --head version-packages --base "${BASE}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${number}" ] && [ "$(gh pr view "${number}" --repo "${REPO}" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            gh pr merge "${number}" --repo "${REPO}" --disable-auto
          fi
