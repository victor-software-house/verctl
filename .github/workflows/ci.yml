name: CI

on:
  # The version check knows the Version PR by its head repository, head
  # branch, and base, read through the API when it runs, so no label event
  # needs a run. Changing a pull request's base starts no run: re-run the
  # workflow by hand after retargeting one.
  # A draft pull request runs no CI; marking it ready starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Refresh the default branch's build cache without repeating every push.
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

# The shared Verify job reads this run and the runs that replaced it.
permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CARGO_TERM_COLOR: always
  MISE_ENV: ci

concurrency:
  # A draft run gets a group of its own, so it never cancels the ready run.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'schedule'
    # One API call on the runner chosen when this repository was rendered.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          workflow=${WORKFLOW%@*}
          gh workflow run "${workflow##*/}" --repo "$REPOSITORY" --ref main

  # runs-on must be known before a job exists, so the machine cannot come
  # from a tool running inside that job. This reads [ci] and hands
  # the labels down, the same bootstrap the publish lane uses for assets.
  #
  # examples/workflows/ci.yml plans with the released tarball and needs no
  # compiler. This one builds the verctl it plans with: `mise run ver` runs
  # this checkout, so a new verb plans its own pull request.
  plan:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    name: Plan
    runs-on: ubuntu-latest
    # Recent runs take under 2 minutes.
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write # downloads tools through the release mirror
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: victor-software-house/actions/mise@83044282a4cb70dc14016a1178941fd28de38156 # main, 2026-11-10
        with:
          version: 2026.10.25
          cache: true
      - run: mise install --locked
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          # The daily dispatch run on main saves the cache pull requests
          # restore from; a merge_group run saves on its queue branch.
          save-on-workflow-dispatch: true
      - name: Plan validation jobs
        id: plan
        run: mise run ver ci --github-output "$GITHUB_OUTPUT"

  verify:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    # Recent runs take up to 10 minutes.
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write # downloads tools through the release mirror
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up mise
        uses: victor-software-house/actions/mise@83044282a4cb70dc14016a1178941fd28de38156 # main, 2026-11-10
        with:
          version: 2026.10.25
          cache: true
      - run: mise install --locked
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          # The daily dispatch run on main saves the cache pull requests
          # restore from; a merge_group run saves on its queue branch.
          save-on-workflow-dispatch: true
      - name: Verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run verify
      - name: Advisories
        run: mise run deny:advisories
      # next carries the next minor release's breaking changes while
      # Cargo.toml still names the last release, so the check would read them
      # as a patch. It skips pull requests into next and the one that merges
      # this repository's next into main; the Version PR that follows bumps the
      # minor, and every later pull request into main checks against that
      # release. Pushes skip it: every change reaches main through a pull
      # request that already ran it, and the push of the next merge would fail.
      - name: Semver
        if: >-
          github.event_name == 'pull_request'
          && github.base_ref != 'next'
          && !(github.head_ref == 'next'
          && github.event.pull_request.head.repo.full_name == github.repository)
        run: mise run semver
      # Builds the package crates.io would receive.
      - name: Package
        run: mise x -- cargo package --locked --all-features
