name: CI

on:
  # The Version PR is opened, then labeled. The version check reads the
  # label from the event, so adding or removing a label starts a run too.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CARGO_TERM_COLOR: always
  MISE_ENV: dev,ci

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.base.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # runs-on must be known before a job exists, so the machine cannot come
  # from a tool running inside that job. This reads [ci] and hands
  # the labels down, the same bootstrap the publish lane uses for assets.
  #
  # examples/workflows/ci.yml plans with the released tarball and needs no
  # compiler. This one cannot yet: the published binary has no `ci` verb, so
  # `mise run ver` builds it. It moves to MISE_ENV=release once a release
  # carries the verb; mise still installs the tarball then, but the nightly
  # toolchain and the mbx cache below go away.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.13
          cache: true
      - run: mise install --locked
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@9df1d4b18b2147788a7ee7a2c7b84ecf62fd89d3 # v1.5.0
      - name: Plan validation jobs
        id: plan
        run: mise run ver ci --github-output "$GITHUB_OUTPUT"

  verify:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.13
          cache: true
      - run: mise install --locked
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@9df1d4b18b2147788a7ee7a2c7b84ecf62fd89d3 # v1.5.0
      - name: Verify
        run: mise run verify
      - name: Advisories
        run: mise run deny:advisories
