name: Release

# verctl's reusable release workflow. A repository calls it from a thin caller
# that triggers on push to the default branch and on workflow_dispatch:
#
#   jobs:
#     release:
#       uses: victor-software-house/verctl/.github/workflows/release.yml@<sha>
#       permissions:
#         contents: write
#         pull-requests: write
#         id-token: write
#       with:
#         crates-io-trusted-publishing: true
#       secrets:
#         app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
#         app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
#
# GitHub checks each called job's permissions when the run starts, so every
# caller grants id-token: write, which every job requests: publish for
# crates.io trusted publishing, and each job for the organization's mise
# action, which downloads tools through the release mirror. A job without
# the grant downloads from GitHub and logs a notice.
#
# Every caller also grants contents: write, which plan, publish, assets,
# finalize, and propose request. plan needs it to list draft Releases, which
# GitHub shows only to a token with push access.
#
# One flow: plan every incomplete version commit, publish each in history
# order, build the assets its Release lacks, publish each draft Release once
# its assets are uploaded, check docs.rs, then open or update the Version PR.
# A Release with declared assets stays a draft until finalize, because an
# immutable Release takes no asset once published. Every job is safe to
# rerun, and every step sets its
# settings in env. plan and propose run `mise run ver <verb>` at HEAD, where
# the served task execs the verctl the caller pins; the jobs at a version
# commit run that same version. verctl's own release passes verctl-artifact
# instead, so each job runs the verctl that run built once for its platform.
#
# Every other job needs plan, so plan alone checks what they share: the
# pinned verctl is 0.8.0 or later, and each mise-ignored-config-paths entry
# is a plain relative path. publish, assets, finalize, and docs take the
# checked paths from plan's outputs.
#
# publish, assets, finalize, and docs check out the version commit, but they run the
# verctl plan checked at HEAD, not the one that commit's served task pins. A
# released commit cannot move its pin, and an older pin has no release verb.
# Each installs that version with `mise install --locked` from a second
# checkout of HEAD's mise files, so the install comes from HEAD's lock and
# no lock is switched off.

on:
  workflow_call:
    inputs:
      version-pr:
        description: Open or update the Version PR. false skips the propose job.
        type: boolean
        default: true
      publish:
        description: Publish, tag, and release. false skips the publish job.
        type: boolean
        default: true
      assets:
        description: >-
          Build the assets .ctl/ver.yaml declares. false skips the assets
          matrix and leaves assets out of the completeness check.
        type: boolean
        default: true
      docs:
        description: Wait for docs.rs to build each released crate.
        type: boolean
        default: true
      allow-workflow-change:
        description: >-
          Publish a version commit whose .github/workflows/ differs from the
          default branch's tip, as when retrying an old release after a
          workflow changed. The release report lists it under allowed.
        type: boolean
        default: false
      allow-off-default-branch:
        description: >-
          Publish a version commit the default branch does not contain. The
          release report lists it under allowed.
        type: boolean
        default: false
      config:
        description: Path to the declarations file. Empty means .ctl/ver.yaml.
        type: string
        default: ""
      runner:
        description: >-
          JSON label list for the plan, publish, docs, and propose jobs. Asset
          jobs take their runners from .ctl/ver.yaml.
        type: string
        default: '["ubuntu-latest"]'
      mise-version:
        description: The mise that installs the caller's tools, verctl included.
        type: string
        default: 2026.11.6
      mise-env:
        description: MISE_ENV for every job.
        type: string
        default: ci
      mise-ignored-config-paths:
        description: >-
          Colon-separated mise config paths, relative to the repository root,
          that the plan, publish, assets, and docs jobs ignore, so they skip
          tools only the repository's own tasks need. propose keeps them,
          because prepare.after runs those tasks. plan checks the entries
          once. Empty ignores none and leaves MISE_IGNORED_CONFIG_PATHS
          unset, so .miserc.toml still applies.
        type: string
        default: ""
      verctl-artifact:
        description: >-
          Name prefix of verctl builds uploaded earlier in the calling run,
          for verctl's own release. Each job downloads
          <prefix>-<runner.os>-<runner.arch> and puts it first on PATH, so the
          caller's ver task must run verctl from PATH with no pin of its own.
          Empty uses the verctl the caller's ver task pins.
        type: string
        default: ""
      registry-token-env:
        description: >-
          The variable the publisher reads the registry token from, such as
          CARGO_REGISTRY_TOKEN for crates.io or CARGO_REGISTRIES_<NAME>_TOKEN
          for another cargo registry. It names no secret. Only the publisher
          and its registry query see the token, under this name.
        type: string
        default: CARGO_REGISTRY_TOKEN
      crates-io-trusted-publishing:
        description: >-
          Publish to crates.io with a token from trusted publishing, handed
          to the publisher as registry-token-env, in place of the
          registry-token secret. Each crate lists the caller's workflow file
          as its trusted publisher.
        type: boolean
        default: false
      environment:
        description: >-
          GitHub environment the publish job runs in, the only job that reads
          a registry token, so the token can live only in an environment that
          admits the default branch. The caller maps the token's stored name,
          such as CARGO_REGISTRY_TOKEN, to the registry-token secret, and the
          publish job receives the environment's value. Empty runs publish in
          no environment.
        type: string
        default: ""
    secrets:
      app-client-id:
        description: >-
          GitHub App client id for the Version PR. Without it the Version PR is
          opened with GITHUB_TOKEN, so its own CI does not start.
        required: false
      app-private-key:
        description: The GitHub App's private key.
        required: false
      registry-token:
        description: >-
          Registry token, handed to the publisher as registry-token-env.
          A token stored in an environment is mapped here by its stored name.
          Without it, the publisher uses whatever credential its config finds.
        required: false
      release-mirror-url:
        description: >-
          The release mirror's address, for the mise action in every job.
          Without it, tools download from GitHub.
        required: false
      release-mirror-ci-key:
        description: >-
          The key in the user name of a CI job's mirror login. It passes the
          mirror's edge rule and opens nothing alone.
        required: false

permissions: {}

env:
  MISE_ENV: ${{ inputs.mise-env }}
  VERCTL_CONFIG: ${{ inputs.config }}

jobs:
  plan:
    name: Plan the release
    # A dispatch from another branch runs nothing: plan never releases a
    # commit outside the default branch, and propose never derives
    # verctl/release/<feature>.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ fromJson(inputs.runner) }}
    # Recent runs, across the repositories that call this workflow, take under 2
    # minutes.
    timeout-minutes: 10
    permissions:
      # Reads history, tags, and Releases. GitHub lists a draft Release only to
      # a token with push access, and without it the plan would not see a
      # draft and would rebuild every asset the draft already holds.
      contents: write
      id-token: write # downloads tools through the release mirror
    outputs:
      commits: ${{ steps.plan.outputs.commits }}
      pending: ${{ steps.plan.outputs.pending }}
      assets: ${{ steps.plan.outputs.assets }}
      # Whether .ctl/ver.yaml declares an asset target, so a Release is a draft
      # and finalize has something to publish.
      has-assets: ${{ steps.plan.outputs.has_assets }}
      # The asset file names each pending commit's Release is expected to hold,
      # as a JSON map from commit to comma-separated names. A leg at a commit
      # declares exactly these, so it agrees with the plan that scheduled it.
      declared: ${{ steps.plan.outputs.declared }}
      # The verctl every later job runs, whatever its checked-out commit pins.
      # Empty with verctl-artifact: that build is already on each job's PATH.
      verctl-version: ${{ steps.minimum.outputs.version }}
      mise-ignored-config-paths: ${{ steps.ignored.outputs.paths }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Ignore mise config paths
        id: ignored
        if: inputs.mise-ignored-config-paths != ''
        env:
          IGNORED: ${{ inputs.mise-ignored-config-paths }}
        # Set only when the input is set: mise takes an empty
        # MISE_IGNORED_CONFIG_PATHS as the list, overriding .miserc.toml.
        # The later jobs read the checked value from this job's outputs.
        run: |
          case "${IGNORED}" in
            *$'\n'*) echo "::error::mise-ignored-config-paths is one line"; exit 1 ;;
          esac
          # Each entry is a plain relative path: an empty, ".", or ".."
          # segment, or a leading or trailing slash, could name the
          # repository root or a path outside it, so it fails the job.
          IFS=: read -ra paths <<< "${IGNORED}"
          for p in "${paths[@]}"; do
            case "/${p}/" in
              *//*|*/./*|*/../*)
                echo "::error::mise-ignored-config-paths entry '${p}' is not a plain relative path"; exit 1 ;;
            esac
          done
          echo "MISE_IGNORED_CONFIG_PATHS=${IGNORED}" >> "${GITHUB_ENV}"
          echo "paths=${IGNORED}" >> "${GITHUB_OUTPUT}"
      - name: Set up mise
        uses: victor-software-house/actions/mise@bead5c01b61e14ecf1e923a5bcff97e8c421f151 # main, 2026-11-11
        with:
          mirror-url: ${{ secrets.release-mirror-url }}
          mirror-key: ${{ secrets.release-mirror-ci-key }}
          version: ${{ inputs.mise-version }}
          cache: true
          # These jobs install fewer tools than propose, so they keep their
          # own cache rather than share propose's key.
          cache_key_prefix: ${{ inputs.mise-ignored-config-paths != '' && 'mise-v1-trimmed' || 'mise-v1' }}
      - run: mise install --locked
      - name: Download this run's verctl build
        if: inputs.verctl-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.verctl-artifact }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/verctl-build
      - name: Put this run's verctl build first on PATH
        if: inputs.verctl-artifact != ''
        env:
          BUILD_DIR: ${{ runner.temp }}/verctl-build
        run: |
          chmod +x "${BUILD_DIR}/verctl"
          echo "${BUILD_DIR}" >> "${GITHUB_PATH}"
      - name: Require verctl 0.8.0 or later
        id: minimum
        # The caller's pin at HEAD chooses verctl, apart from this workflow's
        # ref. A build from this run already matches the workflow, so it skips.
        # Every later job runs the version this step checked, so it checks once.
        if: inputs.verctl-artifact == ''
        env:
          MINIMUM: 0.8.0
        run: |
          installed="$(mise run --quiet ver --version)"
          installed="${installed##* }"
          lowest="$(printf '%s\n' "${MINIMUM}" "${installed}" | sort -V | head -n 1)"
          if [ "${lowest}" != "${MINIMUM}" ]; then
            echo "::error::verctl ${installed} is older than ${MINIMUM}, the minimum this release workflow needs. Move the verctl pin and the workflow ref together."
            exit 1
          fi
          echo "version=${installed}" >> "${GITHUB_OUTPUT}"
      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCTL_SKIP_ASSETS: ${{ !inputs.assets }}
        run: mise run ver status --github-output "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.commit }}
    needs: plan
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.publish && needs.plan.outputs.pending == 'true'
    # An empty name runs the job in no environment and records no deployment.
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJson(inputs.runner) }}
    # Recent runs take under 3 minutes; each upload may take up to 10, and a
    # workspace uploads several crates.
    timeout-minutes: 30
    permissions:
      contents: write # creates the release tag and the GitHub Release
      id-token: write # crates.io trusted publishing, and the release mirror
    # One run releases every pending version commit, oldest first, and stops
    # at the first that fails. A running leg is never cancelled half way.
    # GitHub keeps one pending job per group, so a leg still waiting when a
    # newer run's leg arrives is cancelled. Nothing is lost: the newer run
    # planned every incomplete commit itself, so it publishes the cancelled
    # leg's commit, and reports a commit the running leg finished as already
    # done. The older run's propose is skipped; the newer run proposes.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        commit: ${{ fromJson(needs.plan.outputs.commits) }}
    concurrency:
      group: verctl-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the version commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.commit }}
          fetch-depth: 0
      - name: Ignore mise config paths
        # plan checked the paths. The variable stays unset when there are
        # none, so .miserc.toml still applies.
        if: needs.plan.outputs.mise-ignored-config-paths != ''
        env:
          IGNORED: ${{ needs.plan.outputs.mise-ignored-config-paths }}
        run: echo "MISE_IGNORED_CONFIG_PATHS=${IGNORED}" >> "${GITHUB_ENV}"
      - name: Set up mise
        uses: victor-software-house/actions/mise@bead5c01b61e14ecf1e923a5bcff97e8c421f151 # main, 2026-11-11
        with:
          mirror-url: ${{ secrets.release-mirror-url }}
          mirror-key: ${{ secrets.release-mirror-ci-key }}
          version: ${{ inputs.mise-version }}
          cache: true
          # These jobs install fewer tools than propose, so they keep their
          # own cache rather than share propose's key.
          cache_key_prefix: ${{ inputs.mise-ignored-config-paths != '' && 'mise-v1-trimmed' || 'mise-v1' }}
      - run: mise install --locked
      - name: Download this run's verctl build
        if: inputs.verctl-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.verctl-artifact }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/verctl-build
      - name: Put this run's verctl build first on PATH
        if: inputs.verctl-artifact != ''
        env:
          BUILD_DIR: ${{ runner.temp }}/verctl-build
        run: |
          chmod +x "${BUILD_DIR}/verctl"
          echo "${BUILD_DIR}" >> "${GITHUB_PATH}"
      - name: Check out HEAD's mise lock
        # The version commit's mise.lock lacks the plan's verctl, which HEAD's
        # lists. The files mise reads sit in a second checkout of the commit
        # this run started from. actions/checkout takes no path outside the
        # workspace, so it sits inside it, after the checkout above, whose
        # clean would remove it.
        if: inputs.verctl-artifact == '' && needs.plan.outputs.verctl-version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: .verctl-head
          ref: ${{ github.sha }}
          sparse-checkout: |
            /mise.toml
            /mise.*.toml
            /mise.lock
            /mise.*.lock
            /.miserc.toml
          sparse-checkout-cone-mode: false
      - name: Install the plan's verctl from HEAD's lock
        if: inputs.verctl-artifact == '' && needs.plan.outputs.verctl-version != ''
        env:
          VERCTL_TOOL: github:victor-software-house/verctl@${{ needs.plan.outputs.verctl-version }}
        # --locked installs only what HEAD's lock lists, and leaves the
        # version commit's mise.lock alone. The exclude keeps the second
        # checkout out of git's status, so a publisher's dirty check does not
        # count it.
        run: |
          echo "/.verctl-head/" >> "$(git rev-parse --git-path info/exclude)"
          mise -C .verctl-head install --locked "${VERCTL_TOOL}"
          echo "VERCTL_BIN=$(mise -C .verctl-head which verctl --tool="${VERCTL_TOOL}")" >> "${GITHUB_ENV}"
      # crates.io matches the token's repository and the caller's workflow
      # file against the crate's trusted publishers, and the action's post
      # step revokes the token when the job ends.
      - name: Get a crates.io token by trusted publishing
        id: crates-io
        if: inputs.crates-io-trusted-publishing
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCTL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # The plan's assets for this commit. None means the plan expects no
          # asset here, so the leg declares none whatever the commit's config
          # names.
          VERCTL_SKIP_ASSETS: ${{ !inputs.assets || fromJson(needs.plan.outputs.declared || '{}')[matrix.commit] == '' }}
          VERCTL_DECLARED_ASSETS: ${{ fromJson(needs.plan.outputs.declared || '{}')[matrix.commit] }}
          VERCTL_ALLOW_WORKFLOW_CHANGE: ${{ inputs.allow-workflow-change }}
          VERCTL_ALLOW_OFF_DEFAULT_BRANCH: ${{ inputs.allow-off-default-branch }}
          # The token is read only under its declared name. A caller whose
          # token lives in an environment maps the stored name to
          # registry-token, and this job, running in that environment,
          # receives the environment's value. verctl refuses both tokens
          # at once, checks registry-token-env, and hands the token to each
          # publisher under that name alone.
          VERCTL_REGISTRY_TOKEN: ${{ secrets.registry-token }}
          VERCTL_TRUSTED_PUBLISHING_TOKEN: ${{ steps.crates-io.outputs.token }}
          VERCTL_REGISTRY_TOKEN_ENV: ${{ inputs.registry-token-env }}
        # The plan's verctl, not the one this commit's served task pins, which
        # may predate this workflow. VERCTL_BIN is unset with verctl-artifact,
        # and this run's build runs from PATH.
        run: mise exec -- "${VERCTL_BIN:-verctl}" release

  assets:
    name: ${{ matrix.id }} at ${{ matrix.commit }}
    needs: [plan, publish]
    # !cancelled() keeps a skipped publish from skipping this job too: without
    # a status function GitHub adds success(), which is false once a needed
    # job was skipped.
    if: >-
      !cancelled() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.plan.result == 'success' &&
      inputs.assets && fromJson(needs.plan.outputs.assets).include[0] != null &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ${{ matrix.labels }}
    # Recent runs take under 8 minutes; prepare and build may each take up to
    # 15, after a cold tool install.
    timeout-minutes: 45
    permissions:
      contents: write # uploads the tarball to the GitHub Release
      id-token: write # downloads tools through the release mirror
    # One tool at a time, in every mise command of the job: on macOS runners
    # rustup fails to rename a component download ("could not rename
    # 'downloaded' file") when mise installs two Rust toolchains at once,
    # which failed the darwin-arm64 asset of verctl 0.6.0 (run 40147490485).
    env:
      MISE_JOBS: 1
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.assets) }}
    steps:
      - name: Check out the version commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.commit }}
          fetch-depth: 0
      - name: Ignore mise config paths
        # plan checked the paths. The variable stays unset when there are
        # none, so .miserc.toml still applies.
        if: needs.plan.outputs.mise-ignored-config-paths != ''
        env:
          IGNORED: ${{ needs.plan.outputs.mise-ignored-config-paths }}
        run: echo "MISE_IGNORED_CONFIG_PATHS=${IGNORED}" >> "${GITHUB_ENV}"
      - name: Set up mise
        uses: victor-software-house/actions/mise@bead5c01b61e14ecf1e923a5bcff97e8c421f151 # main, 2026-11-11
        with:
          mirror-url: ${{ secrets.release-mirror-url }}
          mirror-key: ${{ secrets.release-mirror-ci-key }}
          version: ${{ inputs.mise-version }}
          cache: true
          # These jobs install fewer tools than propose, so they keep their
          # own cache rather than share propose's key.
          cache_key_prefix: ${{ inputs.mise-ignored-config-paths != '' && 'mise-v1-trimmed' || 'mise-v1' }}
      - run: mise install --locked
      - name: Download this run's verctl build
        if: inputs.verctl-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.verctl-artifact }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/verctl-build
      - name: Put this run's verctl build first on PATH
        if: inputs.verctl-artifact != ''
        env:
          BUILD_DIR: ${{ runner.temp }}/verctl-build
        run: |
          chmod +x "${BUILD_DIR}/verctl"
          echo "${BUILD_DIR}" >> "${GITHUB_PATH}"
      - name: Check out HEAD's mise lock
        # The version commit's mise.lock lacks the plan's verctl, which HEAD's
        # lists. The files mise reads sit in a second checkout of the commit
        # this run started from. actions/checkout takes no path outside the
        # workspace, so it sits inside it, after the checkout above, whose
        # clean would remove it.
        if: inputs.verctl-artifact == '' && needs.plan.outputs.verctl-version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: .verctl-head
          ref: ${{ github.sha }}
          sparse-checkout: |
            /mise.toml
            /mise.*.toml
            /mise.lock
            /mise.*.lock
            /.miserc.toml
          sparse-checkout-cone-mode: false
      - name: Install the plan's verctl from HEAD's lock
        if: inputs.verctl-artifact == '' && needs.plan.outputs.verctl-version != ''
        env:
          VERCTL_TOOL: github:victor-software-house/verctl@${{ needs.plan.outputs.verctl-version }}
        # --locked installs only what HEAD's lock lists, and leaves the
        # version commit's mise.lock alone. The exclude keeps the second
        # checkout out of git's status, so the build's dirty checks do not
        # count it.
        run: |
          echo "/.verctl-head/" >> "$(git rev-parse --git-path info/exclude)"
          mise -C .verctl-head install --locked "${VERCTL_TOOL}"
          echo "VERCTL_BIN=$(mise -C .verctl-head which verctl --tool="${VERCTL_TOOL}")" >> "${GITHUB_ENV}"
      # Each asset job compiles its binary from the version commit, so mbx
      # keeps the compiled objects between releases on the same runner. The
      # objects payload with a private store is the shape a remote backend
      # replaces later; a cargo-less build skips the step.
      - name: Cache builds with mbx
        if: hashFiles('**/Cargo.toml') != ''
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          github-cache-mode: objects
          isolate-objects-cache: true
      - name: Build and upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCTL_TARGET: ${{ matrix.id }}
          VERCTL_TAG: ${{ matrix.tag }}
        # The plan's verctl, as in publish.
        run: mise exec -- "${VERCTL_BIN:-verctl}" release asset

  # Publishes each draft Release once its assets are uploaded. publish creates
  # a Release with declared assets as a draft, because an immutable Release
  # takes no asset once published. A leg runs release --releases-only, which
  # starts no publisher and refuses a package the registry does not list.
  # When an asset job failed, the draft stays, and the next run's plan lists
  # its commit again.
  finalize:
    name: Finalize ${{ matrix.commit }}
    needs: [plan, publish, assets]
    # !cancelled() keeps a skipped assets job from skipping this one too.
    if: >-
      !cancelled() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.plan.result == 'success' &&
      inputs.publish && inputs.assets &&
      needs.plan.outputs.pending == 'true' && needs.plan.outputs.has-assets == 'true' &&
      needs.publish.result == 'success' &&
      (needs.assets.result == 'success' || needs.assets.result == 'skipped')
    runs-on: ${{ fromJson(inputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: write # publishes the draft GitHub Release
      id-token: write # downloads tools through the release mirror
    # One run finalizes every pending version commit, oldest first, and stops
    # at the first that fails, under the group publish uses, so two runs never
    # publish a Release at once.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        commit: ${{ fromJson(needs.plan.outputs.commits) }}
    concurrency:
      group: verctl-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the version commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.commit }}
          fetch-depth: 0
      - name: Ignore mise config paths
        # plan checked the paths. The variable stays unset when there are
        # none, so .miserc.toml still applies.
        if: needs.plan.outputs.mise-ignored-config-paths != ''
        env:
          IGNORED: ${{ needs.plan.outputs.mise-ignored-config-paths }}
        run: echo "MISE_IGNORED_CONFIG_PATHS=${IGNORED}" >> "${GITHUB_ENV}"
      - name: Set up mise
        uses: victor-software-house/actions/mise@bead5c01b61e14ecf1e923a5bcff97e8c421f151 # main, 2026-11-11
        with:
          mirror-url: ${{ secrets.release-mirror-url }}
          mirror-key: ${{ secrets.release-mirror-ci-key }}
          version: ${{ inputs.mise-version }}
          cache: true
          # These jobs install fewer tools than propose, so they keep their
          # own cache rather than share propose's key.
          cache_key_prefix: ${{ inputs.mise-ignored-config-paths != '' && 'mise-v1-trimmed' || 'mise-v1' }}
      - run: mise install --locked
      - name: Download this run's verctl build
        if: inputs.verctl-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.verctl-artifact }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/verctl-build
      - name: Put this run's verctl build first on PATH
        if: inputs.verctl-artifact != ''
        env:
          BUILD_DIR: ${{ runner.temp }}/verctl-build
        run: |
          chmod +x "${BUILD_DIR}/verctl"
          echo "${BUILD_DIR}" >> "${GITHUB_PATH}"
      - name: Check out HEAD's mise lock
        # The version commit's mise.lock lacks the plan's verctl, which HEAD's
        # lists. The files mise reads sit in a second checkout of the commit
        # this run started from. actions/checkout takes no path outside the
        # workspace, so it sits inside it, after the checkout above, whose
        # clean would remove it.
        if: inputs.verctl-artifact == '' && needs.plan.outputs.verctl-version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: .verctl-head
          ref: ${{ github.sha }}
          sparse-checkout: |
            /mise.toml
            /mise.*.toml
            /mise.lock
            /mise.*.lock
            /.miserc.toml
          sparse-checkout-cone-mode: false
      - name: Install the plan's verctl from HEAD's lock
        if: inputs.verctl-artifact == '' && needs.plan.outputs.verctl-version != ''
        env:
          VERCTL_TOOL: github:victor-software-house/verctl@${{ needs.plan.outputs.verctl-version }}
        # --locked installs only what HEAD's lock lists, and leaves the
        # version commit's mise.lock alone.
        run: |
          echo "/.verctl-head/" >> "$(git rev-parse --git-path info/exclude)"
          mise -C .verctl-head install --locked "${VERCTL_TOOL}"
          echo "VERCTL_BIN=$(mise -C .verctl-head which verctl --tool="${VERCTL_TOOL}")" >> "${GITHUB_ENV}"
      - name: Publish the draft Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCTL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # The same assets as publish declared for this commit.
          VERCTL_SKIP_ASSETS: ${{ !inputs.assets || fromJson(needs.plan.outputs.declared || '{}')[matrix.commit] == '' }}
          VERCTL_DECLARED_ASSETS: ${{ fromJson(needs.plan.outputs.declared || '{}')[matrix.commit] }}
          # Creates and publishes Releases only. This job holds no registry
          # credential and never uploads a package.
          VERCTL_RELEASES_ONLY: true
          VERCTL_ALLOW_WORKFLOW_CHANGE: ${{ inputs.allow-workflow-change }}
          VERCTL_ALLOW_OFF_DEFAULT_BRANCH: ${{ inputs.allow-off-default-branch }}
        # The plan's verctl, as in publish.
        run: mise exec -- "${VERCTL_BIN:-verctl}" release

  docs:
    name: docs.rs at ${{ matrix.commit }}
    needs: [plan, publish]
    # Runs after publish whatever its outcome, so a commit released before a
    # later leg failed is still checked; a commit whose tag is missing has
    # nothing to check. It never holds the Version PR back.
    if: >-
      !cancelled() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.docs && needs.plan.outputs.pending == 'true'
    runs-on: ${{ fromJson(inputs.runner) }}
    # `ver docs` waits up to 60 minutes for docs.rs by default; recent runs take
    # under 10.
    timeout-minutes: 75
    permissions:
      contents: read # reads the release tag through the API
      id-token: write # downloads tools through the release mirror
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJson(needs.plan.outputs.commits) }}
    steps:
      - name: Check out the version commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.commit }}
          fetch-depth: 0
      - name: Ignore mise config paths
        # plan checked the paths. The variable stays unset when there are
        # none, so .miserc.toml still applies.
        if: needs.plan.outputs.mise-ignored-config-paths != ''
        env:
          IGNORED: ${{ needs.plan.outputs.mise-ignored-config-paths }}
        run: echo "MISE_IGNORED_CONFIG_PATHS=${IGNORED}" >> "${GITHUB_ENV}"
      - name: Set up mise
        uses: victor-software-house/actions/mise@bead5c01b61e14ecf1e923a5bcff97e8c421f151 # main, 2026-11-11
        with:
          mirror-url: ${{ secrets.release-mirror-url }}
          mirror-key: ${{ secrets.release-mirror-ci-key }}
          version: ${{ inputs.mise-version }}
          cache: true
          # These jobs install fewer tools than propose, so they keep their
          # own cache rather than share propose's key.
          cache_key_prefix: ${{ inputs.mise-ignored-config-paths != '' && 'mise-v1-trimmed' || 'mise-v1' }}
      - run: mise install --locked
      - name: Download this run's verctl build
        if: inputs.verctl-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.verctl-artifact }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/verctl-build
      - name: Put this run's verctl build first on PATH
        if: inputs.verctl-artifact != ''
        env:
          BUILD_DIR: ${{ runner.temp }}/verctl-build
        run: |
          chmod +x "${BUILD_DIR}/verctl"
          echo "${BUILD_DIR}" >> "${GITHUB_PATH}"
      - name: Check out HEAD's mise lock
        # The version commit's mise.lock lacks the plan's verctl, which HEAD's
        # lists. The files mise reads sit in a second checkout of the commit
        # this run started from. actions/checkout takes no path outside the
        # workspace, so it sits inside it, after the checkout above, whose
        # clean would remove it.
        if: inputs.verctl-artifact == '' && needs.plan.outputs.verctl-version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: .verctl-head
          ref: ${{ github.sha }}
          sparse-checkout: |
            /mise.toml
            /mise.*.toml
            /mise.lock
            /mise.*.lock
            /.miserc.toml
          sparse-checkout-cone-mode: false
      - name: Install the plan's verctl from HEAD's lock
        if: inputs.verctl-artifact == '' && needs.plan.outputs.verctl-version != ''
        env:
          VERCTL_TOOL: github:victor-software-house/verctl@${{ needs.plan.outputs.verctl-version }}
        # --locked installs only what HEAD's lock lists, and leaves the
        # version commit's mise.lock alone.
        run: |
          echo "/.verctl-head/" >> "$(git rev-parse --git-path info/exclude)"
          mise -C .verctl-head install --locked "${VERCTL_TOOL}"
          echo "VERCTL_BIN=$(mise -C .verctl-head which verctl --tool="${VERCTL_TOOL}")" >> "${GITHUB_ENV}"
      - name: Wait for docs.rs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The plan's verctl, as in publish.
        run: mise exec -- "${VERCTL_BIN:-verctl}" docs

  propose:
    name: Open or update the Version PR
    needs: [plan, publish]
    # A failed publish holds the next Version PR back, so the failure is
    # fixed before another version lands on top of it.
    if: >-
      !cancelled() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.version-pr &&
      needs.plan.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ${{ fromJson(inputs.runner) }}
    # Recent runs take under a minute.
    timeout-minutes: 10
    permissions:
      contents: write # pushes verctl/release/<base> when no App token is minted
      pull-requests: write # opens the Version PR when no App token is minted
      id-token: write # downloads tools through the release mirror
    concurrency:
      group: verctl-propose-${{ github.repository }}
      cancel-in-progress: true
    env:
      HAS_APP: ${{ secrets.app-client-id != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Set up mise
        uses: victor-software-house/actions/mise@bead5c01b61e14ecf1e923a5bcff97e8c421f151 # main, 2026-11-11
        with:
          mirror-url: ${{ secrets.release-mirror-url }}
          mirror-key: ${{ secrets.release-mirror-ci-key }}
          version: ${{ inputs.mise-version }}
          cache: true
      - run: mise install --locked
      - name: Download this run's verctl build
        if: inputs.verctl-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.verctl-artifact }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/verctl-build
      - name: Put this run's verctl build first on PATH
        if: inputs.verctl-artifact != ''
        env:
          BUILD_DIR: ${{ runner.temp }}/verctl-build
        run: |
          chmod +x "${BUILD_DIR}/verctl"
          echo "${BUILD_DIR}" >> "${GITHUB_PATH}"
      - name: Mint the Version PR token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare the Version PR
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VERCTL_PR: "true"
        run: mise run ver version
