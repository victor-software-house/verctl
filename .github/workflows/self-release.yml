name: Self-release

# verctl releases through its own reusable workflow, at the same commit, so a
# change to the workflow is exercised by the release that ships it.
#
# verctl is built from source only here, once per platform the release runs
# on, and every job of the release reuses that build: release.yml's plan,
# publish, docs, and propose jobs run on ubuntu-latest, and the asset jobs on
# the machines .ctl/ver.yaml names (macos-latest and ubuntu-latest).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # tags, Releases, assets, and verctl/release/main without the App
  pull-requests: write # the Version PR without the App

jobs:
  build:
    name: Build verctl on ${{ matrix.runner }}
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      MISE_ENV: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.17
          cache: true
      - run: mise install --locked
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
      - run: mise run build
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verctl-${{ runner.os }}-${{ runner.arch }}
          path: target/release/verctl
          if-no-files-found: error
          # A failed release job can be rerun for a week without rebuilding.
          retention-days: 7

  # The repository variable VERCTL_RELEASE_HOLD=true holds the next release:
  # the Version PR opens and updates but never merges itself, so a person
  # merges it when the hold ends (VER-065). Delete the variable to resume.
  # Auto-merge enabled before the hold survives later pushes, so the hold also
  # turns it off on the open Version PR.
  hold:
    name: Hold the release
    if: >-
      vars.VERCTL_RELEASE_HOLD == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write # disabling auto-merge is a merge setting on the PR
      pull-requests: write # reads and edits the Version PR
    steps:
      - name: Turn off auto-merge on the Version PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          number=$(gh pr list --repo "${REPO}" --head "verctl/release/${BASE}" --base "${BASE}" --state open --json number,autoMergeRequest --jq '.[] | select(.autoMergeRequest != null) | .number')
          if [ -n "${number}" ]; then
            gh pr merge "${number}" --repo "${REPO}" --disable-auto
          fi

  release:
    needs: build
    uses: ./.github/workflows/release.yml
    with:
      auto-merge: ${{ vars.VERCTL_RELEASE_HOLD != 'true' }}
      # mise.release.toml's ver task runs verctl from PATH, where each job
      # puts the build above.
      mise-env: ci,release
      verctl-artifact: verctl
    secrets:
      app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
      registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
