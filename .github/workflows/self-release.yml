name: Self-release

# verctl releases through its own reusable workflow, at the same commit, so a
# change to the workflow is exercised by the release that ships it.
#
# The build jobs here compile the verctl that runs every job of the release,
# once per platform the release runs on: release.yml's plan, publish, docs,
# and propose jobs run on ubuntu-26.04, and the asset jobs on the machines
# .ctl/ver.yaml names (macos-latest, ubuntu-26.04, and ubuntu-26.04-arm).
# Each asset job downloads the build of its own runner's OS and architecture,
# so every runner .ctl/ver.yaml names has a leg here. The tarballs reuse it
# when the version commit they release is this run's commit. An older version
# commit still compiles from its own tree.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One self-release at a time. A newer run waits instead of cancelling one that
# may be publishing; release.yml plans every unreleased version commit, so the
# queued run covers what any skipped one would have. The "-caller" part keeps
# this group apart from the called workflow's own groups.
concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build verctl on ${{ matrix.runner }}
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      matrix:
        runner: [ubuntu-26.04, macos-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    # Recent runs take under 7 minutes; a cold cache, as on a new runner, takes
    # longer.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # downloads tools through the release mirror
    env:
      MISE_ENV: ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: victor-software-house/actions/mise@bead5c01b61e14ecf1e923a5bcff97e8c421f151 # main, 2026-11-11
        with:
          mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
          mirror-key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
          version: 2026.11.6
          cache: true
      - run: mise install --locked
      - name: Cache builds with mbx
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
      - run: mise run build
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verctl-${{ runner.os }}-${{ runner.arch }}
          path: target/release/verctl
          if-no-files-found: error
          # A failed release job can be rerun for a week without rebuilding.
          retention-days: 7

  release:
    needs: build
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write # tags, Releases, assets, and verctl/release/main without the App
      pull-requests: write # the Version PR without the App
      # crates.io trusted publishing in release.yml's publish job, and the
      # release mirror in every release.yml job.
      id-token: write
    with:
      # mise.release.toml's ver task runs verctl from PATH, where each job
      # puts the build above.
      mise-env: ci,release
      verctl-artifact: verctl
      # crates.io lists this repository and self-release.yml as verctl's
      # trusted publisher.
      crates-io-trusted-publishing: true
    secrets:
      app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
      release-mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
      release-mirror-ci-key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
