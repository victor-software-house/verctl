# Stock drivers. build.rs turns this into src/generated.rs.
# after is never implied — declare it on the package or driver if you want
# cargo update --workspace, npm install, bun install, pnpm i, etc.

[drivers.cargo]
format = "toml"
keys = ["workspace.package.version", "package.version"]

[drivers.npm]
format = "json"
keys = ["version"]

[filenames]
"Cargo.toml" = "cargo"
"package.json" = "npm"
