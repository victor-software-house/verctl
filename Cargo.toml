[package]
name = "verctl"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "Stack-agnostic version PRs from Changesets-format fragments"
license = "MIT"
repository = "https://github.com/victor-software-house/verctl"
homepage = "https://github.com/victor-software-house/verctl"
readme = "README.md"
keywords = ["version", "changelog", "mise", "changeset", "release"]
categories = ["command-line-utilities", "development-tools"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.5", features = ["derive"] }
minijinja = { version = "2.24.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yml = "0.0.12"

[dev-dependencies]
indoc = "2.0.7"
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
