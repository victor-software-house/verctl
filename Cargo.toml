[package]
name = "verctl"
version = "0.7.2"
edition = "2024"
rust-version = "1.99.1"
description = "Stack-agnostic version PRs from Changesets-format fragments"
license = "MIT"
repository = "https://github.com/victor-software-house/verctl"
readme = "README.md"
keywords = ["version", "changelog", "mise", "changeset", "release"]
categories = ["command-line-utilities", "development-tools"]
autotests = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cap-lints", "warn"]

# One-off for the VER-079 patch release; delete this table once it is on crates.io.
[package.metadata.cargo-semver-checks.lints]
function_missing = "warn"
struct_pub_field_missing = "warn"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it, not a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# format! or push_str, not + on a String.
string_add = "deny"
# From and TryFrom, not as, which can silently truncate or wrap. A site that
# truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]>, not Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls the first the
# idiomatic path and mod.rs the older style, whose many same-named files blur
# together in an editor (ch07-05, "Alternate File Paths").
mod_module_files = "deny"
# A library logs through tracing or log; printing is the binary's choice.
print_stdout = "deny"
print_stderr = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.1"
clap = { version = "4.6.5", features = ["derive"] }
ctl-core = { version = "=0.6.23", features = ["input", "surface", "usage"] }
duct = "1.1.1"
glob = "0.3.3"
gix = { version = "0.89.0", default-features = false, features = [
  "blocking-http-transport-reqwest-rust-tls",
  "excludes",
  "revision",
  "sha1",
  "status",
] }
jsonc-parser = { version = "0.33.1", features = ["cst"] }
serde_json = "1.0.145"
minijinja = { version = "2.24.0", features = ["deserialization", "serde"] }
# verctl authenticates with a personal token only, so octocrab's JWT backends stay off.
octocrab = { version = "0.54.5", default-features = false, features = [
  "default-client",
  "follow-redirect",
  "retry",
  "rustls",
  "rustls-ring",
  "timeout",
  "tracing",
] }
os_pipe = "1.2.3"
regex = "1.13.1"
# The crates.io sparse index and docs.rs reads (VER-066). gix's HTTP transport
# already builds this version with rustls, so declaring it adds no crate.
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
] }
semver = "1.0.27"
tokio = { version = "1.50.0", features = ["rt", "macros", "time", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
toml_edit = "0.23.10"
garde = { version = "0.23.0", features = ["derive"] }

[dev-dependencies]
indoc = "2.0.7"
tempfile = "3.23.0"
wiremock = "0.6"

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[[test]]
name = "action_publish"
path = "tests/action_publish.rs"

[[test]]
name = "bump"
path = "tests/bump.rs"

[[test]]
name = "changelog"
path = "tests/changelog.rs"

[[test]]
name = "examples"
path = "tests/examples.rs"

[[test]]
name = "fragment"
path = "tests/fragment.rs"

[[test]]
name = "prepare_stage"
path = "tests/prepare_stage.rs"

[[test]]
name = "publish"
path = "tests/publish.rs"

[[test]]
name = "release"
path = "tests/release.rs"

[[test]]
name = "status"
path = "tests/status.rs"

[[test]]
name = "usage"
path = "tests/usage.rs"

[[test]]
name = "versions"
path = "tests/versions.rs"
