[package]
name = "verctl"
version = "0.4.5"
edition = "2024"
rust-version = "1.99.0"
description = "Stack-agnostic version PRs from Changesets-format fragments"
license = "MIT"
repository = "https://github.com/victor-software-house/verctl"
readme = "README.md"
keywords = ["version", "changelog", "mise", "changeset", "release"]
categories = ["command-line-utilities", "development-tools"]

# Patch releases carry API changes that cargo-semver-checks reports as
# breaking against 0.4.5, by the operator's ruling, so these lints warn
# instead of failing. They still print each finding.
# - `function_parameter_count_changed`: `release::open_or_update_pr` takes
#   the resolved Version PR instead of a title and a message (VER-064).
# - `pub_module_level_const_missing`: `release::VERSION_BRANCH` gave way to
#   the derived `release::version_branch` (VER-066).
# - `constructible_struct_adds_field`: `cli::PrepareArgs` gained
#   `auto_merge` (VER-066).
# VER-065 removes this table once a release with these changes is on
# crates.io, because the check then compares against it.
[package.metadata.cargo-semver-checks.lints]
function_parameter_count_changed = "warn"
pub_module_level_const_missing = "warn"
constructible_struct_adds_field = "warn"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.1"
clap = { version = "4.6.5", features = ["derive"] }
ctl-core = { version = "=0.6.21", features = ["input", "surface", "usage"] }
duct = "1.1.1"
glob = "0.3.3"
gix = { version = "0.89.0", default-features = false, features = [
  "blocking-http-transport-reqwest-rust-tls",
  "excludes",
  "revision",
  "sha1",
  "status",
] }
jsonc-parser = { version = "0.33.1", features = ["cst"] }
serde_json = "1.0.145"
minijinja = { version = "2.24.0", features = ["deserialization", "serde"] }
octocrab = "0.54.1"
os_pipe = "1.2.3"
regex = "1.13.1"
semver = "1.0.27"
tokio = { version = "1.50.0", features = ["rt", "macros", "time", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
toml_edit = "0.23.10"
garde = { version = "0.23.0", features = ["derive"] }

[dev-dependencies]
indoc = "2.0.7"
tempfile = "3.23.0"
wiremock = "0.6"

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
