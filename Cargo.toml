[package]
name = "verctl"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
description = "Stack-agnostic version PRs from Changesets-format fragments"
license = "MIT"
repository = "https://github.com/victor-software-house/verctl"
homepage = "https://github.com/victor-software-house/verctl"
readme = "README.md"
keywords = ["version", "changelog", "mise", "changeset", "release"]
categories = ["command-line-utilities", "development-tools"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.1"
clap = { version = "4.6.5", features = ["derive"] }
ctl-core = "0.0.3"
duct = "1.1.1"
glob = "0.3.3"
git2 = { version = "0.21.0", features = ["https", "vendored-libgit2", "vendored-openssl"] }
gray_matter = { version = "0.3.2", default-features = false, features = ["yaml"] }
jsonc-parser = { version = "0.33.1", features = ["cst"] }
serde_json = "1.0.145"
minijinja = { version = "2.24.0", features = ["deserialization", "serde"] }
octocrab = "0.54.1"
os_pipe = "1.2.3"
regex = "1.13.1"
semver = "1.0.27"
tokio = { version = "1.50.0", features = ["rt", "macros", "time", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
toml_edit = "0.23.10"
garde = { version = "0.23.0", features = ["derive"] }
yaml_serde = "0.10.7"

[dev-dependencies]
indoc = "2.0.7"
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
