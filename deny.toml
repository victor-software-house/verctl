[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
# RUSTSEC ids and yanked crates that cannot be upgraded yet. Not a lint-level downgrade.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # subtle, curve25519-dalek, ed25519-dalek (octocrab's JWT signing), encoding_rs, and simple_asn1
    "BSD-3-Clause",
    # ring, untrusted, and rustls-webpki (octocrab's TLS)
    "ISC",
    # foldhash, through gix's object cache
    "Zlib",
    # webpki-root-certs, the CA roots gix's HTTPS transport verifies against
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies carry no version; wildcards stay denied for the rest.
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl", reason = "TLS is rustls" },
    { crate = "native-tls", reason = "TLS is rustls" },
]
skip = [
    { crate = "base64@0.22", reason = "octocrab 0.54.9, the latest release, requires base64 0.22, and reqwest 0.13.5 requires 0.23" },
    { crate = "getrandom@0.2", reason = "ring 0.17.14 and octocrab 0.54.9, their latest releases, require getrandom 0.2" },
    { crate = "hashbrown@0.14", reason = "dashmap 6.2.1, the latest release, which gix-tempfile takes, requires hashbrown 0.14" },
    { crate = "hashbrown@0.16", reason = "clru 0.6.3 and gix-status 0.37.0, the latest releases, require hashbrown 0.16" },
    { crate = "syn@2", reason = "garde_derive 0.23.0, the latest release, and other derive crates require syn 2" },
    { crate = "windows-sys@0.52", reason = "ring 0.17.14, the latest release, requires windows-sys 0.52" },
]

# Declarations repeated outside [workspace.dependencies], and unused entries.
[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
