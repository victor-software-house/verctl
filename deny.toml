[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
# RUSTSEC ids and yanked crates that cannot be upgraded yet. Not a lint-level downgrade.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa code is linked but never run: verctl signs no JWT. octocrab requires a JWT backend, and the other one builds aws-lc with C and cmake. Remove when rsa ships a fix or octocrab no longer requires it." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # subtle, curve25519-dalek, ed25519-dalek (octocrab's JWT signing), encoding_rs, and simple_asn1
    "BSD-3-Clause",
    # ring, untrusted, and rustls-webpki (octocrab's TLS)
    "ISC",
    # foldhash, through gix's object cache
    "Zlib",
    # webpki-root-certs, the CA roots gix's HTTPS transport verifies against
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies carry no version; wildcards stay denied for the rest.
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl", reason = "TLS is rustls" },
    { crate = "native-tls", reason = "TLS is rustls" },
]

# Declarations repeated outside [workspace.dependencies], and unused entries.
[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
