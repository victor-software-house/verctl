# Without this, a dependency behind a non-default feature escapes the bans.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
# Each entry: the RUSTSEC id, a reason, and the condition for removing it.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    # subtle, curve25519-dalek, ed25519-dalek (octocrab's JWT signing),
    # encoding_rs, and simple_asn1.
    "BSD-3-Clause",
    # ring, untrusted, and rustls-webpki (octocrab's TLS).
    "ISC",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# openssl and native-tls are not banned yet: git2 builds with vendored
# OpenSSL until verctl moves to the git CLI or gix. Ban both then.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
