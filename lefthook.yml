pre-commit:
  skip:
    - run: test -n "$CI"
  commands:
    format:
      glob: "**/*.rs"
      run: mise run format

commit-msg:
  skip:
    - run: test -n "$CI"
  commands:
    committed:
      run: mise exec -- committed --commit-file {1}

pre-push:
  skip:
    - run: test -n "$CI"
  commands:
    committed:
      run: mise exec -- committed HEAD
    verify:
      run: mise run verify
