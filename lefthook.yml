pre-commit:
  skip:
    - run: test -n "$CI"
  commands:
    # TODO(VER-043): remove once a mise release includes jdx/mise#14316.
    warm-remote-tasks:
      priority: 1
      run: env -u GIT_INDEX_FILE mise tasks ls >/dev/null
    format:
      glob: "**/*.rs"
      run: mise run format

commit-msg:
  skip:
    - run: test -n "$CI"
  commands:
    # TODO(VER-043): remove once a mise release includes jdx/mise#14316.
    warm-remote-tasks:
      priority: 1
      run: env -u GIT_INDEX_FILE mise tasks ls >/dev/null
    committed:
      run: mise run commit-msg {1}

pre-push:
  skip:
    - run: test -n "$CI"
  commands:
    committed:
      run: mise run commits
    versions:
      run: mise run versions
    verify:
      run: mise run verify
