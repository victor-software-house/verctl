# Loaded when MISE_ENV contains `dev` (local default via .miserc.toml).
# Compile this checkout. The Version PR lane runs here too (`MISE_ENV: dev` in
# version-pr.yml), so this repo prepares its own release with the verctl it is
# about to publish, not the tarball of the last one.

[tools]
committed = "1.1.11"
conftest = "0.69.0"
lefthook = "2.1.10"
rust = { version = "nightly-2026-08-16", components = "rustfmt,clippy" }

[deps.cargo]
auto = true
description = "Fetch crates when Cargo.lock changes"
run = "cargo fetch --locked"
sources = ["Cargo.toml", "Cargo.lock"]

[tasks.format]
description = "rustfmt check"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "clippy -D warnings"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.commit-msg]
description = "Lint the git commit-msg file with committed"
usage = 'arg "<file>" help="Path to the commit message file"'
run = 'committed --commit-file "${usage_file}"'

[tasks.commits]
description = "Lint commit messages with committed"
usage = 'arg "[commits]" default="HEAD" help="Commit or range"'
run = 'committed "${usage_commits}"'

[tasks.versions]
description = "Fail if manifest versions differ from the default branch"
run = "cargo run -- check --versions"

[tasks.policy]
description = "Conftest on GitHub workflows"
run = "conftest test --policy policy .github/workflows"

[tasks.verify]
description = "Format, lint, policy, test, and version guard"
depends = ["format", "lint", "policy"]
run = "cargo test --all-features && cargo run -- check --versions"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.ver]
description = "Run verctl from this checkout"
run = "cargo run --"
