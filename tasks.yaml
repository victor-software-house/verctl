  - id: VER-023
    title: Is this how a modern Rust CLI is built?
    scope: verctl
    kind: evaluation
    outcome: >-
      The crate layout, error handling, test structure, and fixture
      approach are what current Rust practice recommends — or we know
      exactly where we differ and why we keep it.
    open: >-
      2026-08-18, raised by Victor: nothing here is unmanageable, but the
      pattern was never checked against the field. Questions worth
      researching rather than guessing: flat `src/*.rs` modules versus
      grouped ones as the crate keeps growing; anyhow everywhere versus a
      typed error at the library boundary with anyhow only in main; unit
      tests in-file versus `tests/` (both are used here, with no stated
      rule); hand-written table tests versus a fixture or snapshot crate;
      and how much of the answer belongs in ctl-core so all three CLIs
      share it (VER-022). Deliverable is a short written standard in
      ctl-core plus a list of what to change here, not a rewrite.

