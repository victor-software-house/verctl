  - id: VER-032
    title: A release tags the commit it published
    scope: verctl
    outcome: The tag a release creates resolves to the commit that was built and published, not to whatever the default branch points at when the API call runs.
    notes:
      - '2026-08-20: found while checking the consumer report in docs/adoption-report.md, which asked only that a pushed tag be verified after the fact. It is worse than that. `github::ensure_release` calls `releases.create(tag)` and never sets `target_commitish`, so GitHub tags the default branch''s HEAD at the moment of the call — not the commit that was built and published. v0.1.3 is right only because main did not move: `git rev-parse v0.1.3^{}` and `git rev-parse origin/main` are both 2fd33a6c5713. Anything merging to main during the publish job puts the tag on a tree that was never built, which is the served-files contract''s one premise (docs/served-files.md:3 — "its version must be correct in the tree the tag names"). Nothing else creates the tag: no `git tag` or `refs/tags` anywhere in src/, no tag step in .github/workflows/publish.yml, and `git cat-file -t v0.1.3` says `commit` — a lightweight tag, which is what the Releases API makes. The retry path needs the same treatment for a different reason: `ensure_release` returns early when `get_by_tag` succeeds (src/github.rs:249-250) without looking at where that tag points, and `target_commitish` cannot correct a tag that already exists. If VER-038 is taken, the first acceptance line here is superseded rather than also done: a tag created git-side already exists by the time a Release is made, and the API documents `target_commitish` as unused in that case. The re-read lines stand either way.'
    completed: 2026-08-22T13:59:28
    evidence:
      - ensure_release sets target_commitish to HEAD SHA.
      - The tag is re-read after create and on retry; a mismatch fails.
      - 'wiremock: create_tags_the_published_commit_not_the_default_branch'
    disposition: completed

  - id: VER-039
    title: A release declares what its tags are named
    scope: verctl
    outcome: A repo says the shape of its release tags in one line with a sane default, and a release that cannot name what it shipped refuses instead of guessing.
    notes:
      - 'The shape, so the live defect is not waiting on discovery. The consumer''s strawman is a `tags.template` plus a `releases: per-package | aggregate` enum; the enum is redundant, because **the arity falls out of the template**. A template with no `{name}` can only name one tag; one with `{name}` can only mean one per package. Two fields that cannot disagree should be one field, and the one that survives is the one a reader can look at and know what they get. So: one optional line, defaulting to `v{version}`, in the placeholder vocabulary `patterns.match` already uses — a single-package repo writes nothing and a monorepo writes `template: "{name}@{version}"`.'
      - "What this kills: `tag_for` (src/publish.rs:158) dedups the versions and, when more than one survives, tags with the *first declared* package's version — a value with no relationship to the release, chosen silently. With a template there is always an answer: either the shape names every package, or it cannot name this release and says so."
      - "Deliberately not here, because it is where the design risk actually is: splitting the changelog so each Release carries only its own package's section, and creating a tag set all-or-nothing. Atomicity is not reachable through the Releases API — they get it from `git push --atomic` on locally created tags, which is a different tagging path, so it stays with VER-038. Idempotent retry is the weaker property that is reachable now and is what the acceptance asks for. VER-032 is orthogonal: it fixes which commit a tag names, whatever the tag is called."
    completed: 2026-08-22T13:04:12
    evidence:
      - 'feat/039-declare-the-tag-shape: tags.template + per-package Release bodies'
    disposition: completed

