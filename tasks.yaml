# yaml-language-server: $schema=https://github.com/victor-software-house/qctl/releases/download/v0.0.1/tasks.schema.json
schema_version: 1
prefix: VER
active: VER-011

queue:
  - id: VER-011
    title: Finish the Changesets-shaped release loop
    scope: verctl
    outcome: >-
      Fragment in, Version PR, exact-SHA publish, per-package CHANGELOG,
      lockfile, already-published, optional natives. No hand-edited
      versions.
    blocked_by: []
    acceptance:
      - prepare writes versions + per-package CHANGELOG and consumes fragments.
      - Version PR is the only version-authority path (CI / --pr).
      - "`[prepare].after` plus stage globs; unexpected dirty files fail."
      - publish is overridable recipes; cargo and bun are stock examples.
      - Lockfile is committed; cargo publish --locked works after bump.
      - Pretty is ctl-core ColorMode tables; tests use --color never.
      - Native assets only when [assets] is set; PR CI stays one runner.
      - Asset jobs are named by target id; cargo/bun inherit stdio.
    notes: >-
      Original product goal. Do not name the private release-skill in
      repo docs. Rust and bun are stock examples, not the architecture.
      Adopt ctl-core fixture trees (CTC-006) instead of more fs::write
      + indoc copies. 2026-08-17: status/check/prepare are ColorMode
      tables; publish proves changelog headings + default-branch
      history (no commit-subject sniff); GitHub notes come from each
      package CHANGELOG. Still open for archive: lockfile-after-bump
      (VER-013). Hand-edit guard is VER-012 on feat/12-block-hand-versions.

  - id: VER-012
    title: Block hand-edited versions on the default branch
    scope: verctl
    outcome: >-
      A pre-push or check fails when a declared manifest version
      differs from origin/main outside version-packages.
    blocked_by: [VER-011]
    acceptance:
      - version-packages and CI release jobs are exempt.
      - Local fragment-only commits still push.
      - Documented as verctl check --versions or a mise hook.
    notes: >-
      Stacked on main after PR #8. `verctl check --versions` plus
      `mise run versions` on pre-push. Compares declared manifests
      to origin/HEAD, GITHUB_BASE_REF, main, master. Do not use
      GITHUB_REF_NAME. Tests inject Skip so CI env cannot hide drift.

horizon:
  - id: VER-013
    title: Stock lockfile refresh after cargo bumps
    scope: verctl
    kind: evaluation
    outcome: >-
      After a cargo version write, Cargo.lock is regenerated so
      publish --locked does not fail.
    open: >-
      Decide whether this is default after for the cargo driver or a
      [prepare].after the repo opts into.

  - id: VER-014
    title: First-party composite Action packages
    scope: verctl
    kind: evaluation
    outcome: >-
      action.yml packages get floating major tags without npm.
    open: Need a first-party Action that is not this repo's own actions/.

  - id: VER-010
    title: Stock JS publish for npm, pnpm, and yarn
    scope: verctl
    kind: evaluation
    outcome: >-
      package.json still publishes through one table of argv. Bun stays
      the default. npm/pnpm/yarn are extra rows, not new verbs or
      Action commands.
    open: >-
      Need a consumer that is not Bun. Infer from packageManager /
      lockfile the same way detect.rs already does for install. Action
      stays `verctl publish`.

  - id: VER-008
    title: Generic regex version writer
    scope: verctl
    kind: evaluation
    outcome: Packages that are not Cargo or package.json can still bump via a declared pattern.
    open: Need a real third manifest (not a hypothetical) before adding a regex writer.

  - id: VER-006
    title: Conventional Commits synthesize the same fragments
    scope: verctl
    kind: deferred
    outcome: An opt-in mode writes .changeset/*.md from commit types.
    open: Default stays off. Fragments remain the human input.

  - id: VER-007
    title: OIDC publish backends for cargo and bun
    scope: verctl
    kind: deferred
    outcome: Public npm uses trusted publishing, not NPM_TOKEN.
    open: bun publish --tolerate-republish already ships. OIDC is the remaining auth path.

archive:
  - id: VER-005
    title: "Publish native verctl so mise github: can install it"
    scope: release
    completed: "2026-08-17"
    disposition: completed
    outcome: >-
      crates.io plus GitHub Release assets for darwin-arm64 and linux-x64.
    evidence:
      - "crates.io verctl 0.0.1"
      - "github.com/victor-software-house/verctl/releases/tag/v0.0.1"
      - "verctl_0.0.1_linux_x64.tar.gz and verctl_0.0.1_macos_arm64.tar.gz"
      - "mise x github:victor-software-house/verctl@0.0.1 -- verctl --version"

  - id: VER-009
    title: Keep verctl on ctl-core after the chassis hardens
    scope: verctl
    completed: "2026-08-17"
    disposition: completed
    outcome: >-
      verctl stays on ctl-core prelude/View/formatdoc. No local help
      or color copy comes back.
    evidence:
      - "ctl-core = \"0.0.3\" on crates.io"
      - "ColorMode tables; no path = \"../ctl-core\""

  - id: VER-004
    title: Open or update the Version PR
    scope: verctl
    completed: "2026-08-17"
    disposition: completed
    outcome: >-
      One prepare-release PR consumes fragments, commits version files
      and CHANGELOG, and deletes the consumed .changeset files.
    evidence:
      - "github.com/victor-software-house/verctl/pull/7"
      - "crates.io verctl 0.0.1"
      - "actions/version-pr and actions/publish"

  - id: VER-003
    title: Write Cargo.toml and package.json versions
    scope: verctl
    completed: 2026-08-16
    disposition: completed
    outcome: >-
      prepare --no-pr applies the max bump per declared package to
      Cargo.toml and package.json.
    evidence:
      - verctl prepare --no-pr
      - cargo/npm are stock Path drivers (format + keys + after)
      - custom drivers via format+keys or read/write shell
      - tests/bump.rs (including declared keys and shell driver)

  - id: VER-002
    title: Render changelogs with minijinja
    scope: verctl
    completed: 2026-08-16
    disposition: completed
    outcome: Defaults are Jinja2 templates rendered by minijinja 2.x.
    evidence:
      - templates/changelog.jinja and dependency-changelog.jinja
      - tests/changelog.rs

  - id: VER-001
    title: Parse Changesets YAML fragments (quoted and unquoted)
    scope: verctl
    completed: 2026-08-16
    disposition: completed
    outcome: YAML fragments via gray_matter. status and check fail closed.
    evidence:
      - src/fragment.rs
      - tests/fragment.rs and tests/status.rs
