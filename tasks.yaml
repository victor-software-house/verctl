archive:
  - id: VER-029
    title: The Version PR exemption must not race its own label
    scope: verctl
    outcome: The Version PR's own CI passes the hand-edit guard on the first run, without anyone reopening it.
    notes:
      - '2026-08-20, hit on the v0.1.1 release and measured, not inferred. The Version PR''s own CI failed `check --versions` with "verctl 0.1.0 -> 0.1.1", the exact hand edit the guard exists to catch, on the commit `prepare` had just written. `github::event_labels` reads `pull_request.labels` out of `GITHUB_EVENT_PATH`, and that payload is a snapshot taken when the event fired — but `prepare --pr` opens the PR and then applies `verctl:version` in a second call, so the `opened` payload carries an empty label list. Proof: closing and reopening PR #48 fired a fresh event and the same job printed `exempt · version-pr`, with nothing else changed. The PR carried the label the whole time. Not a new break — v0.1.0''s Version PR passed, which is what a race looks like. Do not "fix" it by trusting the branch name: `GITHUB_HEAD_REF` is deliberately not an exemption (VER-012), because a contributor can name a branch anything. Candidates worth weighing rather than one assumed here: have `prepare --pr` create the PR with the label already on it if the API allows, add `labeled` to the workflow''s `pull_request` types so the label itself triggers a run, or have the guard ask the API for the PR''s current labels instead of reading a stale payload.'
    completed: 2026-10-19T10:01:31
    evidence:
      - https://github.com/victor-software-house/verctl/pull/188
      - check --versions knows the Version PR by head repository, head branch verctl/release/<base>, and current base, read through the API; CI drops the labeled and unlabeled triggers. The first-run proof comes with the first Version PR after the next minor release.
    disposition: completed

