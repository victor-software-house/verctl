# yaml-language-server: $schema=https://github.com/victor-software-house/qctl/releases/download/v0.5.9/tasks.schema.json
schema_version: 4
prefix: VER

style:
  timezone: "-03:00"
  section_order: [queue, horizon, archive]
active: VER-011

queue:
  - id: VER-011
    title: Finish the Changesets-shaped release loop
    scope: verctl
    outcome: >-
      Fragment in, Version PR, exact-SHA publish, per-package CHANGELOG,
      lockfile, already-published, optional natives. No hand-edited
      versions.
    blocked_by: []
    acceptance:
      - '`verctl version` writes every manifest, dependent requirement, lockfile, CHANGELOG section, and served file a release changes, removes the consumed fragments, and reports the commands and steps it ran under `after`.'
      - 'verctl writes no lockfile: `Cargo.lock`, `bun.lock`, and `mise.lock` change only through cargo, bun, and mise, and verctl only reads them to check agreement.'
      - A Version PR is identified by its head repository, its head branch `verctl/release/<base>`, and its base; `check` also requires its diff to equal the version step applied to its base, and no label is read.
      - Release state is derived from facts on every run, and a rerun of `verctl release` after a partial failure finishes the release and reports each completed transition as `already`.
      - Publish precedes the tag for a package with an unchecked upload, a registry-checked package is tagged before its uploads (VER-073), tags land on the release commit in one atomic push, and a Release with assets stays a draft until every asset is uploaded.
      - Cargo and Bun are built-in providers; a package can replace one block with a step, and another stack can declare a whole ecosystem from steps.
      - A step is a mise task or an argv that changes only its declared `writes`, and a step that runs after a release declares a `check`.
      - "Bun packages publish through `bun pm pack` and verctl's own npm registry client, with `auth: oidc` and provenance available, and bun-release is archived."
      - '`.ctl/ver.yaml` declares each concern in one key, refuses unknown keys at every level, and names the replacement of each removed key.'
      - Every breaking change shipped in 0.4.0, later work shipped as additive patches, and qctl, forkctl, ctl-core, unixd, and yamled release through 0.4.x.
    notes:
      - 'Original product goal. Do not name the private release-skill in repo docs. Rust and bun are stock examples, not the architecture. Adopt ctl-core fixture trees (CTC-006) instead of more fs::write + indoc copies. 2026-08-17: status/check/prepare are ColorMode tables; publish proves changelog headings + default-branch history (no commit-subject sniff); GitHub notes come from each package CHANGELOG. Hand-edit guard shipped as VER-012 / PR #9. Still open for archive: lockfile-after-bump (VER-013).'
      - '2026-10-12 (UTC): the operator approved all eight decisions of the OpenSpec change release-state-machine as recommended: (1) derive release state from facts on every run, with no state file or labels; (2) release on push to the release branch, then propose; (3) identify the Version PR by head repository, head branch, and base, and verify its content; (4) one Version PR per base on verctl/release/<base>, with no per-package PRs and no version in the branch name; (5) built-in cargo and bun as providers of building blocks, extensions as steps run through mise tasks or argv, declared ecosystems for other stacks; (6) mise installs, verifies, runs steps, and owns mise.lock, and verctl writes no lockfile; (7) bun-release in Rust as option (b), Bun packs and verctl owns the registry protocol; (8) ship 0.4.0 from an integration branch next, then patches. The held plan on feat/011-refresh-lockfile is replaced by that change and deleted unpushed.'

  - id: VER-015
    title: Asset runners are configuration, not a hardcoded map
    scope: verctl
    outcome: >-
      Each [assets] target names the runner that builds it. The plan
      emits what the repo declared, so a public repo stays on free
      hosted minutes and a private one can point at its own labels.
    blocked_by: []
    acceptance:
      - A machine is declared once as [runners.NAME] with labels; [ci.NAME] names several, [assets.NAME] exactly one.
      - verctl ci and verctl assets print what resolved and the matrix carries it.
      - A public repo needs no config to keep macos-latest / ubuntu-latest, and no [ci] to keep one verify job.
      - A declared self-hosted or nscloud label set reaches runs-on unchanged, in order.
      - An undeclared machine name fails listing the declared ones; a label is never accepted as a name.
      - Tests cover default, override, multi-label, fan-out naming, empty list, and a partial undeclared target.
    notes:
      - '2026-08-17: found while adopting the lane in qctl (qctl#3). Two claims first written here were wrong and are corrected: a per-target `runner` override already existed, and a job can be told its runner by an earlier job. The real defects are that `runner` is one string where GitHub takes a label set, that CI has no configuration surface at all, and that an unknown id with a partial record is accepted and reaches `cargo build --target ""`. Shape settled after several wrong turns, recorded so they are not retried: anonymous list rows needing an `id` field (`[[ci.jobs]]`, `runners = [{ labels = [...] }]`) were rejected as ceremony — names are table headers instead; a `runners` list on an asset target was rejected because two machines would overwrite one tarball, which the shape now makes unsayable; and one identical shape per phase was abandoned once it put `os`/`arch` on a job while its labels sat a level below. A name→labels registry is deliberately not the alias table rejected earlier: an alias made an invented word look like a resolved label, whereas a machine name resolves against `[runners]` or fails and never reaches GitHub. M1 (generating ci.yml) and M3 (a repo variable) were considered and rejected for M2, the plan-job bootstrap the publish lane already uses; M3 would move the value out of verctl.toml entirely. Asked why `plan` is not configurable, the inventory settled the law: verctl decides how many jobs there are, the workflow file decides where a fixed job runs. Unary jobs (`plan`, `crate`, `pin`, `prepare`) all have literal machines; only `verify` and `assets`, whose count the repo decides, read config. A static YAML file cannot declare N jobs without knowing N — that fan-out is what config buys, and the machine rides along on it. So `[release]` is dropped, not deferred: publish and pin are inherently unary, nothing decides their count, and a self-hosted-only repo is already served by editing three literals in workflows it owns. `verctl check --ci` was rejected with it — verifying those literals needs a YAML dependency this crate does not have, to check a value the law puts there on purpose.'

  - id: VER-020
    title: check validates served files, and one file has one owner
    scope: verctl
    outcome: >-
      A served file edited by hand, or claimed by both a template and a
      pin, fails on the PR that does it instead of at release time.
    blocked_by: []
    acceptance:
      - '`check` runs the same validation prepare does: every pattern still matches at its declared arity.'
      - '`check` compares every served file to what its template renders at the versions on HEAD.'
      - A file that a template renders and a [[pins]] entry also names fails before anything is written.
      - The failure names the file and which two declarations claim it.
    notes:
      - '2026-08-18: docs/served-files.md §6 describes check as designed, not implemented — only prepare and its dry run validate today, so drift introduced by hand survives until a release. The double-owner gap is real and silent: prepare_report rewrites pins first and renders templates second, so a template would clobber the rewrite without saying so.'

  - id: VER-021
    title: Every config file we own has a JSON Schema, at a URL an IDE can fetch
    scope: verctl
    outcome: >-
      Editing a repo's declarations, tasks.yaml, or a changeset fragment in an
      IDE completes the keys and marks a wrong one, in every ctl repo, with
      no editor-local setup.
    blocked_by: []
    acceptance:
      - The schemas are generated from the Rust types, so a key that exists in code exists in the schema and no other.
      - 'Every declaration file a repo writes carries `# yaml-language-server: $schema=<url>`, and so do tasks.yaml and changeset fragments.'
      - The URL is versioned, and a repo's own schema line is kept current by a [patterns] pin, not by hand.
      - A generated schema that drifts from the types fails a check, the same way a served file does.
      - qctl and ctl-core carry the same lines for the same files.
    notes:
      - "2026-08-18, decided with Victor: free and already versioned wins over a prettier host, so this follows the pattern that already exists rather than inventing one. Evidence: qctl ships schema/tasks.schema.json as a release asset, ctl-core's tasks.yaml already points $schema at `releases/download/v0.0.1/tasks.schema.json`, and qctl's own ledger already decided the URL is a pinned tag and never /latest — a schema that changes under an unchanged file is worse than an old one. What is missing is the rest: verctl.toml and changeset fragments have no schema at all, qctl's is hand-written JSON rather than generated from the types, and every pinned URL is bumped by hand. The staleness objection is what VER-018 just answered: a schema URL is a version site like any other, so it becomes a [patterns] entry and prepare keeps it current on the Version PR. mise ships its own schema and we only reference it; template declarations are not a file an editor validates by URL."
      - '2026-08-18, blocker found by running it: every qctl mutation deletes the schema line it is supposed to protect. `qctl start` on a copy of this file rewrote it through serde_yaml and dropped every comment, line 1 included, so `# yaml-language-server: $schema=…` survives only until the next `q start` or `q archive`. tasks.yaml cannot carry a schema pointer until qctl writes comments back. The same applies to every comment here: none of them survive a verb, which is why an archived blocker is recorded in notes rather than beside the key.'

  - id: VER-022
    title: Move the reusable schema layer into ctl-core
    scope: verctl
    outcome: >-
      Every ctl CLI parses and validates declared input the same way,
      from one implementation, instead of three that drift.
    blocked_by: []
    acceptance:
      - The shared validators (`inside_the_repo`, `one_file_name`, `at_least_one`, `cannot_be_empty`) live in ctl-core and verctl uses them from there.
      - Config loading — read, parse with serde, validate once with garde against the whole document — is one ctl-core entry point.
      - The template renderer's declare-your-own-target mechanism is available to any ctl CLI, not just verctl.
      - No verctl-specific vocabulary leaks into ctl-core, and no copy of the layer is left behind here.
    notes:
      - "2026-08-18: src/schema.rs is already shared between verctl's TOML config and its Jinja template declarations, which is the proof it is not verctl-shaped. ctl-core carries the matching row, CTC-008, merged 2026-08-18 as ctl-core#7, so the destination is agreed before anything moves."
      - '2026-09-28: the validators and config loading moved. ctl-core 0.6.5 ships `validate` and `input`; verctl reads `.ctl/ver.yaml` and fragment frontmatter through `Input`, drops src/schema.rs, gray_matter, and yaml_serde. The template renderer is the part still here.'

  - id: VER-028
    title: Decide who owns a template in the shared .ctl/templates
    scope: verctl
    outcome: Two ctl CLIs can both render served files from one repo without either rendering the other's templates.
    blocked_by: []
    acceptance:
      - The rule is decided and written where the loader enforces it, not in a PR comment.
      - A template belonging to another ctl CLI is either skipped or never in verctl's source tree, and a test proves which.
      - docs/served-files.md §1 says the rule, and VER-025's shared-not-namespaced line is either upheld or superseded in writing.
    notes:
      - "2026-08-19, raised on PR #44 and deliberately not acted on there. `templates.source` defaults to `.ctl/templates`, verctl renders every tracked `*.jinja` under it, and `.ctl/` is shared — so once a second ctl CLI serves files, verctl would render its templates too: an unknown name fails the whole Version PR, and one that only reads `versions[…]` gets written to the other tool's target. Nothing collides today, because no other ctl CLI renders anything, which is why this is a row and not a fix. Scoping the directory to `.ctl/templates/ver/` is the obvious answer and is exactly what VER-025 ruled out (\"shared rather than namespaced, because a template already declares its own target\"), so it is Victor's to reverse, not this row's to assume. The other shape is a template declaring its owning tool, which keeps the directory shared and pays for it with one more export."

  - id: VER-030
    title: The example catalog teaches one pin, not two
    scope: verctl
    outcome: A repo copying examples/mise.toml wires the ?ref= tag and nothing else, so no second version site can disagree with the served task.
    blocked_by: []
    acceptance:
      - examples/mise.toml declares no [tools] entry for verctl; the ?ref= include is the whole pin.
      - mise install --locked still works for a consumer that copies it, with no lockfile row for a tool it no longer names.
      - The template that renders it says why one pin is the rule, so the next reader does not add the second back.
    notes:
      - "2026-08-20, noticed while proving VER-027 at the tag: a clean directory holding only `git show v0.1.1:examples/mise.toml` installs and runs `mise run ver` — but it cannot prove the task's own pin won, because the example's `[tools]` entry names the same version. qctl already settled this as a rule and wrote it into its AGENTS.md: a consumer wires one pin, the `?ref=` tag, because the served task carries its own `#MISE tools` version and wins on PATH, so a `[tools]` entry can only disagree with it — and it needs a lockfile row to survive `mise install --locked`, which is the failure ctl-core#9 hit. qctl queued the same removal for its own example as QCTL-018. This repo's example still teaches two, and it is the example everyone copies, so it teaches the wrong thing twice over. Removing it also makes the pin provable: with no surrounding entry, a consumer that runs the task is running what the task named."

  - id: VER-031
    title: A pattern that cannot rewrite a whole version refuses it
    scope: verctl
    outcome: The rule docs/served-files.md states — a prerelease or floating pin fails the release rather than having its numeric head rewritten — is true of the code, not only of the document.
    blocked_by: []
    acceptance:
      - A pattern whose match is immediately followed by more version-ish text fails the release naming the file and the pattern, instead of rewriting the head and leaving the tail.
      - A test writes a real prerelease into a pinned file and asserts the release stops and the file is untouched.
      - If the engine cannot refuse, docs/served-files.md stops promising it, and says what a pattern author must anchor instead.
    notes:
      - '2026-08-20, found in review of verctl#50 and measured rather than reasoned about. docs/served-files.md §4 says a version is dotted numerics and nothing else, and that "a prerelease or a floating pin is not a version this rewrites: it fails the release rather than rewriting a numeric head and dropping the tail". It does not. With an unanchored `match: "version: {version}"` and a file reading `version: 0.1.1-rc1`, prepare exited 0 and wrote `version: 0.1.2-rc1` — the head moved, the tail stayed, and the release carried on. Kody raised it, our own document contradicted it, and the run settled it: the implementation is the evidence and the document is currently a promise nobody keeps. The condition is exact, and narrower than first written here. A pattern whose `match` ends in literal text already refuses: the test `a_prerelease_pin_fails_instead_of_half_rewriting` uses `"verctl@{version} today"`, and against `verctl@1.0.0-rc.1 today` the digits match but ` today` does not follow, so it fails at arity. Only a match that ends *at* the placeholder has no right-hand boundary, and that is the case that rewrites the head. The author-side answer shipped in #50 as `whole_line: true`, after the first attempt — spelling the closing `---` into the match — was rejected by Victor as a hack: it only worked because `version:` happened to be the last frontmatter key, so adding a key after it would have broken the release. A line-owning pattern supplies the boundary from the line, which is unambiguous. What is left is an inline pattern ending at the placeholder. Do not "fix" it by refusing when the next character continues the version: the discriminator is not local. `download/v{version}` against `download/v1.2.3-linux-x64.tar.gz` has `-` right after the match and is completely correct — the version is 1.2.3 and the rest is the filename. Refusing there would stop real releases, which is why this is a row and not a one-line guard. Either the engine grows a boundary an author can state (as `whole_line` does), or docs/served-files.md stops promising unconditionally and says which shapes are safe.'

  - id: VER-033
    title: Publish follows the dependency graph, not the declaration order
    scope: verctl
    outcome: A workspace whose packages depend on each other publishes every dependency before its consumers, and says which order it resolved.
    blocked_by: []
    acceptance:
      - Order comes from the manifests verctl already parses, or from a declared list.
      - The resolved order is printed, the way ci and assets print what they resolved.
      - A cycle fails the run naming the packages in it.
      - A single-package repo sees no change.
    notes:
      - 'docs/adoption-report.md §2. `publish::plan` iterates `config.packages` in declaration order (src/publish.rs), so a consumer published before its dependency leaves a window where its pinned version does not resolve. Their build tool derives the order from the real dependency graph today, which is what they would be giving up. Their request, verbatim: if it is inferred, print it — "a silent topological sort is a thing nobody debugs until it is wrong".'

  - id: VER-034
    title: Publish declares its own before and after, the way prepare does
    scope: verctl
    outcome: A repo can gate a publish on its own artifact check and smoke the registry afterwards, without verctl knowing anything about tarballs or registries.
    blocked_by: []
    acceptance:
      - publish.before argv runs after versions are on HEAD and before the first publisher argv; non-zero stops the run.
      - publish.after argv runs once, after every package published.
      - 'Both receive the resolved package set: name, version, manifest path, publisher.'
      - Neither key set is the same run as today.
    notes:
      - 'docs/adoption-report.md §3, filed as one row because it is one hook pair. They keep 247 lines they are not asking us to absorb: a packed-artifact gate that proves the tarball rewrote every `workspace:` and `catalog:` dep into a concrete version, and a post-publish smoke that installs the published version from the registry and imports every export. Both are stack-specific and should stay theirs. What they cannot do is wire them, because `Prepare` has `after` (src/config.rs:519) and publish has no equivalent. Closing that asymmetry is the whole ask.'

  - id: VER-035
    title: The commit a release publishes from is proved, and a waiver is said out loud
    scope: verctl
    outcome: A release refuses a commit whose shape says it is not the one the version tool generated, and an operator who overrides that leaves a line in the log saying so.
    blocked_by: []
    acceptance:
      - The release SHA is an ancestor of the default branch.
      - Workflow files at the release SHA do not differ from the default branch.
      - The first-parent branch carries exactly one version commit; two always refuse.
      - Each check has a named waiver, and a waived run prints which one was waived.
    notes:
      - 'docs/adoption-report.md §4. `prove_version_commit` (src/publish.rs:136) is `require_changelog_versions` plus `require_on_default_history` — they keep both and want three more. The workflow-drift one is the non-obvious one and it cost them a release: retrying an old release SHA runs the workflow *at that SHA*, so if permissions changed since, the run can publish to the registry and then fail to tag — the registry is not revertible and the tags are the audit trail. Their waivers are workflow_dispatch booleans and the run prints `waived: …`. Their warning about building it: bind a dispatch input to a step-level `env:` and quote it, never interpolate `${{ inputs.x }}` into a `run:` string — inputs arrive as strings over REST and are not coerced to booleans, in a job holding contents/packages/id-token write.'

  - id: VER-036
    title: A check that cannot run says so instead of passing
    scope: verctl
    outcome: No verctl guard reports success by having skipped itself.
    blocked_by: []
    acceptance:
      - expand fails on an unresolved {placeholder} instead of dropping the argument.
      - prove_default_history prints which condition made it skip.
      - One test per site proves the silence is gone.
    notes:
      - Two sites the consumer report raised separately; they are one law, so they are one row. `publisher::expand` filters out any part containing `{` (src/publisher.rs:151), so a typo'd `{registr}` in a custom argv shortens the command line instead of failing, and the error surfaces downstream wearing someone else's name. `prove_default_history` returns `Ok(())` on four conditions — no repo, no head, unpeelable head, no upstream (src/git.rs:95-104) — each defensible alone, but together the check can pass by not running, in exactly the CI shapes where it matters most. Its doc comment already calls two of them skips; the run does not.

  - id: VER-037
    title: The README answers the questions a first publish asks
    scope: verctl
    outcome: A repo publishing through verctl for the first time finds the four answers that currently cost an afternoon each.
    blocked_by: []
    acceptance:
      - What --access does when a registry resolves, and whether a restricted package can be published as public by accident.
      - What GITHUB_TOKEN means locally, where a gh session is not it.
      - 'That permission_denied: write_package is a package-settings problem, not a token problem.'
      - That the tool finalizing a release is the one the workflow pins, not the one at the release commit.
    notes:
      - "docs/adoption-report.md §6, folded into one row because every item is a paragraph the README does not have. The finalizer one is theirs and they call it ugly: their publish job checks out the release commit, so the code that tags and releases *afterwards* also comes from that checkout, and a fix to the tagging logic that landed since is not present on a retry. They restore four files from origin/main between publish and tag to work around it. verctl mostly dodges this by being one pinned binary — but only if the version resolves from the workflow's config rather than the release commit's, which is the sentence to write."

  - id: VER-043
    title: Move the GitHub Actions into dedicated repositories
    scope: verctl
    outcome: The version-pr, publish, and asset actions each live in a repository of their own, versioned and released on their own, so a consumer pins an action without pinning the CLI repository.
    blocked_by:
      - VER-011
    acceptance:
      - Each action that the release state machine keeps has its own public repository with a root action.yml and a floating major tag.
      - This repository no longer holds actions/, and its workflows and every ctl consumer reference the dedicated repositories.
      - Each action repository releases through verctl.
    notes:
      - Follows the VER-011 state machine design, which decides which actions remain and what their inputs are.
      - Satisfies the open condition of horizon row VER-014, which needs a first-party Action outside this repository.

  - id: VER-044
    title: Evaluate a dedicated GitHub App for verctl
    scope: verctl
    outcome: One decision states whether verctl runs as a dedicated GitHub App, and with which permissions, instead of borrowing a Version PR App token and github.token.
    blocked_by: []
    acceptance:
      - A decision record names the permissions the App would hold, the repositories it would be installed on, and each token it would replace.
      - An adopted App has a follow-up row for its rollout; a rejected App has its reason recorded on this row.
      - The decision states which release-state transitions need an identity other than github.token, for example opening a Version PR whose events start CI without approval.
    notes:
      - Today the Version PR workflow mints a token from CHANGESET_VERSION_APP_CLIENT_ID and CHANGESET_VERSION_APP_PRIVATE_KEY, and publish tags and releases with github.token.
      - 'Related: VER-029, the Version PR label race.'
      - '2026-10-12 (UTC): the decision also covers whether verctl should verify the ruleset that limits pushes on the proposal branch `verctl/release/<base>` to the release identity, in `check` or a separate command. The release-state-machine design documents that ruleset but does not verify it.'

  - id: VER-051
    title: Fill each changelog entry with its pull request and commit, and apply internalAuthors
    scope: src/release.rs changelog_sections, src/changelog.rs
    outcome: Every changelog entry and Release body links the pull request that added its fragment, and internalAuthors hides the byline it lists.
    blocked_by: []
    acceptance:
      - changelog_sections resolves the commit that added each fragment and the pull request that merged it, and passes both to the template instead of None.
      - with_author_filter is applied with the configured internalAuthors, so a listed login renders no byline.
      - A test renders an entry with its pull request link and one with an internal author.
    notes:
      - 'release::changelog_sections passes pull_request: None and commit: None, and ChangelogInput::with_author_filter is defined but never called, so internalAuthors is documented and has no effect (main at 9596fb7, verctl 0.3.14). Reported by a consumer adopting verctl that wants a short (#N) per entry and no author credit.'
      - 'Decision (operator, 2026-10-12): render the reference as a short (#N) and credit no maintainer by default; credit outside contributors only. OpenSpec change changelog-references.'
      - 'Follow-up (2026-10-12): the author lookup credited the owner on Version PR #118, so it is removed and no entry carries a byline; VER-054 adds the explicit list on next.'

  - id: VER-071
    title: Every action loads as YAML
    scope: actions/version-pr/action.yml, tests/action_publish.rs
    outcome: A consumer that uses any verctl action gets past "Set up job".
    blocked_by: []
    acceptance:
      - Every `actions/*/action.yml` parses as YAML in a test, so a file GitHub cannot load fails CI.
    notes:
      - 'VER-064 (#155) added an unquoted `: ` to the version-pr `title` description, so v0.4.6 to v0.4.8 shipped an action that GitHub refuses ("Mapping values are not allowed in this context"). Found in shrub run 39190679995. actionlint reads only workflows, so nothing caught it.'

  - id: VER-072
    title: Release from shallow clones and drifted workflow trees
    scope: src/git.rs, src/publish.rs, src/main.rs, src/github.rs, operator docs
    outcome: A depth-1 checkout releases without a manual fetch, and a Release GitHub refuses for a missing workflows permission says so and how to fix it.
    blocked_by: []
    acceptance:
      - With `VERCTL_DEFAULT_BRANCH` set, `publish` and `publish --plan` fetch the whole history of that branch when the clone is shallow; without it the shallow error names the variable.
      - 'A 403 on Release creation is matched on the typed status and names `workflows: write`, the commit, and that `GITHUB_TOKEN` cannot hold it.'
      - The operator instructions and README say to adopt `release.yml` only when no release is pending, or to merge the adoption before the Version PR.
    notes:
      - OpenSpec change release-from-shallow-and-drifted-trees.
      - 'Evidence from a consumer adoption: shallow clone in run 39195633667, 403 "Resource not accessible by integration" after every crate published in run 39198937088, "no task ver found" in run 39196692461.'
      - 'Operator decision 2026-10-19: no App gets workflows: write, and release.yml keeps GITHUB_TOKEN for publish. A registry-checked package is tagged in the Version PR merge run instead, before its uploads (VER-073), so a retry creates no tag GitHub would check.'

  - id: VER-073
    title: Tag at merge for registry-checked packages
    scope: src/publish.rs, src/docsrs.rs, src/pending.rs, src/github.rs, operator docs
    outcome: >-
      A release whose upload fails retries at its version commit without creating a
      tag or Release, so a later workflow change cannot make GitHub refuse it.
    blocked_by: []
    acceptance:
      - A tag whose packages all have a registry check, or no upload, gets its tag and Release before any upload in the publish run.
      - A tag with an unchecked upload gets its tag and Release after the uploads, as before.
      - verctl docs waits only for crates the crates.io index lists, so a tag created before a failed upload does not start a docs.rs wait.
    notes:
      - OpenSpec change tag-at-merge in openspec/changes/tag-at-merge.
      - 'Operator decision 2026-10-19: tag at merge for registry-checked packages; no workflows permission for any App, and no guard until a package with an unchecked real upload exists. It reverses publish-before-tag (VER-011) for registry-checked packages.'

  - id: VER-074
    title: release.yml input for mise config paths the release jobs ignore
    scope: >-
      .github/workflows/release.yml, operator docs,
      openspec/changes/reusable-release-workflow
    outcome: >-
      A caller of the reusable release workflow names mise config files that the
      plan, publish, assets, and docs jobs skip, so they install only the release tools.
    blocked_by: []
    acceptance:
      - With mise-ignored-config-paths set, plan, publish, assets, and docs set MISE_IGNORED_CONFIG_PATHS to each path resolved against the repository root before mise installs any tool, and propose does not.
      - With the input empty, no job sets MISE_IGNORED_CONFIG_PATHS.
      - session-lake's first release on it installs no root mise.toml tool outside propose.
    notes:
      - Design section 1.4 and task 3.4 of OpenSpec change reusable-release-workflow.

  - id: VER-075
    title: "verctl semver: cargo-semver-checks at the release type the pending release allows"
    scope: >-
      src/semver_check.rs, src/registry.rs, src/cli.rs, src/main.rs,
      src/presentation.rs, operator docs
    outcome: >-
      verctl semver fails a crates.io crate whose next release is a patch when its
      public API breaks, and skips a crate whose next release already moves the minor.
    blocked_by: []
    acceptance:
      - A crate whose pending fragments are at most patch, at the baseline's major.minor, is checked with cargo semver-checks --release-type minor against its crates.io baseline.
      - A crate is skipped when a pending fragment for its package is minor or major, when its manifest's major.minor differs from the baseline, or when crates.io has no release of it.
      - A crate at 1.0 or later fails the run, naming the rule.
    notes:
      - OpenSpec change semver-release-type in openspec/changes/semver-release-type.
      - ctl-core's shared semver task calls mise run ver semver; a repository that does not serve the ver task runs its own verctl.

  - id: VER-069
    title: Publish a cargo workspace one member at a time
    scope: src/members.rs, src/publisher.rs, src/publish.rs, src/pending.rs, src/docsrs.rs, src/registry.rs, operator docs
    outcome: A package at a virtual workspace manifest publishes each member in dependency order under its own index check, so a release that stops partway, including at a crates.io rate limit, finishes on rerun and is never tagged early.
    blocked_by: []
    acceptance:
      - '`verctl publish --dry-run` lists a virtual workspace''s publishing members, dependencies first, and leaves out `publish = false`.'
      - Each member runs `cargo publish --locked --manifest-path <path> --package <member>` under its own timeout, and a member the crates.io index lists is reported `already` without running.
      - A 429 from the registry exits non-zero, names the member and the retry time, and creates no tag or Release.
      - The package counts as published only when every member is listed, and `verctl docs` waits for every library member.
    notes:
      - OpenSpec change cargo-workspace-publish in openspec/changes/cargo-workspace-publish; it takes decisions 9 and 10 of release-state-machine (VER-011) as a patch, closing gap W11 for cargo workspaces.
      - 'Orchestrator decision 2026-10-18: implement this in verctl, over a per-repository publish task (rejected: it duplicates verctl logic) and a crates.io limit exception (not needed). Patch bump only.'

  - id: VER-070
    title: A duplicate release asset upload reports already
    scope: src/github.rs
    outcome: A release run whose asset another run already uploaded reports `already` and passes, so a release that is complete never reports red.
    blocked_by: []
    acceptance:
      - An upload refused with GitHub's 422 `already_exists` code, for an asset the release lists as `uploaded`, returns `already <name>`.
      - An asset of that name in another state is re-read for up to a minute, since another run may still be sending it; one that never reaches `uploaded` fails and says to delete it and rerun.
      - Any other upload failure still fails.
    notes:
      - 'Self-release runs 39188632481 and 39188754557 both released 2a7b33d (v0.4.8) and each lost one asset race with `already_exists`. The duplicate check text-matched `format!("{error:#}")`, but octocrab 0.54.1 displays `Error::GitHub` as "GitHub", so the code in `GitHubError.errors` never reached it.'
      - Digests cannot decide a duplicate, because two builds of one commit produce different tarballs. No concurrency group on the asset legs; the idempotent upload makes it unnecessary.

horizon:
  - id: VER-038
    title: A tag set is created whole or not at all
    scope: verctl
    kind: evaluation
    outcome: >-
      A release that names several tags leaves either all of them or none,
      and a rerun from the same commit is a no-op rather than a repair.
    open: >-
      Whether verctl creates tags git-side instead of letting the Releases API
      create them. A first write-up of this row said atomicity is not reachable
      through that API because `releases.create` is one call per tag; that
      framed the wrong object. Atomicity is wanted over the **tags**, not the
      Releases — a Release is derived state that can be recreated from a tag and
      a changelog section, a tag is the thing consumers resolve.
      Read from a consumer's own implementation rather than their description of
      it, the two are separate steps and never interleaved. Tags first:
      `git tag -a <tag> <sha>` per released package at an explicit SHA,
      annotated rather than lightweight, then a single
      `git push --atomic origin refs/tags/a:refs/tags/a …` for the whole set.
      Releases after, one per tag that **already exists**, each body sliced from
      that package's own changelog between its version heading and the next.
      Three rules guard the first step, and they are the row's real content: any
      expected tag already at another commit refuses, a *partial* set refuses
      rather than being completed, and a full set at the right SHA is skipped so
      a rerun is a no-op. Then every tag is re-read with
      `git ls-remote --tags origin refs/tags/<t> refs/tags/<t>^{}`, taking the
      peeled form first so an annotated tag reports its commit and not the tag
      object. A push that exited zero is not accepted as evidence it landed —
      the same law as VER-032.
      This also settles how VER-032 interacts: once the tag exists before the
      Release is created, `target_commitish` is documented as unused, so the
      git-side path makes that field moot rather than something to set. Taking
      this row is therefore an alternative to VER-032's first acceptance line,
      not an addition to it.
      2026-08-20, four findings from reading our own code before costing this,
      because most of the expected objections are not real:
      (1) Nothing chose the Releases API. There is no decision anywhere; verctl
      needs a Release for notes and asset upload, `releases.create(tag)` makes
      the ref as a side effect, and no tag step was ever written. The tag is a
      byproduct, which is exactly why nothing checks where it lands.
      (2) verctl already pushes with git, every release.
      `git::commit_branch_and_push` (src/git.rs:376) writes the Version PR
      commit and pushes it through git2. This is not a new capability.
      (3) No grant changes. That push authenticates with
      `Cred::userpass_plaintext("x-access-token", token)` against an anonymous
      HTTPS remote verctl builds itself, so it needs neither `actions/checkout`
      persist-credentials nor `http.extraheader`, and `contents: write` already
      covers both creating a Release and pushing a ref. Same token, same scope,
      a path already exercised.
      (4) **libgit2 cannot do `--atomic`, and this is the real decision.**
      `git_push_options` carries pb_parallelism, callbacks, proxy_opts,
      follow_redirects, custom_headers and remote_push_options — no atomic
      flag, and the string does not occur in libgit2-sys at all
      (git2 0.21.0). GitHub does advertise it — read live from
      `/info/refs?service=git-receive-pack`: `report-status report-status-v2
      delete-refs side-band-64k ofs-delta atomic object-format=sha1 quiet
      push-options`. So the capability is there to use and only the client
      cannot send it.
      2026-08-20, the option space, because two of these were nearly taken on a
      wrong premise. Shelling out to a `git` binary and accepting a
      non-atomic multi-refspec push are both ruled out by the operator.
      Gitoxide's high-level push does not exist and is **not planned** —
      GitoxideLabs/gitoxide#306 was closed `not_planned` on 2026-07-22 with
      `ReceivePack` for V1 and V2 never ticked, and #2434 (signed pushes) the
      same day. REST `POST /git/refs` and GraphQL `createRef` are one ref per
      call with no transaction, and libgit2's `git_transaction` is local refs
      only. Supporting only single-tag templates would abandon the case VER-039
      exists for. That leaves two.
      **Fork libgit2.** Six edits mirroring how `push-options` was added:
      `GIT_CAP_ATOMIC` in smart.h, a fifteenth bit in `transport_smart_caps`
      (fourteen today), a bool beside `report_status` in push.h, two blocks in
      `gen_pktline` at lines 811 and 840, caps parsing, and a git2-rs
      `PushOptions::atomic`. Cheap to write. Expensive to own: verctl is
      published on crates.io, which forbids git dependencies, and `[patch]` is
      honoured only in a top-level workspace, so `cargo install verctl` would
      need republished `vsh-libgit2-sys` and `vsh-git2` — whole libgit2 plus
      vendored PCRE2 — rebased on every upstream release. There is no smaller
      surface: git2's features are link and vendoring switches, and
      libgit2-sys/build.rs compiles the entire C tree regardless.
      **Assemble gitoxide's lower crates.** What #306 abandoned is high-level
      push — negotiation, delta generation, ref orchestration. The transport is
      published and maintained: `gix-transport` 0.57.1 already has
      `Service::ReceivePack => "git-receive-pack"`, a blocking HTTP
      smart-protocol client with curl and reqwest backends, `request.rs`,
      side-band reading in `bufread_ext.rs`, and `gix-credentials`, all
      feature-gated. With `gix-packetline` for framing, verctl writes the
      command list and the capability word and nothing else. Our case is
      degenerate — tags at a known SHA whose commit is already on the remote —
      so the abandoned half barely applies. Cost: both libgit2 and gitoxide in
      the tree, and gitoxide bumps semver often across ~40 crates.
      **Upstreaming is not a plan, measured rather than assumed.** The exact
      precedent is adding a push capability to libgit2, done once and attempted
      twice: #6439 opened 2022-12-01 and merged 2024-02-07, **433 days**; #6281
      opened 2022-04-20 and closed **unmerged** 2024-03-09, dead after 689 days.
      Two other capability PRs took 279 and 234 days. libgit2's 3.1-day median
      merge is maintainer housekeeping; 84 of its 106 open PRs are over a year
      old. Compare gitoxide: 171 PRs merged in 90 days, 0.5-day median, 15 open,
      **none older than a year**. So a fork would be a fork indefinitely, and
      "upstream first, fall back to forking" is a year-long lottery.
      Two smaller things to settle with it. An annotated tag needs a tagger, and
      `signature()` (src/git.rs:472) resolves one from repo config, then
      GIT_AUTHOR_NAME/GITHUB_ACTOR, then `verctl` — on a runner that inherits
      whatever git config is there, so it wants pinning rather than inheriting.
      And the failure window moves: today one call leaves tag-and-Release or
      neither, git-side leaves a tag with no Release, which is the better half
      to be left holding because a Release is recreatable and a tag is not.
      Whatever is chosen must be declared and defaulted rather than wired in,
      and tested at the same depth as VER-039 asks: the three guard rules each
      proven to refuse, the re-read proven to catch a tag that resolves
      elsewhere, and a retry over a half-created set proven to complete it.
      The other half is the Release body: per-package Releases each want only
      their own package's changelog section, which `release::notes_for` already
      extracts and currently concatenates. Cheap once VER-039 exists, so it
      waits on that rather than on this.

  - id: VER-019
    title: Triage the review backlog from the closed PRs
    scope: verctl
    kind: evaluation
    outcome: >-
      Every review finding on already-merged code is either a named
      defect with a fix, or written off with the reason.
    open: >-
      2026-08-18: nine findings were raised on PRs #4, #6, #9, #12, #13,
      #14 and never triaged, because those PRs were closed with the
      comments unread. Listed so they stop being invisible; none is
      confirmed except where noted. Security-shaped first.
      (1) #12: CARGO_REGISTRY_TOKEN is exported into the same step that
      compiles this repo's source, so a build script sees the crates.io
      token. Same trust boundary as publishing at all, but publishing
      from the released binary instead of a fresh build would remove it —
      see VER-016, which wants that step off the compiler anyway.
      (2) #12: `${{ matrix.id }}` and `${{ needs.crate.outputs.tag }}`
      are interpolated straight into `run:` bodies. The values come from
      verctl.toml on the default branch, not from a fork, so this needs
      write access to exploit; passing them through `env:` costs nothing.
      (3) #9: the version guard runs on a shallow checkout in some lanes,
      where `check --versions` cannot reach the merge base.
      (4) #6: `consume_fragments` runs only in the `--pr` branch, so a
      local `prepare` leaves the fragments it already applied.
      (5) #6: publish forces `--access public` for bun packages.
      (6) #6: no npm auth is set up for the bun publisher.
      (7) #6: `tag_for` falls back to the first package's version, which
      is wrong for a repo whose packages version independently.
      (8) #4: HEAD is not restored after the Version PR branch write, and
      `add_all(["*"])` stages more than the plan named.
      (9) #14: `recurse_untracked_dirs(true)` walks into large ignored
      trees. Retired 2026-08-18: #13's invalid `runner` context in a
      workflow-level `env` is gone — no workflow or example uses the
      `runner` context, and actionlint 1.7.12 passes every file.

  - id: VER-016
    title: The plan job should not install a compiler to read the declarations
    scope: verctl
    kind: evaluation
    outcome: >-
      The ci.yml bootstrap costs what reading .ctl/ver.yaml costs, and
      verify stops waiting on a toolchain it does not share.
    open: >-
      Measured on run 32078158505: plan took 33s, of which 21s was mise
      plus rust-cache, and verify did not start until 37s in. It needs
      verctl and .ctl/ver.yaml, not cargo. The tarball is the fix and it
      is gated, not undecided: `git show v0.0.2:src/ci.rs` does not
      resolve, so the published binary has no `ci` verb and
      MISE_ENV=release cannot plan until a release carries VER-015.
      Flip the plan job then and delete its toolchain steps. Rejected
      meanwhile: a stable-rust plan job, which trades a second
      toolchain and a cold cache for ~13s; and one rust-cache key
      across plan and verify, since rust-cache saves only when the key
      is absent, so plan's dev-binary target dir would land first and
      leave verify a thinner cache than its own. Efficiency only — the
      runner contract itself is settled (VER-015).

  - id: VER-013
    title: Stock lockfile refresh after cargo bumps
    scope: verctl
    kind: evaluation
    outcome: >-
      After a cargo version write, Cargo.lock is regenerated so
      publish --locked does not fail.
    open: >-
      Decide whether this is default after for the cargo driver or a
      [prepare].after the repo opts into. 2026-08-18: qctl 0.0.2 failed
      on exactly this and is evidence for the default. The cargo driver
      already names `cargo generate-lockfile`, but `apply_plan` returns
      it as a follow-up that only prints in the `next` column, so every
      cargo consumer has to restate it as `[prepare].after` plus a
      `Cargo.lock` stage glob — and a repo that does not know to is one
      Version PR away from a dirty-tree `cargo package --locked`.
      Running the driver's own after is the fix; the opt-in escape is
      then a `[prepare]` that overrides it. The command itself is settled
      and no longer part of the question: measured on a scratch copy with
      the manifest bumped to 0.0.9, `cargo generate-lockfile` printed
      `Locking 138 packages` and `Adding serde_yml v0.0.12` for a 3-line
      diff, while `cargo update --workspace` printed `Locking 1 package`
      for a 1-line diff. The driver, this repo, qctl, and ctl-core all
      name the narrow one now.

