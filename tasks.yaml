# yaml-language-server: $schema=https://github.com/victor-software-house/qctl/releases/download/v0.1.2/tasks.schema.json
schema_version: 3
prefix: VER

style:
  timezone: "-03:00"
  section_order: [queue, horizon, archive]
active: VER-011

queue:
  - id: VER-011
    title: Finish the Changesets-shaped release loop
    scope: verctl
    outcome: >-
      Fragment in, Version PR, exact-SHA publish, per-package CHANGELOG,
      lockfile, already-published, optional natives. No hand-edited
      versions.
    blocked_by: []
    acceptance:
      - prepare writes versions + per-package CHANGELOG and consumes fragments.
      - Version PR is the only version-authority path (CI / --pr).
      - "`[prepare].after` plus stage globs; unexpected dirty files fail."
      - publish is overridable recipes; cargo and bun are stock examples.
      - Lockfile is committed; cargo publish --locked works after bump.
      - Pretty is ctl-core ColorMode tables; tests use --color never.
      - Native assets only when [assets] is set; PR CI stays one runner.
      - Asset jobs are named by target id; cargo/bun inherit stdio.
    notes: >-
      Original product goal. Do not name the private release-skill in
      repo docs. Rust and bun are stock examples, not the architecture.
      Adopt ctl-core fixture trees (CTC-006) instead of more fs::write
      + indoc copies. 2026-08-17: status/check/prepare are ColorMode
      tables; publish proves changelog headings + default-branch
      history (no commit-subject sniff); GitHub notes come from each
      package CHANGELOG. Hand-edit guard shipped as VER-012 / PR #9.
      Still open for archive: lockfile-after-bump (VER-013).

  - id: VER-015
    title: Asset runners are configuration, not a hardcoded map
    scope: verctl
    outcome: >-
      Each [assets] target names the runner that builds it. The plan
      emits what the repo declared, so a public repo stays on free
      hosted minutes and a private one can point at its own labels.
    blocked_by: []
    acceptance:
      - A machine is declared once as [runners.NAME] with labels; [ci.NAME] names several, [assets.NAME] exactly one.
      - verctl ci and verctl assets print what resolved and the matrix carries it.
      - A public repo needs no config to keep macos-latest / ubuntu-latest, and no [ci] to keep one verify job.
      - A declared self-hosted or nscloud label set reaches runs-on unchanged, in order.
      - An undeclared machine name fails listing the declared ones; a label is never accepted as a name.
      - Tests cover default, override, multi-label, fan-out naming, empty list, and a partial undeclared target.
    notes: >-
      2026-08-17: found while adopting the lane in qctl (qctl#3). Two
      claims first written here were wrong and are corrected: a per-target
      `runner` override already existed, and a job can be told its runner
      by an earlier job. The real defects are that `runner` is one string
      where GitHub takes a label set, that CI has no configuration surface
      at all, and that an unknown id with a partial record is accepted and
      reaches `cargo build --target ""`. Shape settled after several wrong
      turns, recorded so they are not retried: anonymous list rows needing
      an `id` field (`[[ci.jobs]]`, `runners = [{ labels = [...] }]`) were
      rejected as ceremony — names are table headers instead; a `runners`
      list on an asset target was rejected because two machines would
      overwrite one tarball, which the shape now makes unsayable; and one
      identical shape per phase was abandoned once it put `os`/`arch` on a
      job while its labels sat a level below. A name→labels registry is
      deliberately not the alias table rejected earlier: an alias made an
      invented word look like a resolved label, whereas a machine name
      resolves against `[runners]` or fails and never reaches GitHub.
      M1 (generating ci.yml) and M3 (a repo variable) were considered
      and rejected for M2, the plan-job bootstrap the publish lane already
      uses; M3 would move the value out of verctl.toml entirely.
      Asked why `plan` is not configurable, the inventory settled the law:
      verctl decides how many jobs there are, the workflow file decides
      where a fixed job runs. Unary jobs (`plan`, `crate`, `pin`,
      `prepare`) all have literal machines; only `verify` and `assets`,
      whose count the repo decides, read config. A static YAML file cannot
      declare N jobs without knowing N — that fan-out is what config buys,
      and the machine rides along on it. So `[release]` is dropped, not
      deferred: publish and pin are inherently unary, nothing decides their
      count, and a self-hosted-only repo is already served by editing three
      literals in workflows it owns. `verctl check --ci` was rejected with
      it — verifying those literals needs a YAML dependency this crate does
      not have, to check a value the law puts there on purpose.

  - id: VER-020
    title: check validates served files, and one file has one owner
    scope: verctl
    outcome: >-
      A served file edited by hand, or claimed by both a template and a
      pin, fails on the PR that does it instead of at release time.
    blocked_by: []
    acceptance:
      - "`check` runs the same validation prepare does: every pattern still matches at its declared arity."
      - "`check` compares every served file to what its template renders at the versions on HEAD."
      - A file that a template renders and a [[pins]] entry also names fails before anything is written.
      - The failure names the file and which two declarations claim it.
    notes: >-
      2026-08-18: docs/served-files.md §6 describes check as designed, not
      implemented — only prepare and its dry run validate today, so drift
      introduced by hand survives until a release. The double-owner gap is
      real and silent: prepare_report rewrites pins first and renders
      templates second, so a template would clobber the rewrite without
      saying so.

  - id: VER-021
    title: Every config file we own has a JSON Schema, at a URL an IDE can fetch
    scope: verctl
    outcome: >-
      Editing a repo's declarations, tasks.yaml, or a changeset fragment in an
      IDE completes the keys and marks a wrong one, in every ctl repo, with
      no editor-local setup.
    blocked_by: []
    acceptance:
      - The schemas are generated from the Rust types, so a key that exists in code exists in the schema and no other.
      - "Every declaration file a repo writes carries `# yaml-language-server: $schema=<url>`, and so do tasks.yaml and changeset fragments."
      - The URL is versioned, and a repo's own schema line is kept current by a [patterns] pin, not by hand.
      - "A generated schema that drifts from the types fails a check, the same way a served file does."
      - qctl and ctl-core carry the same lines for the same files.
    notes: >-
      2026-08-18, decided with Victor: free and already versioned wins over
      a prettier host, so this follows the pattern that already exists
      rather than inventing one. Evidence: qctl ships schema/tasks.schema.json
      as a release asset, ctl-core's tasks.yaml already points $schema at
      `releases/download/v0.0.1/tasks.schema.json`, and qctl's own ledger
      already decided the URL is a pinned tag and never /latest — a schema
      that changes under an unchanged file is worse than an old one. What is
      missing is the rest: verctl.toml and changeset fragments have no
      schema at all, qctl's is hand-written JSON rather than generated from
      the types, and every pinned URL is bumped by hand. The staleness
      objection is what VER-018 just answered: a schema URL is a version
      site like any other, so it becomes a [patterns] entry and prepare
      keeps it current on the Version PR. mise ships its own schema and we
      only reference it; template declarations are not a file an editor
      validates by URL.
      2026-08-18, blocker found by running it: every qctl mutation deletes
      the schema line it is supposed to protect. `qctl start` on a copy of
      this file rewrote it through serde_yaml and dropped every comment,
      line 1 included, so `# yaml-language-server: $schema=…` survives only
      until the next `q start` or `q archive`. tasks.yaml cannot carry a
      schema pointer until qctl writes comments back. The same applies to
      every comment here: none of them survive a verb, which is why an
      archived blocker is recorded in notes rather than beside the key.

  - id: VER-022
    title: Move the reusable schema layer into ctl-core
    scope: verctl
    outcome: >-
      Every ctl CLI parses and validates declared input the same way,
      from one implementation, instead of three that drift.
    blocked_by: []
    acceptance:
      - "The shared validators (`inside_the_repo`, `one_file_name`, `at_least_one`, `cannot_be_empty`) live in ctl-core and verctl uses them from there."
      - "Config loading — read, parse with serde, validate once with garde against the whole document — is one ctl-core entry point."
      - "The template renderer's declare-your-own-target mechanism is available to any ctl CLI, not just verctl."
      - No verctl-specific vocabulary leaks into ctl-core, and no copy of the layer is left behind here.
    notes: >-
      2026-08-18: src/schema.rs is already shared between verctl's TOML
      config and its Jinja template declarations, which is the proof it is
      not verctl-shaped. ctl-core carries the matching row, CTC-008,
      merged 2026-08-18 as ctl-core#7, so the destination is agreed
      before anything moves.

  - id: VER-028
    title: Decide who owns a template in the shared .ctl/templates
    scope: verctl
    outcome: Two ctl CLIs can both render served files from one repo without either rendering the other's templates.
    blocked_by: []
    acceptance:
      - The rule is decided and written where the loader enforces it, not in a PR comment.
      - A template belonging to another ctl CLI is either skipped or never in verctl's source tree, and a test proves which.
      - docs/served-files.md §1 says the rule, and VER-025's shared-not-namespaced line is either upheld or superseded in writing.
    notes: >-
      2026-08-19, raised on PR #44 and deliberately not acted on there.
      `templates.source` defaults to `.ctl/templates`, verctl renders every
      tracked `*.jinja` under it, and `.ctl/` is shared — so once a second ctl
      CLI serves files, verctl would render its templates too: an unknown name
      fails the whole Version PR, and one that only reads `versions[…]` gets
      written to the other tool's target. Nothing collides today, because no
      other ctl CLI renders anything, which is why this is a row and not a fix.
      Scoping the directory to `.ctl/templates/ver/` is the obvious answer and
      is exactly what VER-025 ruled out ("shared rather than namespaced,
      because a template already declares its own target"), so it is Victor's
      to reverse, not this row's to assume. The other shape is a template
      declaring its owning tool, which keeps the directory shared and pays for
      it with one more export.

  - id: VER-029
    title: The Version PR exemption must not race its own label
    scope: verctl
    outcome: The Version PR's own CI passes the hand-edit guard on the first run, without anyone reopening it.
    blocked_by: []
    acceptance:
      - A freshly opened Version PR is exempt on its first CI run, proven on a real release rather than by reading the code.
      - The exemption still refuses a hand edit on an ordinary PR, and GITHUB_HEAD_REF is still not an exemption.
      - Whatever carries the signal is written down where the guard reads it, so the next reader does not rediscover the race.
    notes: >-
      2026-08-20, hit on the v0.1.1 release and measured, not inferred. The
      Version PR's own CI failed `check --versions` with "verctl 0.1.0 ->
      0.1.1", the exact hand edit the guard exists to catch, on the commit
      `prepare` had just written. `github::event_labels` reads
      `pull_request.labels` out of `GITHUB_EVENT_PATH`, and that payload is a
      snapshot taken when the event fired — but `prepare --pr` opens the PR and
      then applies `verctl:version` in a second call, so the `opened` payload
      carries an empty label list. Proof: closing and reopening PR #48 fired a
      fresh event and the same job printed `exempt · version-pr`, with nothing
      else changed. The PR carried the label the whole time.
      Not a new break — v0.1.0's Version PR passed, which is what a race looks
      like. Do not "fix" it by trusting the branch name: `GITHUB_HEAD_REF` is
      deliberately not an exemption (VER-012), because a contributor can name a
      branch anything. Candidates worth weighing rather than one assumed here:
      have `prepare --pr` create the PR with the label already on it if the API
      allows, add `labeled` to the workflow's `pull_request` types so the label
      itself triggers a run, or have the guard ask the API for the PR's current
      labels instead of reading a stale payload.

  - id: VER-030
    title: The example catalog teaches one pin, not two
    scope: verctl
    outcome: A repo copying examples/mise.toml wires the ?ref= tag and nothing else, so no second version site can disagree with the served task.
    blocked_by: []
    acceptance:
      - examples/mise.toml declares no [tools] entry for verctl; the ?ref= include is the whole pin.
      - mise install --locked still works for a consumer that copies it, with no lockfile row for a tool it no longer names.
      - The template that renders it says why one pin is the rule, so the next reader does not add the second back.
    notes: >-
      2026-08-20, noticed while proving VER-027 at the tag: a clean directory
      holding only `git show v0.1.1:examples/mise.toml` installs and runs
      `mise run ver` — but it cannot prove the task's own pin won, because the
      example's `[tools]` entry names the same version. qctl already settled
      this as a rule and wrote it into its AGENTS.md: a consumer wires one pin,
      the `?ref=` tag, because the served task carries its own `#MISE tools`
      version and wins on PATH, so a `[tools]` entry can only disagree with it —
      and it needs a lockfile row to survive `mise install --locked`, which is
      the failure ctl-core#9 hit. qctl queued the same removal for its own
      example as QCTL-018. This repo's example still teaches two, and it is the
      example everyone copies, so it teaches the wrong thing twice over.
      Removing it also makes the pin provable: with no surrounding entry, a
      consumer that runs the task is running what the task named.

  - id: VER-031
    title: A pattern that cannot rewrite a whole version refuses it
    scope: verctl
    outcome: The rule docs/served-files.md states — a prerelease or floating pin fails the release rather than having its numeric head rewritten — is true of the code, not only of the document.
    blocked_by: []
    acceptance:
      - A pattern whose match is immediately followed by more version-ish text fails the release naming the file and the pattern, instead of rewriting the head and leaving the tail.
      - A test writes a real prerelease into a pinned file and asserts the release stops and the file is untouched.
      - If the engine cannot refuse, docs/served-files.md stops promising it, and says what a pattern author must anchor instead.
    notes: >-
      2026-08-20, found in review of verctl#50 and measured rather than
      reasoned about. docs/served-files.md §4 says a version is dotted numerics
      and nothing else, and that "a prerelease or a floating pin is not a
      version this rewrites: it fails the release rather than rewriting a
      numeric head and dropping the tail". It does not. With an unanchored
      `match: "version: {version}"` and a file reading `version: 0.1.1-rc1`,
      prepare exited 0 and wrote `version: 0.1.2-rc1` — the head moved, the
      tail stayed, and the release carried on. Kody raised it, our own document
      contradicted it, and the run settled it: the implementation is the
      evidence and the document is currently a promise nobody keeps.
      The condition is exact, and narrower than first written here. A pattern
      whose `match` ends in literal text already refuses: the test
      `a_prerelease_pin_fails_instead_of_half_rewriting` uses
      `"verctl@{version} today"`, and against `verctl@1.0.0-rc.1 today` the
      digits match but ` today` does not follow, so it fails at arity. Only a
      match that ends *at* the placeholder has no right-hand boundary, and that
      is the case that rewrites the head.
      The author-side answer shipped in #50 as `whole_line: true`, after the
      first attempt — spelling the closing `---` into the match — was rejected
      by Victor as a hack: it only worked because `version:` happened to be the
      last frontmatter key, so adding a key after it would have broken the
      release. A line-owning pattern supplies the boundary from the line, which
      is unambiguous.
      What is left is an inline pattern ending at the placeholder. Do not
      "fix" it by refusing when the next character continues the version: the
      discriminator is not local. `download/v{version}` against
      `download/v1.2.3-linux-x64.tar.gz` has `-` right after the match and is
      completely correct — the version is 1.2.3 and the rest is the filename.
      Refusing there would stop real releases, which is why this is a row and
      not a one-line guard. Either the engine grows a boundary an author can
      state (as `whole_line` does), or docs/served-files.md stops promising
      unconditionally and says which shapes are safe.

  - id: VER-032
    title: A release tags the commit it published
    scope: verctl
    outcome: The tag a release creates resolves to the commit that was built and published, not to whatever the default branch points at when the API call runs.
    blocked_by: []
    acceptance:
      - ensure_release sets target_commitish to the published SHA.
      - publish re-reads the tag after creating it and fails when it does not resolve to that SHA.
      - An ensure_release that finds the release already there re-reads the tag too, and fails when it names another commit.
      - A test proves a tag created while the default branch has moved still names the release commit.
    notes: >-
      2026-08-20: found while checking the pi-stuff adoption report, which
      asked only that a pushed tag be verified. It is worse than that.
      `github::ensure_release` calls `releases.create(tag)` and never sets
      `target_commitish`, so GitHub tags the default branch's HEAD at the
      moment of the call — not the commit that was built and published. v0.1.3
      is right only because main did not move: `git rev-parse v0.1.3^{}` and
      `git rev-parse origin/main` are both 2fd33a6c5713. Anything merging to
      main during the publish job puts the tag on a tree that was never built,
      which is the served-files contract's one premise (docs/served-files.md:3
      — "its version must be correct in the tree the tag names"). Nothing else
      creates the tag: no `git tag` or `refs/tags` anywhere in src/, no tag
      step in .github/workflows/publish.yml, and `git cat-file -t v0.1.3` says
      `commit` — a lightweight tag, which is what the Releases API makes. The
      retry path needs the same treatment for a different reason:
      `ensure_release` returns early when `get_by_tag` succeeds
      (src/github.rs:249-250) without looking at where that tag points, and
      `target_commitish` cannot correct a tag that already exists.

  - id: VER-033
    title: Publish follows the dependency graph, not the declaration order
    scope: verctl
    outcome: A workspace whose packages depend on each other publishes every dependency before its consumers, and says which order it resolved.
    blocked_by: []
    acceptance:
      - Order comes from the manifests verctl already parses, or from a declared list.
      - The resolved order is printed, the way ci and assets print what they resolved.
      - A cycle fails the run naming the packages in it.
      - A single-package repo sees no change.
    notes: >-
      pi-stuff adoption report, ask 2. `publish::plan` iterates
      `config.packages` in declaration order (src/publish.rs), so a consumer
      published before its dependency leaves a window where its pinned version
      does not resolve. They get the order from `turbo run publish:package`
      today. Their request, verbatim: if it is inferred, print it — "a silent
      topological sort is a thing nobody debugs until it is wrong".

  - id: VER-034
    title: Publish declares its own before and after, the way prepare does
    scope: verctl
    outcome: A repo can gate a publish on its own artifact check and smoke the registry afterwards, without verctl knowing anything about tarballs or registries.
    blocked_by: []
    acceptance:
      - publish.before argv runs after versions are on HEAD and before the first publisher argv; non-zero stops the run.
      - publish.after argv runs once, after every package published.
      - 'Both receive the resolved package set: name, version, manifest path, publisher.'
      - Neither key set is the same run as today.
    notes: >-
      pi-stuff adoption report, asks 3 and 4, filed as one row because it is
      one hook pair. They keep 247 lines they are not asking us to absorb: a
      packed-artifact gate that proves the tarball rewrote every `workspace:`
      and `catalog:` dep into a concrete version, and a post-publish smoke that
      installs the published version from the registry and imports every
      export. Both are stack-specific and should stay theirs. What they cannot
      do is wire them, because `Prepare` has `after` (src/config.rs:519) and
      publish has no equivalent. Closing that asymmetry is the whole ask.

  - id: VER-035
    title: The commit a release publishes from is proved, and a waiver is said out loud
    scope: verctl
    outcome: A release refuses a commit whose shape says it is not the one the version tool generated, and an operator who overrides that leaves a line in the log saying so.
    blocked_by: []
    acceptance:
      - The release SHA is an ancestor of the default branch.
      - Workflow files at the release SHA do not differ from the default branch.
      - The first-parent branch carries exactly one version commit; two always refuse.
      - Each check has a named waiver, and a waived run prints which one was waived.
    notes: >-
      pi-stuff adoption report, ask 5. `prove_version_commit`
      (src/publish.rs:136) is `require_changelog_versions` plus
      `require_on_default_history` — they keep both and want three more. The
      workflow-drift one is the non-obvious one and it cost them a release:
      retrying an old release SHA runs the workflow *at that SHA*, so if
      permissions changed since, the run can publish to the registry and then
      fail to tag — the registry is not revertible and the tags are the audit
      trail. Their waivers are workflow_dispatch booleans and the run prints
      `waived: …`. Their warning about building it: bind a dispatch input to a
      step-level `env:` and quote it, never interpolate `${{ inputs.x }}` into
      a `run:` string — inputs arrive as strings over REST and are not coerced
      to booleans, in a job holding contents/packages/id-token write.

  - id: VER-036
    title: A check that cannot run says so instead of passing
    scope: verctl
    outcome: No verctl guard reports success by having skipped itself.
    blocked_by: []
    acceptance:
      - expand fails on an unresolved {placeholder} instead of dropping the argument.
      - prove_default_history prints which condition made it skip.
      - One test per site proves the silence is gone.
    notes: >-
      Two sites the pi-stuff report raised separately; they are one law, so
      they are one row. `publisher::expand` filters out any part containing
      `{` (src/publisher.rs:151), so a typo'd `{registr}` in a custom argv
      shortens the command line instead of failing, and the error surfaces
      downstream wearing someone else's name. `prove_default_history` returns
      `Ok(())` on four conditions — no repo, no head, unpeelable head, no
      upstream (src/git.rs:95-104) — each defensible alone, but together the
      check can pass by not running, in exactly the CI shapes where it matters
      most. Its doc comment already calls two of them skips; the run does not.

  - id: VER-037
    title: The README answers the questions a first publish asks
    scope: verctl
    outcome: A repo publishing through verctl for the first time finds the four answers that currently cost an afternoon each.
    blocked_by: []
    acceptance:
      - What --access does when a registry resolves, and whether a restricted package can be published as public by accident.
      - What GITHUB_TOKEN means locally, where a gh session is not it.
      - 'That permission_denied: write_package is a package-settings problem, not a token problem.'
      - That the tool finalizing a release is the one the workflow pins, not the one at the release commit.
    notes: >-
      pi-stuff adoption report, §3.8 and §3.9, folded into one row because
      every item is a paragraph the README does not have. The finalizer one is
      theirs and they call it ugly: their publish job checks out the release
      commit, so the code that tags and releases *afterwards* also comes from
      that checkout, and a fix to the tagging logic that landed since is not
      present on a retry. They restore four files from origin/main between
      publish and tag to work around it. verctl mostly dodges this by being one
      pinned binary — but only if the version resolves from the workflow's
      config rather than the release commit's, which is the sentence to write.

  - id: VER-039
    title: A release declares what its tags are named
    scope: verctl
    outcome: A repo says the shape of its release tags in one line with a sane default, and a release that cannot name what it shipped refuses instead of guessing.
    blocked_by: []
    acceptance:
      - tags.template defaults to v{version}, so every repo that writes nothing keeps today's behaviour.
      - The placeholders are {version} and {name}, the vocabulary patterns.match already uses.
      - A template with no {name} names one tag; one with {name} names a tag and a Release per released package.
      - A template with no {name} refuses a release with more than one distinct version, naming the packages and their versions.
      - Each tag and Release is idempotent, so a retry finishes a set that stopped part way.
    notes: >-
      The shape, so the live defect is not waiting on discovery. pi-stuff's
      strawman is a `tags.template` plus a `releases: per-package | aggregate`
      enum; the enum is redundant, because **the arity falls out of the
      template**. A template with no `{name}` can only name one tag; one with
      `{name}` can only mean one per package. Two fields that cannot disagree
      should be one field, and the one that survives is the one a reader can
      look at and know what they get. So: one optional line, defaulting to
      `v{version}`, in the placeholder vocabulary `patterns.match` already
      uses — a single-package repo writes nothing and a monorepo writes
      `template: "{name}@{version}"`.
      .
      What this kills: `tag_for` (src/publish.rs:158) dedups the versions and,
      when more than one survives, tags with the *first declared* package's
      version — a value with no relationship to the release, chosen silently.
      With a template there is always an answer: either the shape names every
      package, or it cannot name this release and says so.
      .
      Deliberately not here, because it is where the design risk actually is:
      splitting the changelog so each Release carries only its own package's
      section, and creating a tag set all-or-nothing. Atomicity is not reachable
      through the Releases API — pi-stuff gets it from `git push --atomic` on
      locally created tags, which is a different tagging path, so it stays with
      VER-038. Idempotent retry is the weaker property that is reachable now and
      is what the acceptance asks for. VER-032 is orthogonal: it fixes which
      commit a tag names, whatever the tag is called.

horizon:
  - id: VER-038
    title: A tag set is created whole or not at all
    scope: verctl
    kind: evaluation
    outcome: >-
      A release that names several tags leaves either all of them or none,
      and a rerun from the same commit is a no-op rather than a repair.
    open: >-
      Whether verctl keeps creating tags through the Releases API at all.
      VER-039 settles the shape and gets idempotent retry, which is the most
      the API affords: `releases.create` is one call per tag, so a set is
      always created one at a time and a run that dies half way leaves a
      partial set behind. pi-stuff refuses a partial set precisely because the
      retry path then has to reason about it, and they get atomicity from
      `git push --atomic` over locally created tags — a different tagging path
      than the one verctl has, which is the decision this row holds. Their
      re-read after pushing is the same law as VER-032 and worth taking either
      way: a successful push is a claim, not a fact. The other half is the
      Release body: per-package Releases each want only their own package's
      changelog section, which `release::notes_for` already extracts and
      currently concatenates. Cheap once the shape exists, so it waits on
      VER-039 rather than on this.

  - id: VER-019
    title: Triage the review backlog from the closed PRs
    scope: verctl
    kind: evaluation
    outcome: >-
      Every review finding on already-merged code is either a named
      defect with a fix, or written off with the reason.
    open: >-
      2026-08-18: nine findings were raised on PRs #4, #6, #9, #12, #13,
      #14 and never triaged, because those PRs were closed with the
      comments unread. Listed so they stop being invisible; none is
      confirmed except where noted. Security-shaped first.
      (1) #12: CARGO_REGISTRY_TOKEN is exported into the same step that
      compiles this repo's source, so a build script sees the crates.io
      token. Same trust boundary as publishing at all, but publishing
      from the released binary instead of a fresh build would remove it —
      see VER-016, which wants that step off the compiler anyway.
      (2) #12: `${{ matrix.id }}` and `${{ needs.crate.outputs.tag }}`
      are interpolated straight into `run:` bodies. The values come from
      verctl.toml on the default branch, not from a fork, so this needs
      write access to exploit; passing them through `env:` costs nothing.
      (3) #9: the version guard runs on a shallow checkout in some lanes,
      where `check --versions` cannot reach the merge base.
      (4) #6: `consume_fragments` runs only in the `--pr` branch, so a
      local `prepare` leaves the fragments it already applied.
      (5) #6: publish forces `--access public` for bun packages.
      (6) #6: no npm auth is set up for the bun publisher.
      (7) #6: `tag_for` falls back to the first package's version, which
      is wrong for a repo whose packages version independently.
      (8) #4: HEAD is not restored after the Version PR branch write, and
      `add_all(["*"])` stages more than the plan named.
      (9) #14: `recurse_untracked_dirs(true)` walks into large ignored
      trees. Retired 2026-08-18: #13's invalid `runner` context in a
      workflow-level `env` is gone — no workflow or example uses the
      `runner` context, and actionlint 1.7.12 passes every file.

  - id: VER-016
    title: The plan job should not install a compiler to read the declarations
    scope: verctl
    kind: evaluation
    outcome: >-
      The ci.yml bootstrap costs what reading .ctl/ver.yaml costs, and
      verify stops waiting on a toolchain it does not share.
    open: >-
      Measured on run 32078158505: plan took 33s, of which 21s was mise
      plus rust-cache, and verify did not start until 37s in. It needs
      verctl and .ctl/ver.yaml, not cargo. The tarball is the fix and it
      is gated, not undecided: `git show v0.0.2:src/ci.rs` does not
      resolve, so the published binary has no `ci` verb and
      MISE_ENV=release cannot plan until a release carries VER-015.
      Flip the plan job then and delete its toolchain steps. Rejected
      meanwhile: a stable-rust plan job, which trades a second
      toolchain and a cold cache for ~13s; and one rust-cache key
      across plan and verify, since rust-cache saves only when the key
      is absent, so plan's dev-binary target dir would land first and
      leave verify a thinner cache than its own. Efficiency only — the
      runner contract itself is settled (VER-015).

  - id: VER-013
    title: Stock lockfile refresh after cargo bumps
    scope: verctl
    kind: evaluation
    outcome: >-
      After a cargo version write, Cargo.lock is regenerated so
      publish --locked does not fail.
    open: >-
      Decide whether this is default after for the cargo driver or a
      [prepare].after the repo opts into. 2026-08-18: qctl 0.0.2 failed
      on exactly this and is evidence for the default. The cargo driver
      already names `cargo generate-lockfile`, but `apply_plan` returns
      it as a follow-up that only prints in the `next` column, so every
      cargo consumer has to restate it as `[prepare].after` plus a
      `Cargo.lock` stage glob — and a repo that does not know to is one
      Version PR away from a dirty-tree `cargo package --locked`.
      Running the driver's own after is the fix; the opt-in escape is
      then a `[prepare]` that overrides it. The command itself is settled
      and no longer part of the question: measured on a scratch copy with
      the manifest bumped to 0.0.9, `cargo generate-lockfile` printed
      `Locking 138 packages` and `Adding serde_yml v0.0.12` for a 3-line
      diff, while `cargo update --workspace` printed `Locking 1 package`
      for a 1-line diff. The driver, this repo, qctl, and ctl-core all
      name the narrow one now.

