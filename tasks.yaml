    disposition: completed

  - id: VER-026
    title: An untracked template in the source tree stops the release
    scope: verctl
    outcome: >-
      A template a repo committed to nothing renders nothing and says so.
      Adding a served file and getting silence is not a state a release
      passes through.
    notes: >-
      2026-08-19, found in qctl while adopting served files: `prepare
      --dry-run` listed the one `[[pins]]` file and neither of the two
      templates, with no diagnostic, because they were written but not yet
      staged. Diagnosed by reading `templates::sources`, which filters
      `git::tracked` — and the current test pins that silence as intended,
      asserting an empty plan and an unchanged served file.
      Refusing to render is right: `prepare` auto-stages rendered outputs, so
      a template git does not carry would put a served file on the tag whose
      source is not in the tree, and `check` would have nothing to compare on
      a fresh clone. What is wrong is what happens next — the release
      continues and serves the stale hand-authored file, which is the exact
      failure served files exist to end. It fails open, once per repo, at the
      moment somebody is learning the feature.
    completed: 2026-08-20T10:38:13
    evidence:
      - 'verctl#47 merged 8389b46, released v0.1.1. A template in the source tree the repo neither tracks nor ignores fails the run naming the file; proven live on this repo with a fragment present: exit 1, and the target file was not created.'
      - 'Both halves mutation-proved rather than assumed green: dropping the refusal fails an_untracked_template_stops_the_run_and_one_outside_is_ignored, and checking unconditionally fails a_tree_with_no_repository_has_no_templates. That second test previously planted no template on disk and so could not have caught it.'
      - Review widened the rule twice, both correct. An ignored template is disowned rather than forgotten, because ignoring a file is the same statement about publishing that the index makes — git::tracked's own doc already said so, so refusing one contradicted the module. And symlinks are no longer followed, so a directory outside the repository cannot have its templates counted as ours.
      - The acceptance line said 'git does not track'; what shipped is 'neither tracks nor ignores', which is the correction above and not a narrowing.
      - 'Kody''s stated mechanism for the symlink case was wrong and is recorded as such: there is no infinite recursion, because present returns empty when read_dir fails, so an ancestor loop terminates past PATH_MAX — measured at 0.03s with the following form restored. The real defect was the foreign file, and the test asserts that; reverting makes it fail naming .ctl/templates/linked/foreign.jinja.'
      - docs/served-files.md §1 no longer claims an untracked template renders nowhere, §5's failure list carries the case so its 'exactly one thing is skipped silently' reads true again, and verctl instructions, AGENTS.md and skills/verctl/SKILL.md carry the whole rule.
    disposition: completed

