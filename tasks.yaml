    title: Block hand-edited versions on the default branch
    scope: verctl
    completed: "2026-08-17"
    disposition: completed
    outcome: >-
      A pre-push or check fails when a declared manifest version
      differs from origin/main outside version-packages.
    evidence:
      - "github.com/victor-software-house/verctl/pull/9"
      - "474cace on main"
      - "verctl check --versions plus mise run versions on pre-push"
      - "merge-base of HEAD vs origin/HEAD, GITHUB_BASE_REF, main, master"
      - "only version-packages exempt; CI does not skip; tests inject Skip"

