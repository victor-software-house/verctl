  - id: VER-023
    title: Is this how a modern Rust CLI is built?
    scope: verctl
    kind: evaluation
    outcome: >-
      The crate layout, error handling, test structure, and fixture
      approach are what current Rust practice recommends — or we know
      exactly where we differ and why we keep it.
    open: >-
      2026-08-18, raised by Victor: nothing here is unmanageable, but the
      pattern was never checked against the field. Questions worth
      researching rather than guessing: flat `src/*.rs` modules versus
      grouped ones as the crate keeps growing; anyhow everywhere versus a
      typed error at the library boundary with anyhow only in main; unit
      tests in-file versus `tests/` (both are used here, with no stated
      rule); hand-written table tests versus a fixture or snapshot crate;
      and how much of the answer belongs in ctl-core so all three CLIs
      share it (VER-022). Deliverable is a short written standard in
      ctl-core plus a list of what to change here, not a rewrite.

  - id: VER-045
    title: Serve the shared Rust baseline through verctl
    scope: verctl
    outcome: "The shared Rust baseline that ctl-core renders reaches each Rust repository through verctl's Served files block: `verctl render` writes it and `verctl check` reports its drift."
    kind: deferred
    open: "Paused by the operator: rendering files outside versioning is outside verctl's scope unless a more general shared mechanism exists. Waits on the ctl-core side's discovery of such a mechanism (a templating tool, a mise plugin, or a crates monorepo)."
    notes:
      - "2026-10-12 (UTC): the operator paused this row. verctl does not render the Rust baseline files for now, because writing templates outside versioning is outside verctl's scope unless a more general shared mechanism exists. The ctl-core side is writing a discovery document first, and the standard Rust mise tasks ship separately as a mise remote task include from ctl-core. ctl-core's `baseline` feature stays in 0.6.12 meanwhile. Do not start this row until that discovery names a mechanism and the operator resumes it."
      - "2026-10-12 (UTC): the operator decided the shared Rust baseline joins verctl's Served files block. There is no `ver baseline` subcommand: `verctl render` writes the baseline files and `verctl check` reports their drift, in the same report and JSON as other served files, with one non-zero exit and one line per drifted file. ctl-core's `baseline` feature returns plain `ctl_core::served::Served` values plus marked-block entries, read from `.ctl/rust.yaml`, whose schema ctl-core owns. A marked block in `Cargo.toml` holds only `[lints.*]` or `[workspace.lints.*]` tables, never the keys the version step writes. When the baseline changes the rust entries in a mise config, the lock for that environment is regenerated whole with `mise lock --platform …`, never edited as text; the ctl-core side reports that a per-tool `mise lock rust` left a stale entry when the entry changed shape, not yet reproduced here. Default timing is a patch after 0.4.0, since it adds a source to an existing block."
      - '2026-10-12 (UTC): agreed with the ctl-core side: verctl owns the served `.github/workflows/ci.yml`, and the baseline renders no workflow. The Rust steps it carries are those of ctl-core ci.yml at 02941ff (https://github.com/victor-software-house/ctl-core/blob/02941ff7bd0d1d7adf9fb07db59599ecf3da66f0/.github/workflows/ci.yml): env `MISE_ENV: dev,ci` and `CARGO_TERM_COLOR: always`; checkout with `persist-credentials: false`; `jdx/mise-action` at the pinned mise with `cache: true`, before `jdx/mr-boxington-action`, because the mbx cache key hashes the rustc on PATH; then `mise run verify` and `mise run deny:advisories`; and, for a published library only, `mise run semver` and `mise x -- cargo package --locked --all-features`. The repository kind and published flag come from `.ctl/rust.yaml`.'
      - '2026-10-12 (UTC): ctl-core 0.6.12 shipped the `baseline` feature (crates.io, rust-version 1.99.0; https://github.com/victor-software-house/ctl-core/releases/tag/v0.6.12). API at fd6c61f (https://github.com/victor-software-house/ctl-core/blob/fd6c61f5b1967888090052b996c22370325b0b31/src/baseline.rs): `baseline::load(root)` reads `.ctl/rust.yaml`; `baseline::render(root, &config)` returns `Rendered { served, owned }`, where `served` holds whole files (rust-toolchain.toml, rustfmt.toml, clippy.toml, deny.toml, lefthook.yml, and Cargo.toml and mise.dev.toml with only their marked block replaced) for `render` and `check` to treat like any other served file, and `owned` lists files the repository keeps, each with a reason, reported as owned rather than drift; `BaselineError` names the file, such as a missing marker. `Config` is serializable, so the served ci.yml template can read `published` and `layout`. Adopting it requires rust-version 1.99.0, `.ctl/rust.yaml`, and the two marker pairs; ctl-core is the worked example (`.ctl/rust.yaml` and `tests/baseline.rs` at fd6c61f).'

