# yaml-language-server: $schema=https://github.com/victor-software-house/qctl/releases/download/v0.0.1/tasks.schema.json
schema_version: 1
prefix: VER
active: VER-003

queue:
  - id: VER-003
    title: Write Cargo.toml and package.json versions
    scope: verctl
    outcome: >-
      prepare (local, no PR yet) applies the max bump per declared
      package to Cargo.toml and/or package.json and refreshes the
      matching lockfile.
    blocked_by: []
    acceptance:
      - "[workspace.package].version is the default Rust path; [package].version is used when there is no workspace version."
      - toml_edit keeps comments and key order in Cargo.toml.
      - package.json version is rewritten without reformatting unrelated keys.
      - Cargo.lock or bun.lock is refreshed after the bump, or the command names the exact follow-up.
      - A major fragment on a 0.x version is rejected.
      - Packages named in a fragment but missing from [release] config fail closed.
      - Unit tests cover patch, minor, 0.x-major-reject, and a comment-preserving Cargo.toml fixture (indoc).
    notes: >-
      Declare packages in mise.toml or verctl.toml later. This slice does
      not open a GitHub PR.

  - id: VER-004
    title: Open or update the Version PR
    scope: verctl
    outcome: >-
      One prepare-release PR consumes fragments, commits version files
      and CHANGELOG, and deletes the consumed .changeset files.
    blocked_by: [VER-003]
    acceptance:
      - Uses GITHUB_TOKEN only. No PAT.
      - Opens a new PR or force-updates the existing version-packages branch.
      - CHANGELOG sections are minijinja output from VER-002.
      - Consumed fragment files are deleted in the same commit.
      - examples/workflows/version-pr.yml and actions/version-pr stay the consumer API.
      - Local prepare still works without GitHub when --no-pr is set.
    notes: Happy path is the shipped Action. Local is recovery.

  - id: VER-005
    title: "Publish native verctl so mise github: can install it"
    scope: release
    outcome: >-
      crates.io plus GitHub Release assets for darwin-arm64 and linux-x64.
    blocked_by: []
    acceptance:
      - cargo publish --locked succeeds for this crate.
      - gh release vX.Y.Z includes both native tarballs.
      - mise x github:victor-software-house/verctl@vX.Y.Z -- verctl --version matches the tag.
      - tasks/ver/ver and examples/mise.toml pin that tag.
    notes: Same cut as qctl 0.0.1. linux-x64 may wait for a Linux runner.

horizon:
  - id: VER-008
    title: Generic regex version writer
    scope: verctl
    kind: evaluation
    outcome: Packages that are not Cargo or package.json can still bump via a declared pattern.
    open: Need a real third manifest (not a hypothetical) before adding a regex writer.

  - id: VER-006
    title: Conventional Commits synthesize the same fragments
    scope: verctl
    kind: deferred
    outcome: An opt-in mode writes .changeset/*.md from commit types.
    open: Fragment consume and Version PR must exist first. Default stays off.

  - id: VER-007
    title: OIDC publish backends for cargo and bun
    scope: verctl
    kind: deferred
    outcome: A publish verb runs after the Version PR merges.
    open: Trusted Publishing and bun publish paths are a later slice. actions/publish is only the hook.

archive:
  - id: VER-002
    title: Render changelogs with minijinja
    scope: verctl
    completed: 2026-08-16
    disposition: completed
    outcome: >-
      Defaults are Jinja2 templates rendered by minijinja 2.x. Author
      filtering is in the adapter.
    evidence:
      - templates/changelog.jinja and dependency-changelog.jinja
      - tests/changelog.rs indoc goldens for internal PR, external byline, commit fallback, bare period, terminal punct, PR-over-SHA, override template, invalid template, empty login, dependencies

  - id: VER-001
    title: Parse Changesets YAML fragments (quoted and unquoted)
    scope: verctl
    completed: 2026-08-16
    disposition: completed
    outcome: >-
      verctl reads .changeset/*.md via YAML and reports pending packages
      and max bumps. check fails closed.
    evidence:
      - src/fragment.rs (BOM/CRLF normalize, skip README, fail closed)
      - verctl status and verctl check
      - tests/fragment.rs and tests/status.rs
