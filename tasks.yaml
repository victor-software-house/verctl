  - id: VER-046
    title: Declare the lock platforms so mise install leaves the locks unchanged
    scope: mise
    outcome: A `mise install` on a supported machine changes no tracked file, so hooks and CI stop rewriting mise.dev.lock.
    notes:
      - '2026-10-12 (UTC): on mise 2026.10.7 a fresh `mise install` on linux-x64 added cargo-deny 0.20.2 entries for linux-arm64, linux-arm64-musl, linux-x64-musl, macos-x64, and windows-x64 to `mise.dev.lock`, and every local commit hook rewrites the same file. Cause: `mise.dev.lock` records committed for all seven platforms but cargo-deny for only linux-x64 and macos-arm64, and with `lockfile_platforms` unset mise keeps every platform already recorded in the lockfile, so automatic locking fills cargo-deny up to the seven (https://github.com/jdx/mise/blob/4599c53b4286ff101de876f8122feec0797b48b2/settings.toml, the 2026.10.7 docs). Declare the setting, then regenerate each lock whole with `mise lock --platform …` so every tool records the same platforms.'
      - "2026-10-12 (UTC): entry order in a mise lock depends on the mise version: with the same two rust entries in config, mise 2026.10.3 writes the nightly entry first and 2026.10.7 the stable entry first, with identical content (run locally on both official binaries). `min_version` sets only a floor, so it cannot hold every machine to one version. Decision: verctl compares a lockfile's parsed entries, never its bytes (release-state-machine design, section 4), and byte-identical locks are expected only from the mise version CI pins."
    completed: 2026-10-12T04:50:29
    evidence:
      - 'https://github.com/victor-software-house/verctl/pull/109: mise.toml declares lockfile_platforms linux-x64 and macos-arm64, and the three locks were regenerated with mise lock on mise 2026.10.3; a fresh linux-x64 mise install left git status clean.'
    disposition: completed

