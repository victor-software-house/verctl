# yaml-language-server: $schema=https://github.com/victor-software-house/qctl/releases/download/v0.0.1/tasks.schema.json
schema_version: 1
prefix: VER
active: VER-011

queue:
  - id: VER-011
    title: Finish the Changesets-shaped release loop
    scope: verctl
    outcome: >-
      Fragment in, Version PR, exact-SHA publish, per-package CHANGELOG,
      lockfile, already-published, optional natives. No hand-edited
      versions.
    blocked_by: []
    acceptance:
      - prepare writes versions + per-package CHANGELOG and consumes fragments.
      - Version PR is the only version-authority path (CI / --pr).
      - "`[prepare].after` plus stage globs; unexpected dirty files fail."
      - publish is overridable recipes; cargo and bun are stock examples.
      - Lockfile is committed; cargo publish --locked works after bump.
      - Pretty is ctl-core ColorMode tables; tests use --color never.
      - Native assets only when [assets] is set; PR CI stays one runner.
      - Asset jobs are named by target id; cargo/bun inherit stdio.
    notes: >-
      Original product goal. Do not name the private release-skill in
      repo docs. Rust and bun are stock examples, not the architecture.
      Adopt ctl-core fixture trees (CTC-006) instead of more fs::write
      + indoc copies. 2026-08-17: status/check/prepare are ColorMode
      tables; publish proves changelog headings + default-branch
      history (no commit-subject sniff); GitHub notes come from each
      package CHANGELOG. Hand-edit guard shipped as VER-012 / PR #9.
      Still open for archive: lockfile-after-bump (VER-013).

  - id: VER-015
    title: Asset runners are configuration, not a hardcoded map
    scope: verctl
    outcome: >-
      Each [assets] target names the runner that builds it. The plan
      emits what the repo declared, so a public repo stays on free
      hosted minutes and a private one can point at its own labels.
    blocked_by: []
    acceptance:
      - A machine is declared once as [runners.NAME] with labels; [ci.NAME] names several, [assets.NAME] exactly one.
      - verctl ci and verctl assets print what resolved and the matrix carries it.
      - A public repo needs no config to keep macos-latest / ubuntu-latest, and no [ci] to keep one verify job.
      - A declared self-hosted or nscloud label set reaches runs-on unchanged, in order.
      - An undeclared machine name fails listing the declared ones; a label is never accepted as a name.
      - Tests cover default, override, multi-label, fan-out naming, empty list, and a partial undeclared target.
    notes: >-
      2026-08-17: found while adopting the lane in qctl (qctl#3). Two
      claims first written here were wrong and are corrected: a per-target
      `runner` override already existed, and a job can be told its runner
      by an earlier job. The real defects are that `runner` is one string
      where GitHub takes a label set, that CI has no configuration surface
      at all, and that an unknown id with a partial record is accepted and
      reaches `cargo build --target ""`. Shape settled after several wrong
      turns, recorded so they are not retried: anonymous list rows needing
      an `id` field (`[[ci.jobs]]`, `runners = [{ labels = [...] }]`) were
      rejected as ceremony — names are table headers instead; a `runners`
      list on an asset target was rejected because two machines would
      overwrite one tarball, which the shape now makes unsayable; and one
      identical shape per phase was abandoned once it put `os`/`arch` on a
      job while its labels sat a level below. A name→labels registry is
      deliberately not the alias table rejected earlier: an alias made an
      invented word look like a resolved label, whereas a machine name
      resolves against `[runners]` or fails and never reaches GitHub.
      M1 (generating ci.yml) and M3 (a repo variable) were considered
      and rejected for M2, the plan-job bootstrap the publish lane already
      uses; M3 would move the value out of verctl.toml entirely.
      Asked why `plan` is not configurable, the inventory settled the law:
      verctl decides how many jobs there are, the workflow file decides
      where a fixed job runs. Unary jobs (`plan`, `crate`, `pin`,
      `prepare`) all have literal machines; only `verify` and `assets`,
      whose count the repo decides, read config. A static YAML file cannot
      declare N jobs without knowing N — that fan-out is what config buys,
      and the machine rides along on it. So `[release]` is dropped, not
      deferred: publish and pin are inherently unary, nothing decides their
      count, and a self-hosted-only repo is already served by editing three
      literals in workflows it owns. `verctl check --ci` was rejected with
      it — verifying those literals needs a YAML dependency this crate does
      not have, to check a value the law puts there on purpose.

  - id: VER-017
    title: The pin phase is an Action, like the other three
    scope: verctl
    outcome: >-
      A consumer declaring [[pins]] gets them rewritten and committed by
      naming one action, not by copying release-critical bash.
    blocked_by: []
    acceptance:
      - actions/pin runs verctl pin, commits only the files verctl reported, and pushes to the default branch.
      - A repo declaring no [[pins]] exits clean instead of committing an empty change.
      - Whatever an earlier step left staged does not ride along on the release commit.
      - examples/workflows/publish.yml shows the job, so a consumer copies it instead of inventing it.
      - README and verctl instructions name all four actions.
    notes: >-
      2026-08-18: found because qctl's examples/mise.toml still pinned
      ?ref=v0.0.1 with nothing to move it. The gap was in the reference
      workflow, not in qctl: examples/workflows/publish.yml had no pin job
      at all, so every consumer that copied it inherited the hole, and
      ctl-core copied its @main refs along with it. Verified in a scratch
      repo against a bare remote: the rewrite moved both the [tools]
      version and the ?ref=, the commit carried consumer/mise.toml only
      while a staged junk.txt stayed out of the tree, a second run printed
      "pins already name the released versions" and pushed nothing, and an
      empty [[pins]] list exited clean. Two defects were found and fixed
      that way, both from an unscoped index: `git diff --cached` with no
      pathspec would have committed anything already staged, and an empty
      file list fell through to a commit. This repo's own publish.yml pin
      job deliberately stays hand-rolled — it must run the binary
      published seconds earlier, which PATH does not have, and the action
      requires verctl on PATH. Adoption in qctl follows once this merges,
      since the ref has to be a real SHA.

  - id: VER-018
    title: The pin phase materializes templates and runs consumer hooks
    scope: verctl
    outcome: >-
      Anything a release leaves stale is rewritten by declaration,
      whatever file it lives in, without verctl learning that file's
      format.
    blocked_by: [VER-017]
    acceptance:
      - "`[pin]` takes `after` and `stage`, the vocabulary `[prepare]` already has."
      - A consumer template renders the released versions wherever that template lives in its tree.
      - A match-and-replace overlay covers what no template can own (a mise task header, a README install line).
      - "`[[pins]]` TOML rewriting keeps working: templates coexist with it, they do not replace it."
      - "mise pin sites are first class: [tools] tables and `#MISE tools = { … }` task headers."
      - actions/pin grows no new input per consumer scenario.
    notes: >-
      2026-08-18, decided: making verctl cover every file format out of
      the box was never the plan and does not scale, so the answer is
      hooks and templates rather than a parser per format. Teaching
      `verctl pin` the `#MISE tools = { … }` header form was proposed and
      rejected for that reason. Templates, overlays, and a plain
      match-and-replace expression are unavoidable in the long run; a
      temporary bridge is acceptable until then. Evidence: qctl has five
      pin sites and `verctl pin` reaches two of them. examples/mise.toml
      holds the [tools] pin and the ?ref=, tasks/q/q line 5 carries a
      `#MISE tools` header, and README repeats the ?ref= plus an install
      hint. All five were hand-bumped to 0.0.2 on 2026-08-18 as that
      bridge, which is the rot this row removes. verctl's own release
      wants the same hooks: its pin job runs `mise -E release lock` after
      the rewrite and commits mise.release.lock beside the pins, which
      today only bash can express.

horizon:
  - id: VER-016
    title: The plan job should not install a compiler to parse TOML
    scope: verctl
    kind: evaluation
    outcome: >-
      The ci.yml bootstrap costs what reading verctl.toml costs, and
      verify stops waiting on a toolchain it does not share.
    open: >-
      Measured on run 32078158505: plan took 33s, of which 21s was mise
      plus rust-cache, and verify did not start until 37s in. It needs
      verctl and verctl.toml, not cargo. The tarball is the fix and it
      is gated, not undecided: `git show v0.0.2:src/ci.rs` does not
      resolve, so the published binary has no `ci` verb and
      MISE_ENV=release cannot plan until a release carries VER-015.
      Flip the plan job then and delete its toolchain steps. Rejected
      meanwhile: a stable-rust plan job, which trades a second
      toolchain and a cold cache for ~13s; and one rust-cache key
      across plan and verify, since rust-cache saves only when the key
      is absent, so plan's dev-binary target dir would land first and
      leave verify a thinner cache than its own. Efficiency only — the
      runner contract itself is settled (VER-015).

  - id: VER-013
    title: Stock lockfile refresh after cargo bumps
    scope: verctl
    kind: evaluation
    outcome: >-
      After a cargo version write, Cargo.lock is regenerated so
      publish --locked does not fail.
    open: >-
      Decide whether this is default after for the cargo driver or a
      [prepare].after the repo opts into. 2026-08-18: qctl 0.0.2 failed
      on exactly this and is evidence for the default. The cargo driver
      already names `cargo generate-lockfile`, but `apply_plan` returns
      it as a follow-up that only prints in the `next` column, so every
      cargo consumer has to restate it as `[prepare].after` plus a
      `Cargo.lock` stage glob — and a repo that does not know to is one
      Version PR away from a dirty-tree `cargo package --locked`.
      Running the driver's own after is the fix; the opt-in escape is
      then a `[prepare]` that overrides it. The command itself is settled
      and no longer part of the question: measured on a scratch copy with
      the manifest bumped to 0.0.9, `cargo generate-lockfile` printed
      `Locking 138 packages` and `Adding serde_yml v0.0.12` for a 3-line
      diff, while `cargo update --workspace` printed `Locking 1 package`
      for a 1-line diff. The driver, this repo, qctl, and ctl-core all
      name the narrow one now.

  - id: VER-014
    title: First-party composite Action packages
    scope: verctl
    kind: evaluation
    outcome: >-
      action.yml packages get floating major tags without npm.
    open: Need a first-party Action that is not this repo's own actions/.

  - id: VER-010
    title: Stock JS publish for npm, pnpm, and yarn
    scope: verctl
    kind: evaluation
    outcome: >-
      package.json still publishes through one table of argv. Bun stays
      the default. npm/pnpm/yarn are extra rows, not new verbs or
      Action commands.
    open: >-
      Need a consumer that is not Bun. Infer from packageManager /
      lockfile the same way detect.rs already does for install. Action
      stays `verctl publish`.

  - id: VER-008
    title: Generic regex version writer
    scope: verctl
    kind: evaluation
    outcome: Packages that are not Cargo or package.json can still bump via a declared pattern.
    open: Need a real third manifest (not a hypothetical) before adding a regex writer.

  - id: VER-006
    title: Conventional Commits synthesize the same fragments
    scope: verctl
    kind: deferred
    outcome: An opt-in mode writes .changeset/*.md from commit types.
    open: Default stays off. Fragments remain the human input.

  - id: VER-007
    title: OIDC publish backends for cargo and bun
    scope: verctl
    kind: deferred
    outcome: Public npm uses trusted publishing, not NPM_TOKEN.
    open: bun publish --tolerate-republish already ships. OIDC is the remaining auth path.

