  - id: VER-025
    title: Declarations live in .ctl/ver.yaml
    scope: verctl
    outcome: >-
      A repo has one `.ctl` directory that every ctl CLI shares, and verctl's
      declarations are one YAML file inside it. `verctl.toml` is gone, not
      tolerated.
    notes: >-
      2026-08-18, decided by Victor and recorded late — this row exists
      because the decision lived in a conversation instead of the repo, which
      is the failure the cold-start rule is about. His words, twice: first
      "keep the damn config in there, .verctl/config.toml etc etc … anything
      more than that, then we should use a damn directory already", then, on
      seeing this written up as an open question, "we should just fucking drop
      fucking verctl.toml and keep shit under .verctl/{config, etc etc}.yaml".
      The second supersedes the first on two points: the format is YAML, and
      `verctl.toml` is dropped rather than still recognized. A per-concern
      split, YAML only, with both consumers migrated, is what was agreed at
      the time.
      This is a break to a contract we own, so the rule applies: inventory
      every producer and consumer, migrate them in the same slice, remove the
      old path. VER-021 declares this its blocker rather than saying so in
      prose, because a schema written against verctl.toml is written twice.
      VER-024 is the smaller version of the same problem and can ride along.
      2026-08-19, from qctl QCTL-019: this slice picks a name two tools have to
      live with, so pick it on purpose. qctl will need project config of its own
      — a registry naming the ledgers a repo reads — and if this lands `.verctl/`
      while that invents `.qctl/`, two tools that ship together have two
      conventions and nothing written down about why.
      Decided by Victor the same day, and it supersedes this row's original
      shape: one `.ctl/` directory, one file per tool, and the file name drops
      the ctl — `.ctl/ver.yaml`, `.ctl/q.yaml`, `.ctl/fork.yaml`. The names match
      the tasks a consumer already runs (`mise run ver`, `mise run q`,
      `mise run fork`), so a file is named after the verb the operator types
      rather than after the crate that reads it, and ctl-core has one place to
      look when it becomes the shared layer. `.verctl/` is not the target.
      What is superseded, explicitly: one YAML file per concern. The sections
      are already named inside the document, so a directory of ten files split
      what a reader opens without splitting what they have to understand. If it
      ever does grow, the loader can accept a directory beside the file without
      a second migration — that is a follow-up, not this slice. Templates keep a
      directory of their own at `.ctl/templates/`, shared rather than
      namespaced, because a template already declares its own target and nothing
      in one is verctl's except who renders it.
      One constraint from that side, so the shape is not chosen blind: a
      committed file can only carry what is true on every machine. qctl's
      registry splits accordingly — prefixes in the repo, paths on the machine —
      and any `.ctl/` convention should expect the same split rather than assume
      everything a tool declares is committable.
    completed: 2026-08-19T23:57:38
    evidence:
      - 'verctl#44 merged f3553c0: .ctl/ver.yaml holds every section verctl.toml held, templates moved to .ctl/templates/, verctl.toml is not read at all.'
      - 'Cross-section rules still fire on one merged document: every_pattern_is_listed, an undeclared runner on a job or asset target, a pin outside the repository. Loading is still one boundary, now Config::parse.'
      - 'v0.1.0 released 2026-08-19 (tag commit 52a7d374), both tarballs attached; git show v0.1.0:verctl.toml fails with "path does not exist", and .ctl/ver.yaml is there.'
      - 'Every known consumer moved with its verctl pin in the same commit: ctl-core#10 -> 28920b8, qctl#32 -> 5b86881. Both bump mise.release.toml to 0.1.0 and every action ref to 52a7d374, and both were exercised with the released binary, not a checkout.'
      - 'The consumer list is two, and forkctl is the third repo in the family that is not on it: origin/main carries no verctl.toml, no mise.release.toml, and no verctl action — it releases through mise-tasks/release.sh. Checked rather than assumed, because its served tasks/fork/fork looks like a verctl lane and is not one.'
      - "This repo's own mise.release.toml moved to 0.1.0 too. Its lanes run MISE_ENV=dev, so CI never touched it, but a local MISE_ENV=release would have installed a 0.0.4 that cannot read the file this repo now writes."
      - 'qctl''s two templates moved with git mv and still render: a dry run there rewrites README.md, examples/mise.toml, and tasks/q/q.'
      - 'Two shapes were decided under this row rather than assumed: paths stay relative to the directory holding .ctl/ (config::root_of, table test), and an arity with a bound is {exactly: N} / {at_least: N} because a newtype variant would want a YAML tag. VER-028 records the shared-templates question review raised.'
    disposition: completed

