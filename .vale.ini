# Prose style, checked by `mise run lint:prose`.
# Vale finds this file from any directory below the root. The rules come
# from the ProseStyle package; `mise run prose:sync` fetches it into StylesPath.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/victor-software-house/prose-style/releases/download/v0.0.5/ProseStyle.zip

# A tool writes target/**; nobody edits it by hand.
[target/**]
BasedOnStyles =

# A tool writes CHANGELOG.md; nobody edits it by hand.
[CHANGELOG.md]
BasedOnStyles =
