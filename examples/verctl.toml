# Built-in drivers `cargo` and `npm` (version keys) and publishers
# `cargo` and `bun` are stock recipes. Redefine or add your own.

[drivers.cargo]
format = "toml"
keys = ["workspace.package.version", "package.version"]

[drivers.npm]
format = "json"
keys = ["version"]
# after = "bun install"

# [[packages]]
# name = "@org/pkg"
# path = "package.json"
# publisher = "bun"
# registry = "github"
#
# [publishers.twine]
# noun = "package"
# argv = ["uv", "publish"]

# String form is a mise task (no shell):
# read = "ver-read-version"
# write = "ver-write-version"
#
# Array form is execvp:
# read = ["jq", "-r", ".version"]
#
# [[packages]]
# name = "verctl"
# path = "Cargo.toml"
# driver = "cargo"
#
# Omit [assets] for a library. One target when a single binary covers
# every consumer you care about.
# Per-package CHANGELOG.md sits next to the manifest. Override with
# changelog = "docs/FOO.md" when it does not.
#
# [prepare]
# after = ["mise", "run", "version-sync"]
# stage = ["packages/*/src/version.rs"]
#
# Machines are declared once. The header names one, `labels` is how GitHub
# finds it — every label at once, so `big` below is a single machine carrying
# three labels, not three machines. verctl ships no built-in names: this table
# is yours, and only `labels` ever reaches runs-on.
#
# [runners.big]
# labels = ["self-hosted", "linux", "x64"]
#
# [runners.ns]
# labels = ["nscloud-ubuntu-24.04-amd64-4x8"]
#
# One [assets.NAME] table per host binary. The name is the job, the tarball,
# and the platform. Omit [assets] for a library. darwin-arm64 and linux-x64
# are built in, so naming one is enough — it keeps free hosted minutes.
#
# [assets.darwin-arm64]
#
# Name a `runner` only when the built-in machine is wrong. One tarball is one
# machine, so this is one name and not a list:
#
# [assets.linux-x64]
# runner = "big"
#
# A name outside darwin-arm64 / linux-x64 describes a platform verctl knows
# nothing about, so it must describe all of it:
#
# [assets.linux-arm64]
# runner = "ns"
# os = "linux"
# arch = "arm64"
# triple = "aarch64-unknown-linux-gnu"
#
# PR and push validation. Omit [ci] for one `verify` job on ubuntu-latest.
# A job may name several machines: one check each, `verify (big)` and
# `verify (ns)`. No os/arch/triple — validation does not cross-compile.
#
# [ci.verify]
# runners = ["ns", "big"]
