# Built-in drivers `cargo` and `npm` (version keys) and publishers
# `cargo` and `bun` are stock recipes. Redefine or add your own.

[drivers.cargo]
format = "toml"
keys = ["workspace.package.version", "package.version"]

[drivers.npm]
format = "json"
keys = ["version"]
# after = "bun install"

# [[packages]]
# name = "@org/pkg"
# path = "package.json"
# publisher = "bun"
# registry = "github"
#
# [publishers.twine]
# noun = "package"
# argv = ["uv", "publish"]

# String form is a mise task (no shell):
# read = "ver-read-version"
# write = "ver-write-version"
#
# Array form is execvp:
# read = ["jq", "-r", ".version"]
#
# [[packages]]
# name = "verctl"
# path = "Cargo.toml"
# driver = "cargo"
#
# Omit [assets] for a library. One target when a single binary covers
# every consumer you care about.
# Per-package CHANGELOG.md sits next to the manifest. Override with
# changelog = "docs/FOO.md" when it does not.
#
# [prepare]
# after = ["mise", "run", "version-sync"]
# stage = ["packages/*/src/version.rs"]
#
# A target is a table, never a bare string. `id` names the job and the
# tarball; `runs_on` is the literal GitHub label list. Both spellings below
# are the same TOML document.
#
# [[assets.targets]]
# id = "darwin-arm64"
#
# [[assets.targets]]
# id = "linux-x64"
#
# [assets]
# targets = [{ id = "darwin-arm64" }, { id = "linux-x64" }]
#
# Name runs_on only when the built-in default is wrong. A label set means
# AND, the way GitHub reads it:
#
# [[assets.targets]]
# id = "linux-x64"
# runs_on = ["self-hosted", "linux", "x64"]
#
# An id outside darwin-arm64 / linux-x64 describes a platform verctl knows
# nothing about, so it must describe all of it:
#
# [[assets.targets]]
# id = "linux-arm64"
# runs_on = ["ubuntu-24.04-arm"]
# os = "linux"
# arch = "arm64"
# triple = "aarch64-unknown-linux-gnu"
#
# PR and push validation is the same shape. Omit [ci] for one `verify` job
# on ubuntu-latest. No os/arch/triple: CI does not cross-compile.
#
# [[ci.jobs]]
# id = "verify"
# runs_on = ["nscloud-ubuntu-24.04-amd64-4x8"]
