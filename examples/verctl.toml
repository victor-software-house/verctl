# Built-in drivers `cargo` and `npm` are the same Path driver with
# stock keys. Redefine or add drivers here.

[drivers.cargo]
format = "toml"
keys = ["workspace.package.version", "package.version"]

[drivers.npm]
format = "json"
keys = ["version"]
