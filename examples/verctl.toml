# Built-in drivers `cargo` and `npm` are the same Path driver with
# stock keys. Redefine or add drivers here.

[drivers.cargo]
format = "toml"
keys = ["workspace.package.version", "package.version"]
after = "cargo generate-lockfile"

[drivers.npm]
format = "json"
keys = ["version"]
after = "bun install"

# String form is a mise task (no shell):
# read = "ver-read-version"
# write = "ver-write-version"
#
# Array form is execvp:
# read = ["jq", "-r", ".version"]
#
# [[packages]]
# name = "verctl"
