min_version = "2026.7.7"

[settings]
experimental = true
lockfile = true

# `prepare` rewrites this pin and the ?ref= below onto the Version PR commit,
# so the tag carries an example that installs itself. A verb added after the
# release you copy is not in that tarball yet — pin the release that carries
# the verb you copied.
[tools]
"github:victor-software-house/verctl" = "0.0.3"

[task_config]
includes = [
  "git::https://github.com/victor-software-house/verctl.git//tasks/ver?ref=v0.0.3",
  "mise-tasks",
]
