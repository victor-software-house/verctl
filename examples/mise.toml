min_version = "2026.7.7"

[settings]
experimental = true
lockfile = true

# `verctl pin` rewrites this pin and the ?ref= below after each publish, so it
# names the last release while the workflows beside it are written against HEAD.
# A verb added since that release is not in this tarball yet — pin the release
# that carries the verb you copied.
[tools]
"github:victor-software-house/verctl" = "0.0.2"

[task_config]
includes = [
  "git::https://github.com/victor-software-house/verctl.git//tasks/ver?ref=v0.0.2",
  "mise-tasks",
]
