# Consumer caller. Pin github:victor-software-house/verctl in your mise config
# and serve the `ver` task; every input is optional and defaults to verctl's.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # tags, Releases, and assets
  pull-requests: write # the Version PR when no App secret is mapped
  id-token: write # every job requests it: crates.io trusted publishing and the release mirror

jobs:
  release:
    uses: victor-software-house/verctl/.github/workflows/release.yml@<sha> # vX.Y.Z
    with:
      # Each crate lists this repository and release.yml as its trusted
      # publisher on crates.io; a crate's first publish still needs a token.
      crates-io-trusted-publishing: true
      # A token kept in an environment that admits only main: name the
      # environment here, store the token there as CARGO_REGISTRY_TOKEN, and
      # map it below by that name. Never pass `secrets: inherit`.
      # environment: release
    secrets:
      app-client-id: ${{ secrets.CHANGESET_VERSION_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CHANGESET_VERSION_APP_PRIVATE_KEY }}
      # The first publish of a new crate, with crates-io-trusted-publishing
      # off for that release:
      # registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
