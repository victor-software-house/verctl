# Consumer workflow. Pin github:victor-software-house/verctl in your mise.toml.
name: Version PR

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: version-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare the Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; the App token below makes every write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.8.2
          cache: true
      - run: mise install --locked
      # A GitHub App token, so the Version PR starts CI and its merge starts
      # publish; neither happens for an event made with GITHUB_TOKEN.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.VERSION_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERSION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: victor-software-house/verctl/actions/version-pr@ffc0a3b4bf03cbc81b2677aea2bd080e98d6c43b # v0.4.5
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Needs a required status check on main.
          auto-merge: "true"
