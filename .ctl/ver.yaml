# This repo's own package. A .changeset fragment plus
# `mise run ver version --pr` opens the first Version PR.

# examples/mise.toml and skills/verctl/SKILL.md are served from
# .ctl/templates/, so they need no pin. mise.release.toml is the one
# file that cannot be either: it names the tarball this lane installs,
# so it can only move to a version that already exists, and it is
# bumped by hand.
#
# examples/ver.yaml shows the shape a repo that pins by hand would write.

prepare:
  after: [cargo, update, --workspace]
  stage: [Cargo.lock]

packages:
  - name: verctl
    path: Cargo.toml
    # The release changes planned in openspec/changes/ land as breaking
    # patches, so each Version PR ships a candidate, such as 0.8.6-rc.1.
    prerelease: rc
    # The required verify job runs `cargo package` on every pull request and
    # merge-queue entry, so the commit a release publishes was already packed
    # and built. The upload skips cargo's second build of it.
    publish:
      verify: false

# GitHub's hosted arm64 Linux runner, free for a public repo. It builds the
# linux-arm64 tarball natively: the TLS stack (aws-lc-sys, ring) compiles C,
# and cross-building it from x64 would need a cross C toolchain.
runners:
  arm64:
    labels: [ubuntu-26.04-arm]

# One key per host binary; the name is the job, the tarball, and the platform.
# Omit for a library. darwin-arm64 and linux-x64 are built-in records, so
# `runner`, `os`, `arch`, and `triple` come from verctl and those two stay on
# free hosted minutes without saying so. linux-arm64 is not built in, so it
# names its machine and target. Its triple is the glibc one, like linux-x64's,
# because the runner's system compiler is the GNU toolchain; a musl triple
# would need a musl C compiler the runner does not have.
#
# `ci` is deliberately absent. This repo is public, so the default, one
# `verify` job on ubuntu-26.04, is exactly what it wants.
assets:
  darwin-arm64: {}
  linux-x64: {}
  linux-arm64:
    runner: arm64
    os: linux
    arch: arm64
    triple: aarch64-unknown-linux-gnu

# Maintainers and Apps a changelog never credits (verctl 0.4.0).
changelog:
  internal_authors:
    - any-victor
    - "github-actions[bot]"
    - "vsh-changeset-version[bot]"
