# This repo's own package. A .changeset fragment plus
# `mise run ver -- prepare --pr` opens the first Version PR.

[prepare]
after = ["cargo", "update", "--workspace"]
stage = ["Cargo.lock"]

[[packages]]
name = "verctl"
path = "Cargo.toml"

# The Version PR rewrites this so the tag carries a working example.
# mise.release.toml is deliberately absent: it names the tarball this
# lane installs, so it can only move to a version that already exists.
[[pins]]
file = "examples/mise.toml"
tool = "github:victor-software-house/verctl"
package = "verctl"

# One table per host binary; the name is the job, the tarball, and the
# platform. Omit for a library. Both are built-in records, so `runner`, `os`,
# `arch`, and `triple` come from verctl and this repo stays on free hosted
# minutes without saying so.
[assets.darwin-arm64]

[assets.linux-x64]

# [runners] and [ci] are deliberately absent. This repo is public, so the
# defaults — one `verify` job on ubuntu-latest, built-in machines for the two
# targets above — are exactly what it wants; declaring them would only restate
# them. A private repo adds `[runners.NAME]` and points jobs at it.
