# This repo's own package. A .changeset fragment plus
# `mise run ver -- prepare --pr` opens the first Version PR.

[prepare]
after = ["cargo", "generate-lockfile"]
stage = ["Cargo.lock"]

[[packages]]
name = "verctl"
path = "Cargo.toml"

# When this package is bumped, the Version PR also rewrites the
# released-binary pin so the next cycle installs that tarball.
[[pins]]
file = "mise.release.toml"
tool = "github:victor-software-house/verctl"
package = "verctl"

[[pins]]
file = "examples/mise.toml"
tool = "github:victor-software-house/verctl"
package = "verctl"

# One row per host binary; `id` names the job and the tarball. Omit for a
# library. `runs_on` defaults to the built-in record for the id, so this
# repo stays on free hosted minutes without saying so.
[[assets.targets]]
id = "darwin-arm64"

[[assets.targets]]
id = "linux-x64"

# [[ci.jobs]] is deliberately absent: the default is one `verify` job on
# ubuntu-latest, which is exactly what this repo wants. Declaring it would
# only restate the default.
