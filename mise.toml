min_version = "2026.7.7"

[settings]
experimental = true
lockfile = true

[task_config]
includes = [
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=v0.0.1",
]

[tools]
rust = "1.97.1"

[tasks.verify]
description = "Format, lint, and test"
run = "cargo fmt --all -- --check && cargo clippy --all-targets --all-features -- -D warnings && cargo test --all-features"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"
