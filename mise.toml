min_version = "2026.7.7"

[settings]
experimental = true
lockfile = true

[task_config]
includes = [
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=v0.0.1",
]

[tools]
committed = "1.1.11"
lefthook = "2.1.10"
rust = { version = "nightly", components = "rustfmt,clippy" }

[tasks.format]
description = "rustfmt check"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "clippy -D warnings"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.commit-msg]
description = "Lint the git commit-msg file with committed"
usage = 'arg "<file>" help="Path to the commit message file"'
run = 'committed --commit-file "${usage_file}"'

[tasks.commits]
description = "Lint commit messages with committed"
usage = 'arg "[commits]" default="HEAD" help="Commit or range"'
run = 'committed "${usage_commits}"'

[tasks.versions]
description = "Fail if manifest versions differ from the default branch"
run = "cargo run -- check --versions"

[tasks.verify]
description = "Format, lint, and test"
run = "mise run format && mise run lint && cargo test --all-features"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.ver]
description = "Run verctl from this checkout"
run = "cargo run --"
