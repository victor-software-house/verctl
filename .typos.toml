# Spelling, checked by `mise run lint:typos`.
[default]
# A changelog links each entry to its commit as [`abc1234`](…).
# A hash is not a word, yet a short one can spell a typo, such as 71c9abd.
extend-ignore-re = ["\\[`[0-9a-f]{7,40}`\\]"]

[files]
extend-exclude = ["*.lock"]

[default]
# Commit hashes the work queue cites.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
# pnpm link labels in a research note, and the flate2 crate.
pn = "pn"
flate = "flate"
# Misspellings that tests and a queue row use on purpose.
leats = "leats"
chnagelog = "chnagelog"
registr = "registr"
publsher = "publsher"
foramt = "foramt"
ocurrences = "ocurrences"
