# Spelling, checked by `mise run lint:typos`.
[files]
extend-exclude = ["*.lock"]

[default]
# Commit hashes the work queue cites.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
# pnpm link labels in a research note, and the flate2 crate.
pn = "pn"
flate = "flate"
# Misspellings that tests and a queue row use on purpose.
leats = "leats"
chnagelog = "chnagelog"
registr = "registr"
