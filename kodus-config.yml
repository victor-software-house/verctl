# Kodus review config, read by the self-hosted instance.
#
# Two things about how this file is loaded, both worth knowing before
# editing it:
#
#   - It is read from the default branch, not from the PR being reviewed.
#     A change here only takes effect once it is merged.
#   - It applies only while "kodus Config File Overrides Web Preferences"
#     is on for this repository in the Kodus UI. The file cannot enable
#     itself; that toggle is read from the web config.
#
# Top-level keys Kodus does not know are dropped without a warning, and
# arrays replace the defaults rather than merging with them.
version: 2.0

automatedReviewActive: true
runOnDraft: false
baseBranches:
    - 'main'

# Generated bytes only. Cargo.lock churns on every bump, and the banners
# are outlined type — 24KB of path data each, nothing to review.
ignorePaths:
    - 'Cargo.lock'
    - 'docs/*.svg'
    - '.env'

reviewOptions:
    bug: true
    performance: true
    security: true
    business_logic: true

suggestionControl:
    severityLevelFilter: 'medium'

summary:
    generatePRSummary: true
    behaviourForExistingDescription: 'complement'

# AGENTS.md is a rule source Kodus recognises, so the contract stated
# there is what gets enforced, rather than a second copy kept in the UI.
ideRulesSyncEnabled: true
