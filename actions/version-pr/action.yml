name: verctl version PR
description: >-
  Open or update the Version PR. Uses `verctl` on PATH, otherwise the
  published GitHub Release tarball. Never compiles this checkout.
author: victor-software-house
branding:
  icon: git-pull-request
  color: gray-dark

inputs:
  token:
    description: Token that can open PRs. Default GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  config:
    description: Path to verctl.toml.
    required: false
    default: verctl.toml
  title:
    description: Version PR title.
    required: false
    default: "chore(release): version packages"
  commit-message:
    description: Commit message on the Version PR.
    required: false
    default: "chore(release): version packages"
  dry-run:
    description: Preview only. Set to `true` to write nothing.
    required: false
    default: "false"
  version:
    description: >-
      Released verctl to `mise x` when `verctl` is not on PATH.
      Ignored when PATH already has the binary.
    required: false
    default: "0.0.1"

runs:
  using: composite
  steps:
    - name: Prepare release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        VERCTL_CONFIG: ${{ inputs.config }}
        VERCTL_DRY_RUN: ${{ inputs.dry-run }}
        VERCTL_PR_TITLE: ${{ inputs.title }}
        VERCTL_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        VERCTL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        extra=()
        if [ "${VERCTL_DRY_RUN}" = true ]; then
          extra+=(--dry-run)
        fi
        exec "${GITHUB_ACTION_PATH}/../run-verctl" prepare --pr -c "${VERCTL_CONFIG}" "${extra[@]}"
