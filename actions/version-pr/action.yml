name: verctl version PR
description: >-
  Open or update the Version PR from a pinned released verctl
  tarball. Does not compile this checkout.
author: victor-software-house
branding:
  icon: git-pull-request
  color: gray-dark

inputs:
  token:
    description: Token that can open PRs. Default GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  config:
    description: Path to verctl.toml.
    required: false
    default: verctl.toml
  title:
    description: Version PR title.
    required: false
    default: "chore(release): version packages"
  commit-message:
    description: Commit message on the Version PR.
    required: false
    default: "chore(release): version packages"
  dry-run:
    description: Preview only. Set to `true` to write nothing.
    required: false
    default: "false"
  version:
    description: Released verctl pin (`github:victor-software-house/verctl@…`).
    required: false
    default: "0.0.1"

runs:
  using: composite
  steps:
    - name: Prepare release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        VERCTL_CONFIG: ${{ inputs.config }}
        VERCTL_DRY_RUN: ${{ inputs.dry-run }}
        VERCTL_PR_TITLE: ${{ inputs.title }}
        VERCTL_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        VERCTL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        extra=()
        if [ "${VERCTL_DRY_RUN}" = true ]; then
          extra+=(--dry-run)
        fi
        scratch=$(mktemp -d)
        mkdir "${scratch}/tool"
        export MISE_CEILING_PATHS="${scratch}"
        export MISE_CONFIG_DIR="${scratch}"
        exec mise x -C "${scratch}/tool" \
          "github:victor-software-house/verctl@${VERCTL_VERSION}" \
          -- verctl prepare --pr -c "${VERCTL_CONFIG}" "${extra[@]}"
