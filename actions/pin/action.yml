name: verctl pin
description: >-
  After a release publishes, rewrite the collocated `[[pins]]` to the
  versions just released and commit them to the default branch.
  Requires `verctl` on PATH.
author: victor-software-house
branding:
  icon: anchor
  color: gray-dark

inputs:
  token:
    description: Token that can push to the default branch. Default GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  config:
    description: Path to verctl.toml.
    required: false
    default: verctl.toml
  commit-message:
    description: Commit message for the rewritten pins.
    required: false
    default: "chore(release): pin released versions"
  dry-run:
    description: Rewrite and print the diff, commit nothing.
    required: false
    default: "false"

outputs:
  files:
    description: JSON array of the pin files verctl rewrote.
    value: ${{ steps.pin.outputs.files }}

runs:
  using: composite
  steps:
    - name: Rewrite the released pins
      id: pin
      shell: bash
      env:
        VERCTL_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        verctl pin -c "${VERCTL_CONFIG}" --format json >"${RUNNER_TEMP}/verctl-pin.json"
        jq -c '.files' "${RUNNER_TEMP}/verctl-pin.json" >"${RUNNER_TEMP}/verctl-pin-files.json"
        printf 'files=%s\n' "$(cat "${RUNNER_TEMP}/verctl-pin-files.json")" >>"$GITHUB_OUTPUT"
    - name: Commit the released pins
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        VERCTL_DRY_RUN: ${{ inputs.dry-run }}
        VERCTL_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        mapfile -t files < <(jq -r '.[]' "${RUNNER_TEMP}/verctl-pin-files.json")
        if [ "${#files[@]}" -eq 0 ]; then
          echo "no [[pins]] declared"
          exit 0
        fi
        git add -- "${files[@]}"
        # Scoped to the rewritten pins throughout: a release must not carry
        # whatever else an earlier step happened to leave in the index.
        if git diff --cached --quiet -- "${files[@]}"; then
          echo "pins already name the released versions"
          exit 0
        fi
        if [ "${VERCTL_DRY_RUN}" = true ]; then
          git diff --cached -- "${files[@]}"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "${VERCTL_COMMIT_MESSAGE}" -- "${files[@]}"
        git push origin "HEAD:${DEFAULT_BRANCH}"
