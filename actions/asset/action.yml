name: verctl asset
description: >-
  Build one declared native target's tarball and upload nothing. Hand the
  tarball to the release job, whose `verctl release --assets-dir` uploads it
  to the draft Release before any registry upload. The tarball is the
  `asset` file name of the target's row in `verctl status --github-output`,
  beside the config's root. Skip the job when no `[assets.NAME]` table is
  declared.
author: victor-software-house
branding:
  icon: package
  color: gray-dark

inputs:
  config:
    description: Path to the declarations file. Empty means verctl's default, `.ctl/ver.yaml`.
    required: false
    default: ""
  target:
    description: Name of an `[assets.NAME]` table (`darwin-arm64`, `linux-x64`).
    required: true

runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      env:
        VERCTL_CONFIG: ${{ inputs.config }}
        VERCTL_TARGET: ${{ inputs.target }}
      run: exec verctl release asset
