name: verctl publish
description: >-
  After the Version PR merges, publish cargo and bun packages and open
  the GitHub Release. Uses `verctl` on PATH, otherwise the published
  tarball. Never compiles this checkout.
author: victor-software-house
branding:
  icon: package
  color: gray-dark

inputs:
  token:
    description: Token for the GitHub Release. Default GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  config:
    description: Path to verctl.toml.
    required: false
    default: verctl.toml
  dry-run:
    description: Preview only. Set to `true` to skip cargo/bun/GitHub.
    required: false
    default: "false"
  version:
    description: >-
      Released verctl to `mise x` when `verctl` is not on PATH.
      Ignored when PATH already has the binary.
    required: false
    default: "0.0.1"

runs:
  using: composite
  steps:
    - name: Point origin/HEAD at the repository default branch
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        # actions/checkout never creates origin/HEAD. Do not use
        # GITHUB_REF_NAME: on push it is the branch being pushed.
        if [ -n "${DEFAULT_BRANCH}" ]; then
          git symbolic-ref refs/remotes/origin/HEAD \
            "refs/remotes/origin/${DEFAULT_BRANCH}"
        fi
    - name: Publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        VERCTL_CONFIG: ${{ inputs.config }}
        VERCTL_DRY_RUN: ${{ inputs.dry-run }}
        VERCTL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        extra=()
        if [ "${VERCTL_DRY_RUN}" = true ]; then
          extra+=(--dry-run)
        fi
        exec "${GITHUB_ACTION_PATH}/../run-verctl" publish -c "${VERCTL_CONFIG}" "${extra[@]}"
