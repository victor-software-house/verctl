name: verctl release
description: >-
  After the Version PR merges, release HEAD's versions: create the draft
  GitHub Release, upload the declared tarballs to it, publish the cargo and
  bun packages, then publish the draft, which creates the tag. Requires
  `verctl` on PATH.
author: victor-software-house
branding:
  icon: package
  color: gray-dark

inputs:
  token:
    description: Token for the GitHub Release. Default GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  config:
    description: Path to the declarations file. Empty means verctl's default, `.ctl/ver.yaml`.
    required: false
    default: ""
  assets-dir:
    description: >-
      Directory holding the declared tarballs the draft Release lacks, as the
      asset jobs built them with `actions/asset`. Empty when no asset target
      is declared.
    required: false
    default: ""
  dry-run:
    description: Preview only. Set to `true` to read as a release does and write nothing to cargo, bun or GitHub.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        VERCTL_CONFIG: ${{ inputs.config }}
        VERCTL_DRY_RUN: ${{ inputs.dry-run }}
        VERCTL_ASSETS_DIR: ${{ inputs.assets-dir }}
        VERCTL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: exec verctl release
