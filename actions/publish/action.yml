name: verctl publish
description: >-
  After the Version PR merges, publish from that exact SHA. OIDC / bun /
  cargo backends land with VER-007. This action is the hook those backends
  fill.
author: victor-software-house
branding:
  icon: package
  color: gray-dark

inputs:
  command:
    description: Publish command.
    required: false
    default: mise run ver -- publish
  token:
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: ${{ inputs.command }}
