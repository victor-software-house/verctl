name: verctl publish
description: >-
  After the Version PR merges, publish from that SHA: cargo/npm plus a
  GitHub Release. OIDC trusted publishing is VER-007.
author: victor-software-house
branding:
  icon: package
  color: gray-dark

inputs:
  command:
    description: Publish command.
    required: false
    default: mise run ver -- publish
  token:
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: ${{ inputs.command }}
