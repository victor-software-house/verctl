name: verctl publish
description: >-
  After the Version PR merges, publish cargo and bun packages and open
  the GitHub Release. Requires `verctl` on PATH.
author: victor-software-house
branding:
  icon: package
  color: gray-dark

inputs:
  token:
    description: Token for the GitHub Release. Default GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  config:
    description: Path to the declarations file.
    required: false
    default: .ctl/ver.yaml
  dry-run:
    description: Preview only. Set to `true` to skip cargo/bun/GitHub.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        VERCTL_CONFIG: ${{ inputs.config }}
        VERCTL_DRY_RUN: ${{ inputs.dry-run }}
        VERCTL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        extra=()
        if [ "${VERCTL_DRY_RUN}" = true ]; then
          extra+=(--dry-run)
        fi
        exec verctl publish -c "${VERCTL_CONFIG}" "${extra[@]}"
