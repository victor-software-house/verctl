name: verctl publish
description: >-
  After the Version PR merges, publish cargo and bun packages and open
  the GitHub Release. Requires `verctl` on PATH.
author: victor-software-house
branding:
  icon: package
  color: gray-dark

inputs:
  token:
    description: Token for the GitHub Release. Default GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  config:
    description: Path to the declarations file.
    required: false
    default: .ctl/ver.yaml
  dry-run:
    description: Preview only. Set to `true` to skip cargo/bun/GitHub.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Point origin/HEAD at the repository default branch
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        # checkout never creates origin/HEAD, and a shallow checkout of
        # the merge SHA never fetches the default branch. One ref at
        # depth 1 is enough when HEAD is that tip. Do not use
        # GITHUB_REF_NAME: on push it is the branch being pushed.
        # Skip the fetch when the ref is already here (fetch-depth: 0).
        # Bearer extraheader is not a git credential; GitHub git HTTPS
        # wants x-access-token.
        if [ -n "${DEFAULT_BRANCH}" ]; then
          remote="refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git rev-parse --verify "${remote}^{commit}" >/dev/null 2>&1; then
            if [ -n "${GITHUB_TOKEN}" ] && [ -n "${GITHUB_REPOSITORY}" ]; then
              git fetch --depth=1 \
                "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                "+refs/heads/${DEFAULT_BRANCH}:${remote}"
            else
              git fetch --depth=1 origin \
                "+refs/heads/${DEFAULT_BRANCH}:${remote}"
            fi
          fi
          git symbolic-ref refs/remotes/origin/HEAD "${remote}"
        fi
    - name: Publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        VERCTL_CONFIG: ${{ inputs.config }}
        VERCTL_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        extra=()
        if [ "${VERCTL_DRY_RUN}" = true ]; then
          extra+=(--dry-run)
        fi
        exec verctl publish -c "${VERCTL_CONFIG}" "${extra[@]}"
