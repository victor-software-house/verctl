name: verctl publish
description: >-
  After the Version PR merges, publish cargo and bun packages and open
  the GitHub Release. Requires `verctl` on PATH.
author: victor-software-house
branding:
  icon: package
  color: gray-dark

inputs:
  token:
    description: Token for the GitHub Release. Default GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  config:
    description: Path to the declarations file.
    required: false
    default: .ctl/ver.yaml
  dry-run:
    description: Preview only. Set to `true` to skip cargo/bun/GitHub.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Point origin/HEAD at the repository default branch
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        # checkout never creates origin/HEAD, and a shallow checkout of
        # the merge SHA never fetches the default branch. One ref at
        # depth 1 is enough when HEAD is that tip. Do not use
        # GITHUB_REF_NAME: on push it is the branch being pushed.
        if [ -n "${DEFAULT_BRANCH}" ]; then
          extra=()
          if [ -n "${GITHUB_TOKEN}" ]; then
            extra+=(-c "http.https://github.com/.extraheader=AUTHORIZATION: bearer ${GITHUB_TOKEN}")
          fi
          git "${extra[@]}" fetch --depth=1 origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git symbolic-ref refs/remotes/origin/HEAD \
            "refs/remotes/origin/${DEFAULT_BRANCH}"
        fi
    - name: Publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        VERCTL_CONFIG: ${{ inputs.config }}
        VERCTL_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        extra=()
        if [ "${VERCTL_DRY_RUN}" = true ]; then
          extra+=(--dry-run)
        fi
        exec verctl publish -c "${VERCTL_CONFIG}" "${extra[@]}"
