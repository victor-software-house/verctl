name: verctl publish
description: >-
  After the Version PR merges, publish cargo and bun packages and open
  the GitHub Release. Finds `verctl` on PATH, otherwise `mise run ver`.
author: victor-software-house
branding:
  icon: package
  color: gray-dark

inputs:
  token:
    description: Token for the GitHub Release. Default GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
  config:
    description: Path to verctl.toml.
    required: false
    default: verctl.toml
  dry-run:
    description: Preview only. Set to `true` to skip cargo/bun/GitHub.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Publish
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        VERCTL_CONFIG: ${{ inputs.config }}
        VERCTL_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        extra=()
        if [ "${VERCTL_DRY_RUN}" = true ]; then
          extra+=(--dry-run)
        fi
        if command -v verctl >/dev/null 2>&1; then
          exec verctl publish -c "${VERCTL_CONFIG}" "${extra[@]}"
        fi
        exec mise run ver -- publish -c "${VERCTL_CONFIG}" "${extra[@]}"
